<script>
/* ============================================================
   MECHANIC: MARKET (Camp)
   Not a resource — no left-hand row. Workers are ALWAYS upkeep-free
   here (upkeepExempt), since the Market makes gold. One track:

   Sell track (bottom bar) — per-resource sell cards, each with one or
   two selectable bundles, auto-sell (on for every sellable resource
   from the moment it's unlocked — see unlockResource() in upgrades.js),
   a shared pool of sale slots, full up-front resource cost, timed
   payout in gold, cancellable with refund. Wood and Stone are sellable
   (and auto-sellable) from the start.

   Market no longer has a self-upgrade ladder — bundle growth and sale
   slot count are no longer things Market levels up on its own; they're
   now Academy Research Topics (see js/mechanics/academy.js) that call
   growBundle()/setMaxConcurrent() below. The top bar is a reserved-but-
   unused stub (getUpgradeBarPct: () => 0), same convention as every
   other card that doesn't use it.

   Card face: "Bundle resources for gold" until first opened, then blank
   or "Selling – Xs".

   Simple Parts/Tools, Plywood, and Brick were previously placeholder
   sell entries gated behind the old ladder — deleted along with it,
   since none of those resources exist in the game yet. No other
   mechanic reads or produces them (checked), so nothing else is
   affected by their removal. Re-add them here as real sell entries
   whenever those resources actually exist.
   ============================================================ */
(function () {
  'use strict';
  window.OrbWeaver = window.OrbWeaver || {};

  const ID = 'market';
  const SELL_CONFIG = { baseTime: 180, floorTime: 20 };

  // Sellable resources. goldPerUnit derives each bundle's payout
  // (bundleSize × goldPerUnit).
  const SELL_RESOURCES = [
    { id: 'wood',  name: 'Wood',  goldPerUnit: 0.5, bundles: [60, 120] },
    { id: 'stone', name: 'Stone', goldPerUnit: 1,   bundles: [200, 500] }
  ];

  const TIP = 'TIP: Upgrade Wood and Stone Pile. Wood is selling at a loss. Stone Pile selling for small profit.';

  let opened = false;
  let tipVisible = true;

  const sellTrack = window.OrbWeaver.Upgrades.createSellTrack(SELL_RESOURCES, {
    baseTime: SELL_CONFIG.baseTime,
    floorTime: SELL_CONFIG.floorTime,
    getAssigned: () => window.OrbWeaver.Workers.getAssigned(ID),
    getSPW: () => window.OrbWeaver.Upgrades.getBaseSPW()
  });
  window.OrbWeaver.Upgrades.registerTrack(`${ID}:sell`, sellTrack);

  // Wood + Stone are sellable (and auto-sellable) from the start — no
  // upgrade required.
  sellTrack.unlockResource('wood');
  sellTrack.unlockResource('stone');

  const mechanic = {
    id: ID,
    section: 'Camp',
    startHidden: true,
    upkeepExempt: true,
    modalWide: true,
    buildTrackKey: 'sell',
    cardName: () => 'Market',
    onOpen() { opened = true; },
    getStatText() {
      if (!opened) return 'Bundle resources for gold';
      const assigned = window.OrbWeaver.Workers.getAssigned(ID);
      if (assigned === 0 && sellTrack.getSoonestRemaining() != null) return 'Stopped';
      const rem = sellTrack.getSoonestRemaining();
      return rem != null ? `Selling – ${Math.ceil(rem)}s` : '';
    },
    getUpgradeBarPct: () => 0,
    getBuildBarPct: () => sellTrack.getBuildBarPct(),
    getWorkerDesc: () => {
      const assigned = window.OrbWeaver.Workers.getAssigned(ID);
      return assigned === 0 ? '' : `Selling ${window.OrbWeaver.Upgrades.formatRate(assigned * window.OrbWeaver.Upgrades.getBaseSPW())}s faster`;
    },
    patchLiveTrack: () => sellTrack.patchDOM(),
    getSubtitleHtml() {
      const tip = tipVisible ? `<div class="modal-subtitle-tip">${TIP}</div>` : '';
      return tip + `<div class="modal-subtitle-note">Active Workers cost no gold during sales</div>`;
    },
    renderModalHTML() {
      const sellTime = `<span class="sell-time-label">— ${sellTrack.projectedTime().toFixed(1)}s</span>`;
      return `<div class="market-modal"><div class="modal-subsection-label">Sell ${sellTime}</div>${sellTrack.renderCards(ID, 'sell')}</div>`;
    },
    tick(goldAvailable, tickRate) {
      if (tipVisible) {
        const w = window.OrbWeaver.Mechanics.get('wood');
        const s = window.OrbWeaver.Mechanics.get('stone');
        if ((w && w.cardName() !== 'Wood') || (s && s.cardName() !== 'Stone Pit')) tipVisible = false;
      }
      if (window.OrbWeaver.Workers.getAssigned(ID) >= 1) sellTrack.tick(tickRate);
      window.OrbWeaver.Cards.refresh(mechanic);
    }
  };

  /* ---- Save/load ----
     The sell track saves its own per-resource state. Bundle sizes and
     sale-slot count are NOT saved anywhere — they are effects of
     Academy research, replayed on load, so re-tuning them reaches
     existing players. Only this card's own UI state lives here. */
  window.OrbWeaver.Save.register(ID,
    () => ({ o: opened ? 1 : 0, tip: tipVisible ? 1 : 0 }),
    (d) => { opened = !!d.o; tipVisible = !!d.tip; });

  window.OrbWeaver.Mechanics.register(mechanic);
  // Public surface for Academy's Research Topics to drive (bundle growth,
  // concurrent sale slots) — same convention as window.OrbWeaver.Mountains.
  window.OrbWeaver.Market = {
    growBundle: (id, sizes) => sellTrack.setBundles(id, sizes),
    setMaxConcurrent: (n) => sellTrack.setMaxConcurrent(n)
  };
})();

</script>
<script>
/* ============================================================
   MECHANIC: TENTS (Camp) — formerly Campsite
   Not a resource — no left-hand row. One worker pool drives the Tent
   Track (bottom bar):
     - Starts automatically the moment ≥1 worker is assigned — no
       button, same instinct as Wood/Stone's auto-production.
     - Full tent cost is paid up front when a tent starts (no partial
       collection, mirrors Construction's up-front rule).
     - Can't afford the next tent → status 'stopped' (Wood/Stone-style);
       stopped workers here are exempt from gold upkeep via the generic
       mechanic.isBillable() hook.
     - Once started, the timer counts down at a 1s/s base pace plus the
       shared base rate per assigned worker (assigned may drop to 0
       mid-build without canceling it — same as every other timer in
       this codebase).
     - Every completed tent: cost ×1.15, time ×1.05, +1 idle worker to
       the global pool.

   This stays its own bespoke pattern rather than sharing Academy's new
   Upgrades.createConversionTrack() factory — Tents is single-resource,
   auto-repeating, escalating, and needs zero player interaction, while
   Academy's conversion needs multiple recipes, player-picked, flat
   cost, with real modal interaction. Different enough shapes that
   forcing them together would either bloat Tents with UI it doesn't
   need or under-serve Academy.

   Card name is static ("Tents") — no self-upgrade ladder renames it
   anymore. The top bar is a reserved-but-unused stub
   (getUpgradeBarPct: () => 0), same convention as every other card
   that doesn't use it.

   Stats block: a vertically-stacked section, patched every tick via
   patchLiveTrack() (same "patch, don't rebuild" rule as everything
   else with live modal content). Worker Locations groups by
   mechanic.section (see workers.js/every mechanic file) — today every
   mechanic hard-codes 'Camp', but the block itself is already generic
   per-section grouping.
   ============================================================ */
(function () {
  'use strict';
  window.OrbWeaver = window.OrbWeaver || {};

  const ID = 'tents';
  const TENT_RESOURCE = 'wood';
  const TENT_BASE_COST = 20;
  const TENT_COST_GROWTH = 1.66;
  const TENT_BASE_TIME = 3;
  const TENT_TIME_GROWTH = 1.33;

  let tentsBuilt = 0;
  let status = 'idle'; // idle | stopped | producing
  let timeRemaining = null;
  let currentTentTime = null; // total build time for the tent currently in progress
  let goldStarved = false;

  function tentCost() { return TENT_BASE_COST * Math.pow(TENT_COST_GROWTH, tentsBuilt); }
  function tentTime() { return TENT_BASE_TIME * Math.pow(TENT_TIME_GROWTH, tentsBuilt); }

  function tryStartTent() {
    const cost = tentCost();
    if (window.OrbWeaver.Resources.get(TENT_RESOURCE) >= cost) {
      window.OrbWeaver.Resources.spend(TENT_RESOURCE, cost);
      currentTentTime = tentTime();
      timeRemaining = currentTentTime;
      status = 'producing';
    } else {
      status = 'stopped';
    }
  }

  function completeTent() {
    tentsBuilt++;
    timeRemaining = null;
    currentTentTime = null;
    status = 'idle';
    window.OrbWeaver.Workers.addWorkers(1);
    window.OrbWeaver.Footer.push('A tent was built! +1 idle worker.');
  }

  function statsData() {
    const population = window.OrbWeaver.Workers.getTotal();
    const idle = window.OrbWeaver.Workers.getIdleCount();
    const assignedParts = [];
    const locationTotals = {};
    window.OrbWeaver.Mechanics.all().forEach((m) => {
      const a = window.OrbWeaver.Workers.getAssigned(m.id);
      if (a <= 0) return;
      assignedParts.push(`${a} ${m.cardName()}`);
      const sec = m.section || 'Camp';
      locationTotals[sec] = (locationTotals[sec] || 0) + a;
    });
    return {
      tents: String(tentsBuilt),
      population: String(population),
      idle: String(idle),
      assigned: assignedParts.length ? assignedParts.join(', ') : 'None',
      locations: Object.entries(locationTotals).map(([s, n]) => `${s}: ${n}`).join(', ') || 'Camp: 0',
      nextTent: `${Math.round(tentCost())} wood, ${tentTime().toFixed(1)}s`
    };
  }

  function renderStatsBlock() {
    const s = statsData();
    const row = (label, key) => `<div class="stat-row"><span class="stat-label">${label}</span><span class="stat-val" data-stat="${key}">${s[key]}</span></div>`;
    return `<div class="stats-block">` +
      row('Tents Built', 'tents') +
      row('Total Population', 'population') +
      row('Idle Workers', 'idle') +
      row('Workers Assigned', 'assigned') +
      row('Worker Locations', 'locations') +
      row('Next Tent', 'nextTent') +
    `</div>`;
  }

  function patchStatsBlock() {
    const s = statsData();
    Object.keys(s).forEach((key) => {
      const el = document.querySelector(`#card-modal-body [data-stat="${key}"]`);
      if (el) el.textContent = s[key];
    });
  }

  const mechanic = {
    id: ID,
    startHidden: true,
    section: 'Camp',
    cardName: () => 'Tents',
    isBillable: () => status !== 'stopped',
    getStatText() {
      if (status === 'producing') return goldStarved ? `Stopped – pitching tent` : `Pitching Tent – ${Math.round(tentCost())} wood, ${Math.max(0, timeRemaining).toFixed(1)}s remaining`;
      if (status === 'stopped') return `Stopped – ${Math.round(tentCost())} wood, ${tentTime().toFixed(1)}s`;
      if (goldStarved && window.OrbWeaver.Workers.getAssigned(ID) > 0) return 'Stopped';
      return `Next – ${Math.round(tentCost())} wood, ${tentTime().toFixed(1)}s`;
    },
    getUpgradeBarPct: () => 0,
    isBuildBarFaded: () => status === 'stopped',
    getBuildBarPct() {
      if (status === 'producing' && timeRemaining != null && currentTentTime)
        return Math.min(100, ((currentTentTime - timeRemaining) / currentTentTime) * 100);
      if (status === 'stopped') {
        const wood = window.OrbWeaver.Resources.get(TENT_RESOURCE);
        return Math.min(100, (wood / tentCost()) * 100);
      }
      return 0;
    },
    getWorkerDesc: () => {
      const assigned = window.OrbWeaver.Workers.getAssigned(ID);
      return assigned === 0 ? '' : `Pitching ${window.OrbWeaver.Upgrades.formatRate(assigned * window.OrbWeaver.Upgrades.getBaseSPW())}s faster`;
    },
    patchLiveTrack: () => patchStatsBlock(),
    renderModalHTML() {
      return `<div class="tents-modal"><div class="modal-subsection-label">Stats</div>${renderStatsBlock()}</div>`;
    },
    tick(goldAvailable, tickRate) {
      goldStarved = !goldAvailable;
      const assigned = window.OrbWeaver.Workers.getAssigned(ID);
      const spw = window.OrbWeaver.Upgrades.getBaseSPW();

      if (status === 'producing' && assigned === 0) {
        window.OrbWeaver.Resources.add(TENT_RESOURCE, Math.round(tentCost()));
        status = 'idle'; timeRemaining = null; currentTentTime = null;
      } else if (status !== 'producing' && assigned > 0 && goldAvailable) tryStartTent();
      else if (status !== 'producing' && assigned === 0) status = 'idle';

      if (status === 'producing' && goldAvailable) {
        timeRemaining -= tickRate + (assigned * spw * tickRate);
        if (timeRemaining <= 0) completeTent();
      }

      window.OrbWeaver.Cards.refresh(mechanic);
    }
  };

  /* ---- Save/load ----
     tentsBuilt is the seed: the next tent's cost and time are always
     recomputed from it, so rebalancing the growth curve later reaches
     existing saves. The in-progress tent's timer is preserved as-is. */
  window.OrbWeaver.Save.register(ID,
    () => ({ n: tentsBuilt, st: status, t: timeRemaining, ct: currentTentTime }),
    (d) => {
      tentsBuilt = d.n || 0;
      status = d.st || 'idle';
      timeRemaining = d.t != null ? d.t : null;
      currentTentTime = d.ct != null ? d.ct : null;
    });

  window.OrbWeaver.Mechanics.register(mechanic);
})();

</script>
<script>
/* ============================================================
   MECHANIC: ACADEMY (Camp)
   Built via Camp's Construction list (550 wood, 550 stone). Two
   independent tracks off one worker pool — deliberately the reverse
   of the usual top/bottom convention:

   1) Research Progress (TOP bar, choice track) — one-time Research
      Topics, costed in Journals, each with a cross-mechanic effect
      (growing Market's bundle sizes, raising its concurrent sale
      slots, and — later — unlocking higher-tier conversion recipes
      below). Reuses the same choice-track factory Camp's own
      Construction list uses, just costed in Journals instead of camp
      resources.

   2) Papers → Journals (BOTTOM bar, conversion track) — Research
      Papers convert into Journals on a timer, via the shared
      Upgrades.createConversionTrack() factory (js/core/upgrades.js).
      Flat cost/time — no escalation. Recipes start locked except the
      first; Research Topics above can unlock further tiers later
      (e.g. a higher-grade Papers type → more Journals per batch).
      Auto-toggle and the concurrent-slot count are inherited from the
      factory for free, same as Market's sell cards.

   Research Papers has no producer yet — Mountains and the upcoming
   pyramid card will add one in a later session. The resource exists
   now (hidden until Academy is built) purely so this card's recipe
   has something to check against; cheat buttons (Journals, Research
   Papers) exist in the meantime so Academy is testable on its own.
   ============================================================ */
(function () {
  'use strict';
  window.OrbWeaver = window.OrbWeaver || {};

  const ID = 'academy';

  // Research Topics — Journals-costed, one-time unlocks. Placeholder
  // costs/times, freely editable, same convention as every other
  // invented number in this project.
  const RESEARCH_TOPICS = [
    { id: 'woodbundle2', name: 'Bulk Wood Trade', buildTime: 30, costRaw: '5 journals', startAvailable: true,
      apply: () => window.OrbWeaver.Market.growBundle('wood', [200, 500]) },
    { id: 'woodbundle3', name: 'Mass Wood Trade', buildTime: 60, costRaw: '10 journals', startAvailable: true,
      apply: () => window.OrbWeaver.Market.growBundle('wood', [500, 1000]) },
    { id: 'marketslot2', name: 'Second Sale Slot', buildTime: 45, costRaw: '15 journals', startAvailable: true,
      apply: () => window.OrbWeaver.Market.setMaxConcurrent(2) },
    { id: 'marketslot3', name: 'Third Sale Slot', buildTime: 90, costRaw: '20 journals', startAvailable: true,
      apply: () => window.OrbWeaver.Market.setMaxConcurrent(3) }
  ];
  function onTopicComplete(id, item) { item.apply(); }
  const topicsTrack = window.OrbWeaver.Upgrades.createChoiceTrack(RESEARCH_TOPICS, onTopicComplete);
  window.OrbWeaver.Upgrades.registerTrack(`${ID}:topics`, topicsTrack);

  // Papers → Journals conversion. Flat cost/time — no escalation.
  // 25 Research Papers per Journal, placeholder 20s batch time.
  const CONVERSION_RECIPES = [
    { id: 'papers1', name: 'Research Papers', costRaw: '25 researchpapers', buildTime: 20,
      outputId: 'journals', outputAmount: 1, outputName: 'Journal', startUnlocked: true }
  ];
  const conversionTrack = window.OrbWeaver.Upgrades.createConversionTrack(CONVERSION_RECIPES, {
    getAssigned: () => window.OrbWeaver.Workers.getAssigned(ID),
    getSPW: () => window.OrbWeaver.Upgrades.getBaseSPW()
  });
  window.OrbWeaver.Upgrades.registerTrack(`${ID}:conversion`, conversionTrack);

  let opened = false;
  let goldStarved = false;

  const mechanic = {
    id: ID,
    startHidden: true,
    section: 'Camp',
    upgradeTrackKey: 'topics',
    buildTrackKey: 'conversion',
    cardName: () => 'Academy',
    onOpen() { opened = true; },
    getStatText() {
      if (!opened) return 'Research and development';
      if (goldStarved && window.OrbWeaver.Workers.getAssigned(ID) > 0) return 'Stopped';
      const rem = conversionTrack.getSoonestRemaining();
      return rem != null ? `Converting – ${Math.ceil(rem)}s` : '';
    },
    getUpgradeBarPct: () => topicsTrack.getProgressPct(),
    getBuildBarPct: () => conversionTrack.getBuildBarPct(),
    getWorkerDesc: () => {
      const assigned = window.OrbWeaver.Workers.getAssigned(ID);
      return assigned === 0 ? '' : `Converts ${window.OrbWeaver.Upgrades.formatRate(assigned * window.OrbWeaver.Upgrades.getBaseSPW())}s faster`;
    },
    cheatCompleteAll() { topicsTrack.completeAll(); },
    patchLiveTrack() { topicsTrack.patchModalRows(); conversionTrack.patchDOM(); },
    renderModalHTML() {
      return `<div class="academy-modal">` +
        `<div class="modal-subsection-label">Research Progress</div>${topicsTrack.renderModalRows(ID, 'topics')}` +
        `<div class="modal-subsection-label divider-top">Conversion</div>${conversionTrack.renderCards(ID, 'conversion')}` +
      `</div>`;
    },
    tick(goldAvailable, tickRate) {
      goldStarved = !goldAvailable;
      const assigned = window.OrbWeaver.Workers.getAssigned(ID);
      if (goldAvailable) {
        if (topicsTrack.isBuilding()) topicsTrack.advanceTimer(tickRate, assigned, window.OrbWeaver.Upgrades.getBaseSPW());
        conversionTrack.tick(tickRate);
      }
      window.OrbWeaver.Cards.refresh(mechanic);
    }
  };

  /* ---- Save/load ----
     Both tracks save themselves. Completed Research Topics replay their
     apply() on load, which is how their cross-mechanic effects (Market
     bundle growth, extra sale slots) are restored — the effect is
     recomputed from the fact that the topic was researched, never
     stored as a number. */
  window.OrbWeaver.Save.register(ID,
    () => ({ o: opened ? 1 : 0 }),
    (d) => { opened = !!d.o; });

  window.OrbWeaver.Mechanics.register(mechanic);
})();

</script>
<script>
/* ============================================================
   MECHANIC: MOUNTAINS (Section B, blue theme)
   Discovered once by Scout Stable's first Expedition Mule (see
   js/mechanics/scoutspen.js), which calls Mountains.reveal() and
   Mountains.addWorkers(n) directly. Mountains has its own resource
   pool (mtn_ prefix, never mixes with Camp's) and its own assignable
   worker pool (own idle/total, separate from Camp's) — riders who
   travel here join this pool, not Camp's.

   Workers assigned to the Mountains card can be sub-allocated to
   Hike the Lower Range and Prepare Stone Quarry via in-modal steppers.
   Sub-slot workers are drawn from the Mountains card's assigned count.
   If no free Mountains card workers exist, adding to a sub-slot will
   auto-promote one from the Mountain category pool (do nothing if
   category pool is also empty).

   Workers assigned here still drain Camp's shared Gold (see
   js/core/upkeep.js) — Gold is the one resource every location draws
   from together.
   ============================================================ */
(function () {
  'use strict';
  window.OrbWeaver = window.OrbWeaver || {};

  const ID = 'mountains';
  const PREFIX = 'mtn_';
  const WOOD_ID = PREFIX + 'wood';
  const STONE_ID = PREFIX + 'stone';
  let discovered = false;
  let opened = false;
  let mtnMount = null;
  const pool = window.OrbWeaver.Workers.createPool(0, 'mountains');

  const OUTPOST_ITEMS = [
    { id: 'outpost', name: 'Outpost on the Frontier', buildTime: 45, costRaw: `200 ${WOOD_ID}`, startAvailable: true }
  ];

  // Quarry build — gradual resource drain over 45s, stalls if resources run out
  const QUARRY_WOOD_COST = 500, QUARRY_STONE_COST = 100, QUARRY_BUILD_TIME = 45;
  let quarryPhase = 'idle'; // idle | building | done
  let quarryWoodDrained = 0, quarryStoneDrained = 0, quarryTimeRemaining = QUARRY_BUILD_TIME;
  let quarryStalled = false;
  let quarryWorkers = 0;

  // Hike the Lower Range — pure timer, workers only
  const HIKE_TIME = 120;
  let hikePhase = 'idle'; // idle | exploring | done
  let hikeProgress = 0; // seconds elapsed
  let hikeWorkers = 0;

  // Free workers on the Mountains card available for sub-slot assignment
  function freeCardWorkers() { return pool.getAssigned(ID) - hikeWorkers - quarryWorkers; }

  // Add a worker to a sub-slot. Promotes from category pool if card has none free.
  function subAssign(subSlot) {
    if (freeCardWorkers() <= 0) {
      if (!pool.assign(ID)) return; // category pool empty — do nothing
    }
    if (subSlot === 'hike') hikeWorkers++;
    else quarryWorkers++;
    window.OrbWeaver.Cards.refreshOpenModal(ID);
    window.OrbWeaver.Cards.refresh(mechanic);
  }

  // Remove a worker from a sub-slot, returning it to Mountains card free pool.
  function subUnassign(subSlot) {
    if (subSlot === 'hike' && hikeWorkers > 0) hikeWorkers--;
    else if (subSlot === 'quarry' && quarryWorkers > 0) quarryWorkers--;
    else return;
    window.OrbWeaver.Cards.refreshOpenModal(ID);
    window.OrbWeaver.Cards.refresh(mechanic);
  }

  function onStageComplete(id) {
    if (id === 'outpost') {
      window.OrbWeaver.Cards.reveal(window.OrbWeaver.Mechanics.get('mtn_scoutstable'));
      quarryPhase = 'idle';
    }
    window.OrbWeaver.Cards.refreshOpenModal(ID);
  }

  const stageTrack = window.OrbWeaver.Upgrades.createChoiceTrack(OUTPOST_ITEMS, onStageComplete);
  window.OrbWeaver.Upgrades.registerTrack(`${ID}:stage`, stageTrack);

  function ensureResource(baseId, name) {
    const id = PREFIX + baseId;
    window.OrbWeaver.Resources.ensure(id, { name, mount: mtnMount, current: 0, displayType: 'decimal', hidden: false });
    return id;
  }

  function initWorkersRow(mount) { mtnMount = mount; pool.init(mount); }

  // Renders a sub-slot stepper row for use inside the modal detail cards
  function stepperHtml(slot, count, label) {
    return `<div class="card-steppers visible" style="margin-top:4px">
      <button class="card-stepper-btn" data-mtn-sub="${slot}" data-mtn-sub-action="remove" ${count <= 0 ? 'disabled' : ''}>−</button>
      <span class="card-stepper-val">${count}</span>
      <button class="card-stepper-btn" data-mtn-sub="${slot}" data-mtn-sub-action="add">+</button>
      <span class="detail-card-desc" style="margin-left:4px">${label}</span>
    </div>`;
  }

  const mechanic = {
    id: ID,
    startHidden: true,
    section: 'Mountains',
    modalTheme: 'theme-mountains',
    buildTrackKey: 'quarry',
    getBuildBarTrackKey: () => (stageTrack.isBuilding() || stageTrack.getQueuedItem()) ? 'stage' : 'quarry',
    upgradeTrackKey: 'hike',
    workerPool: pool,
    cardName: () => 'Mountains',
    isBillable: () => stageTrack.isBuilding() || quarryPhase === 'building' || hikePhase === 'exploring',
    isBuildBarFaded: () => stageTrack.getQueuedItem() !== null && !stageTrack.isBuilding(),
    onOpen() { opened = true; },
    getStatText() {
      if (!opened) return '';
      // Stopped only when BOTH active sub-tasks have workers but neither is progressing
      const hikeStopped = hikeWorkers > 0 && hikePhase !== 'exploring' && hikePhase !== 'done';
      const quarryStopped = quarryWorkers > 0 && quarryPhase !== 'building' && quarryPhase !== 'done';
      if (hikeStopped && quarryStopped) return 'Stopped';
      if (stageTrack.isBuilding()) {
        const item = stageTrack.activeItem();
        const secs = Math.ceil(stageTrack.getRemaining());
        return pool.getAssigned(ID) === 0 ? `Stopped ${item.name} – ${secs}s` : `Building ${item.name} – ${secs}s`;
      }
      const queued = stageTrack.getQueuedItem();
      if (queued) return `Queued ${queued.name} – waiting`;
      const remaining = stageTrack.availableCount();
      if (remaining <= 0) return '';
      return pool.getAssigned(ID) > 0 ? `Stopped – ${remaining} to build` : `${remaining} to build`;
    },
    getUpgradeBarPct: () => hikePhase === 'done' ? 100 : Math.min(100, (hikeProgress / HIKE_TIME) * 100),
    getBuildBarPct() {
      if (stageTrack.isBuilding()) return stageTrack.getProgressPct();
      if (stageTrack.getQueuedItem()) return stageTrack.getQueueFillPct();
      if (quarryPhase === 'done') return 100;
      if (quarryPhase === 'building') {
        const woodPct = Math.min(100, (quarryWoodDrained / QUARRY_WOOD_COST) * 100);
        const stonePct = Math.min(100, (quarryStoneDrained / QUARRY_STONE_COST) * 100);
        return (woodPct + stonePct) / 2;
      }
      return 0;
    },
    getWorkerDesc: () => {
      const assigned = pool.getAssigned(ID);
      return assigned === 0 ? '' : `Builds ${window.OrbWeaver.Upgrades.formatRate(assigned * window.OrbWeaver.Upgrades.getBaseSPW())}s faster`;
    },
    hideUpgradeBar: () => hikePhase === 'done',
    hideBuildBar: () => quarryPhase === 'done' && !stageTrack.isBuilding() && !stageTrack.getQueuedItem(),
    patchLiveTrack() {
      if (!stageTrack.isBuilding()) stageTrack.patchModalRows();
      if (quarryPhase === 'building') {
        const statusEl = document.querySelector('#card-modal-body .detail-status span');
        if (statusEl) statusEl.textContent = quarryStalled ? 'Stopped – waiting for resources' : '';
        const descEl = document.querySelector('#card-modal-body .quarry-desc');
        if (descEl) descEl.textContent = `Wood: ${quarryWoodDrained.toFixed(1)}/${QUARRY_WOOD_COST} | Stone: ${quarryStoneDrained.toFixed(1)}/${QUARRY_STONE_COST} | ${Math.ceil(quarryTimeRemaining)}s remaining`;
      }
      if (hikePhase === 'exploring') {
        const hikeDescEl = document.querySelector('#card-modal-body .hike-desc');
        if (hikeDescEl) hikeDescEl.textContent = `${Math.ceil(Math.max(0, HIKE_TIME - hikeProgress))}s remaining`;
      }
    },
    renderModalHTML() {
      const outpostDone = stageTrack.availableCount() === 0 && !stageTrack.isBuilding();
      let postOutpost = '';
      if (outpostDone) {
        // Quarry section
        let quarrySection = '';
        if (quarryPhase === 'done') {
          quarrySection = `<div class="detail-card"><div class="detail-card-desc">Stone Quarry established.</div></div>`;
        } else if (quarryPhase === 'building') {
          const woodPct = Math.min(100, (quarryWoodDrained / QUARRY_WOOD_COST) * 100).toFixed(1);
          const stonePct = Math.min(100, (quarryStoneDrained / QUARRY_STONE_COST) * 100).toFixed(1);
          const secs = Math.ceil(quarryTimeRemaining);
          const stallText = quarryStalled ? '<div class="detail-status"><span>Stopped – waiting for resources</span></div>' : '';
          quarrySection = `
            <div class="detail-card">
              <div class="detail-card-name">Prepare Stone Quarry</div>
              ${stallText}
              <div class="detail-card-desc quarry-desc">Wood: ${quarryWoodDrained.toFixed(1)}/${QUARRY_WOOD_COST} | Stone: ${quarryStoneDrained.toFixed(1)}/${QUARRY_STONE_COST} | ${secs}s remaining</div>
              <div class="detail-progress-wrap"><div class="detail-progress-bar" data-track="quarry"></div></div>
              ${stepperHtml('quarry', quarryWorkers, 'workers')}
              <button class="action-btn" data-mtn-action="cancel-quarry">Cancel</button>
            </div>`;
        } else {
          quarrySection = `
            <div class="detail-card">
              <div class="detail-card-name">Prepare Stone Quarry</div>
              <div class="detail-card-desc">Costs 500 wood and 100 stone over 45 seconds. Reveals the Quarry card.</div>
              ${stepperHtml('quarry', quarryWorkers, 'workers')}
              <button class="action-btn" data-mtn-action="start-quarry">Build</button>
            </div>`;
        }

        // Hike section
        let hikeSection = '';
        if (hikePhase === 'done') {
          hikeSection = `<div class="detail-card"><div class="detail-card-name">Hike the Lower Range</div><div class="detail-card-desc">TBD</div></div>`;
        } else {
          const hikePct = Math.min(100, (hikeProgress / HIKE_TIME) * 100).toFixed(1);
          const hikeRemaining = Math.ceil(Math.max(0, HIKE_TIME - hikeProgress));
          hikeSection = `
            <div class="detail-card">
              <div class="detail-card-name">Hike the Lower Range</div>
              <div class="detail-card-desc">Hike the lower range.</div>
              <div class="detail-progress-wrap"><div class="detail-progress-bar" data-track="hike"></div></div>
              <div class="detail-card-desc hike-desc">${hikePhase === 'exploring' ? `${hikeRemaining}s remaining` : 'Assign workers to begin.'}</div>
              ${stepperHtml('hike', hikeWorkers, 'workers')}
            </div>`;
        }

        postOutpost = `
          <div class="bench-modal-divider"></div>
          <div class="detail-card-desc detail-flavor">"Your Outpost sits before the lower Mountain range."</div>
          ${hikeSection}
          ${quarrySection}`;
      }
      return `<div class="bench-modal">${stageTrack.renderModalRows(ID, 'stage')}${postOutpost}</div>`;
    },
    tick(goldAvailable, tickRate) {
      const assigned = pool.getAssigned(ID);
      const spw = window.OrbWeaver.Upgrades.getBaseSPW();

      const queued = stageTrack.getQueuedItem();
      const freeWorkers = freeCardWorkers();
      if (queued && freeWorkers > 0) {
        stageTrack.start(queued.id);
        if (stageTrack.isBuilding()) stageTrack.dequeue();
      }
      if (stageTrack.isBuilding() && freeWorkers > 0) stageTrack.advanceTimer(tickRate, freeWorkers, spw);

      // Quarry gradual build
      if (quarryPhase === 'building' && quarryWorkers > 0) {
        const woodNeeded = QUARRY_WOOD_COST - quarryWoodDrained;
        const stoneNeeded = QUARRY_STONE_COST - quarryStoneDrained;
        const woodAvail = window.OrbWeaver.Resources.get(WOOD_ID);
        const stoneAvail = window.OrbWeaver.Resources.get(STONE_ID);
        quarryStalled = (woodNeeded > 0 && woodAvail <= 0) || (stoneNeeded > 0 && stoneAvail <= 0);
        if (!quarryStalled) {
          const rate = tickRate / QUARRY_BUILD_TIME;
          const woodTick = Math.min(woodNeeded, QUARRY_WOOD_COST * rate);
          const stoneTick = Math.min(stoneNeeded, QUARRY_STONE_COST * rate);
          quarryWoodDrained += window.OrbWeaver.Resources.spend(WOOD_ID, woodTick);
          quarryStoneDrained += window.OrbWeaver.Resources.spend(STONE_ID, stoneTick);
          quarryTimeRemaining -= tickRate + (quarryWorkers * spw * tickRate);
          if (quarryWoodDrained >= QUARRY_WOOD_COST && quarryStoneDrained >= QUARRY_STONE_COST || quarryTimeRemaining <= 0) {
            quarryPhase = 'done';
            quarryTimeRemaining = 0;
            window.OrbWeaver.Cards.reveal(window.OrbWeaver.Mechanics.get('quarry'));
            window.OrbWeaver.Footer.push('Stone Quarry established!');
            window.OrbWeaver.Cards.refreshOpenModal(ID);
          }
        }
      }

      // Hike — pure timer, workers only
      if (hikePhase !== 'done' && hikeWorkers > 0) {
        hikePhase = 'exploring';
        hikeProgress += tickRate + (hikeWorkers * spw * tickRate);
        if (hikeProgress >= HIKE_TIME) {
          hikeProgress = HIKE_TIME;
          hikePhase = 'done';
          window.OrbWeaver.Footer.push('You have hiked the lower range.');
          window.OrbWeaver.Cards.refreshOpenModal(ID);
        }
      } else if (hikePhase === 'exploring' && hikeWorkers === 0) {
        hikePhase = 'idle';
      }

      window.OrbWeaver.Cards.refresh(mechanic);
    }
  };

  function reveal() {
    if (discovered) return;
    discovered = true;
    document.getElementById('mountains-section').style.display = '';
    document.getElementById('left-hand-mountains-group').style.display = '';
    document.getElementById('camp-section-label').style.display = '';
    window.OrbWeaver.Resources.reveal(WOOD_ID);
    window.OrbWeaver.Resources.reveal(STONE_ID);
    window.OrbWeaver.Cards.reveal(mechanic);
  }

  /* ---- Save/load ----
     The Outpost stage track saves itself. What lives here is the two
     hand-rolled sub-tasks and their sub-slot worker counts, which are a
     SUBSET of the workers already assigned to the Mountains card — the
     pool records the assignment, these record how it is divided, and
     both must come back or the split silently drifts. Quarry's drained
     totals are real spent resources and are preserved exactly, so a
     cancel after loading still refunds the right amount. */
  window.OrbWeaver.Save.register(ID,
    () => ({
      d: discovered ? 1 : 0, o: opened ? 1 : 0,
      qp: quarryPhase, qw: quarryWoodDrained, qs: quarryStoneDrained,
      qt: quarryTimeRemaining, qn: quarryWorkers,
      hp: hikePhase, hg: hikeProgress, hn: hikeWorkers
    }),
    (d) => {
      opened = !!d.o;
      quarryPhase = d.qp || 'idle';
      quarryWoodDrained = d.qw || 0;
      quarryStoneDrained = d.qs || 0;
      quarryTimeRemaining = d.qt != null ? d.qt : QUARRY_BUILD_TIME;
      quarryWorkers = d.qn || 0;
      hikePhase = d.hp || 'idle';
      hikeProgress = d.hg || 0;
      hikeWorkers = d.hn || 0;
      if (d.d) reveal();
    });

  window.OrbWeaver.Mechanics.register(mechanic);

  document.addEventListener('click', (e) => {
    // Sub-slot stepper buttons
    const subBtn = e.target.closest('[data-mtn-sub]');
    if (subBtn) {
      const slot = subBtn.dataset.mtnSub;
      const action = subBtn.dataset.mtnSubAction;
      if (action === 'add') subAssign(slot);
      else if (action === 'remove') subUnassign(slot);
      return;
    }
    const btn = e.target.closest('[data-mtn-action]');
    if (!btn) return;
    if (btn.dataset.mtnAction === 'start-quarry' && quarryPhase === 'idle') {
      quarryPhase = 'building';
      quarryWoodDrained = 0; quarryStoneDrained = 0;
      quarryTimeRemaining = QUARRY_BUILD_TIME; quarryStalled = false;
      window.OrbWeaver.Cards.refreshOpenModal(ID);
    } else if (btn.dataset.mtnAction === 'cancel-quarry' && quarryPhase === 'building') {
      window.OrbWeaver.Resources.add(WOOD_ID, quarryWoodDrained);
      window.OrbWeaver.Resources.add(STONE_ID, quarryStoneDrained);
      quarryPhase = 'idle';
      quarryWoodDrained = 0; quarryStoneDrained = 0;
      quarryTimeRemaining = QUARRY_BUILD_TIME; quarryStalled = false;
      window.OrbWeaver.Cards.refreshOpenModal(ID);
    }
  });

  window.OrbWeaver.Mountains = {
    id: ID, label: 'Mountains', prefix: PREFIX, woodId: WOOD_ID, stoneId: STONE_ID, workerPool: pool,
    initWorkersRow, addWorkers: (n) => pool.addWorkers(n), ensureResource, reveal, isDiscovered: () => discovered
  };
  window.OrbWeaver.Locations.register(window.OrbWeaver.Mountains);
})();

</script>
<script>
/* ============================================================
   MECHANIC: MOUNTAIN SCOUT STABLE
   Thin config for js/core/scoutstable.js — same "Scout Stable" card,
   same Resupply Mule / Cart and Bull cargo vehicles, as Camp's, just
   living in the Mountains section and drawing from Mountains' own
   worker pool and resource pool (mtn_ prefix). Revealed by Mountains'
   "Outpost on the Frontier" stage (see js/mechanics/mountains.js).
   No initial Expedition — every non-Camp Scout Stable starts (and
   stays) on the greyed Expedition tab; see js/core/scoutstable.js.
   ============================================================ */
(function () {
  'use strict';
  window.OrbWeaver = window.OrbWeaver || {};

  window.OrbWeaver.ScoutStable.create({
    id: 'mtn_scoutstable',
    locationId: 'mountains',
    section: 'Mountains',
    modalTheme: 'theme-mountains',
    resourcePrefix: window.OrbWeaver.Mountains.prefix,
    workerPool: window.OrbWeaver.Mountains.workerPool,
    vehicles: {
      mule:     { id: 'mtn_resupplymule', cap: 200,  travel: 15, label: 'Resupply Mule' },
      cartbull: { id: 'mtn_cartbull',     cap: 1000, travel: 60, label: 'Cart and Bull' }
    },
    hasInitialExpedition: false
  });
})();

</script>
<script>
/* ============================================================
   MECHANIC: QUARRY (Mountains)
   Resource card producing mtn_stone. Mirrors stone.js but with
   doubled worker contribution, upgrade costs, and rewards.
   Starts hidden — revealed when Mountains completes Prepare Stone Quarry.
   Uses Mountains' own worker pool (mtn_ prefix throughout).
   ============================================================ */
(function () {
  'use strict';
  window.OrbWeaver = window.OrbWeaver || {};

  const ID = 'quarry';
  const RES = 'mtn_stone';
  const pool = window.OrbWeaver.Mountains.workerPool;

  const UPGRADE_TABLE = [
    { name: 'TBD1', gainPerWorker: 4.52,  buildTime: 120, costRaw: '900 mtn_stone',                newCap: 1200  },
    { name: 'TBD2', gainPerWorker: 6.78,  buildTime: 240, costRaw: '1200 mtn_stone, 100 mtn_wood', newCap: 1400  },
  ];

  let cardName = 'Quarry';
  let gainPerWorker = 2.26;
  let status = 'idle';

  const track = window.OrbWeaver.Upgrades.create(UPGRADE_TABLE);
  window.OrbWeaver.Upgrades.registerTrack(ID, track);

  const mechanic = {
    id: ID,
    startHidden: true,
    section: 'Mountains',
    workerPool: pool,
    cardName: () => cardName,
    getStatText() {
      const assigned = pool.getAssigned(ID);
      const collecting = track.isCollecting();
      if (assigned === 0) return collecting ? 'Collecting' : '';
      if (status === 'stopped') return collecting ? 'Stopped – Collecting' : 'Stopped';
      return `${(assigned * gainPerWorker).toFixed(2)}/s${collecting ? ' – Collecting' : ''}`;
    },
    getUpgradeBarPct: () => track.getBarPct(),
    isUpgradeCollecting: () => track.isCollecting(),
    getWorkerDesc: () => {
      const assigned = pool.getAssigned(ID);
      return assigned === 0 ? '' : `Chisels ${window.OrbWeaver.Upgrades.formatRate(assigned * gainPerWorker)} stone`;
    },
    patchUpgradeCost: () => track.getResourceTracker(),
    patchCollectPct: () => track.getCollectPct(),
    patchBuildStatus: () => track.getBuildStatusText(),
    cheatCompleteAll() {
      track.skipAll((row) => { cardName = row.name; gainPerWorker = row.gainPerWorker; window.OrbWeaver.Resources.setCap(RES, row.newCap); });
    },
    renderModalHTML: () => track.renderModalHTML(ID, { cap: window.OrbWeaver.Resources.getCap(RES), rate: gainPerWorker }),
    tick(goldAvailable, tickRate) {
      const assigned = pool.getAssigned(ID);
      const atCap = window.OrbWeaver.Resources.isAtCap(RES);
      if (assigned === 0) {
        status = 'idle';
        window.OrbWeaver.Resources.setSubRate(RES, null);
      } else if (!goldAvailable || atCap) {
        status = 'stopped';
        window.OrbWeaver.Resources.setSubRate(RES, atCap ? `+${(assigned * gainPerWorker).toFixed(2)}/s` : null);
      } else {
        status = 'producing';
        const perSec = assigned * gainPerWorker;
        window.OrbWeaver.Resources.add(RES, perSec * tickRate);
        window.OrbWeaver.Resources.setSubRate(RES, `+${perSec.toFixed(2)}/s`);
      }
      if (track.isBuilding()) {
        track.advanceTimer(tickRate, assigned, (row) => {
          cardName = row.name;
          gainPerWorker = row.gainPerWorker;
          window.OrbWeaver.Resources.setCap(RES, row.newCap);
        });
      }
      window.OrbWeaver.Cards.refresh(mechanic);
    }
  };

  /* ---- Save/load ----
     Nothing of this card's own is stored. cardName, gainPerWorker and
     the resource cap are all DERIVED from how far up the ladder the
     player is, so the track's index (saved by the track itself) is the
     entire state. Replaying the table on load means editing these
     numbers later reaches existing saves instead of stranding players
     on whatever values they last played with. */
  window.OrbWeaver.Save.register(ID, null, () => {
    // Only the LAST completed row is applied. Walking the table row by
    // row would call setCap() with each tier's smaller cap in turn, and
    // setCap clamps current down to the new cap — which silently robbed
    // the player of everything above tier one's cap on every load.
    const reached = Math.min(track.getIndex(), UPGRADE_TABLE.length);
    if (reached <= 0) return;
    const row = UPGRADE_TABLE[reached - 1];
    if (!row) return;
    cardName = row.name;
    gainPerWorker = row.gainPerWorker;
    window.OrbWeaver.Resources.setCap(RES, row.newCap);
  });

  window.OrbWeaver.Mechanics.register(mechanic);
})();

</script>
<script>
/* ============================================================
   MECHANIC: SAND DUNES (Section, yellow theme)
   Second cargo destination, same shape Mountains started as: a
   placeholder card with just an idle/total worker counter — no
   resources of its own at launch. Any resource actually gets
   registered here the moment cargo delivers it for the first time
   (see ensureResource()), so nothing needs to be pre-declared.

   Reveal trigger is TBD — planned as a "Mountain passage" found on
   the Mountains card in a later session. Until that exists, reveal()
   is only reachable via the ALL cheat, so this location is visible
   for testing/preview.
   ============================================================ */
(function () {
  'use strict';
  window.OrbWeaver = window.OrbWeaver || {};

  const ID = 'sanddunes';
  const PREFIX = 'sd_';
  let discovered = false;
  let sdTotal = 0, sdIdle = 0, sdValEl = null, sdMount = null;

  function renderSdWorkers() { if (sdValEl) sdValEl.textContent = `${sdIdle}/${sdTotal}`; }

  function initWorkersRow(mount) {
    sdMount = mount;
    const row = document.createElement('div');
    row.className = 'resource-row worker-row';
    row.innerHTML = `<span class="res-name">Workers</span><button class="worker-recall-btn" disabled>–</button><span class="res-val"></span>`;
    mount.appendChild(row);
    sdValEl = row.querySelector('.res-val');
    renderSdWorkers();
  }

  function addWorkers(n) {
    if (n <= 0) return;
    sdTotal += n;
    sdIdle += n;
    renderSdWorkers();
  }

  function ensureResource(baseId, name) {
    const id = PREFIX + baseId;
    window.OrbWeaver.Resources.ensure(id, { name, mount: sdMount, current: 0, displayType: 'decimal', hidden: false });
    return id;
  }

  const mechanic = {
    id: ID,
    startHidden: true,
    section: 'Sand Dunes',
    modalTheme: 'theme-sanddunes',
    stepperReady: () => false,
    cardName: () => 'Sand Dunes',
    getStatText: () => '',
    getUpgradeBarPct: () => 0,
    renderModalHTML: () => `<div class="detail-card"><div class="detail-card-desc">Windswept dunes on the horizon. More to come.</div></div>`,
    tick() { window.OrbWeaver.Cards.refresh(mechanic); }
  };

  function reveal() {
    if (discovered) return;
    discovered = true;
    document.getElementById('sanddunes-section').style.display = '';
    document.getElementById('left-hand-sanddunes-group').style.display = '';
    document.getElementById('camp-section-label').style.display = '';
    window.OrbWeaver.Cards.reveal(mechanic);
  }

  /* ---- Save/load ----
     Sand Dunes keeps a plain idle/total counter rather than a real
     Workers pool (it has nothing to assign to yet), so those two
     numbers are saved here instead of by js/core/workers.js. When it
     grows a real pool, move them to createPool(0, 'sanddunes') and
     delete this. */
  window.OrbWeaver.Save.register(ID,
    () => ({ d: discovered ? 1 : 0, t: sdTotal, i: sdIdle }),
    (d) => {
      sdTotal = d.t || 0;
      sdIdle = d.i || 0;
      renderSdWorkers();
      if (d.d) reveal();
    });

  window.OrbWeaver.Mechanics.register(mechanic);
  window.OrbWeaver.SandDunes = {
    id: ID, label: 'Sand Dunes', prefix: PREFIX,
    initWorkersRow, addWorkers, ensureResource, reveal, isDiscovered: () => discovered
  };
  window.OrbWeaver.Locations.register(window.OrbWeaver.SandDunes);
})();

</script>
<script>
/* ============================================================
   MECHANIC: SCOUT STABLE (Camp) — cardName only; id/file stay
   "scoutspen" (no rename requested beyond the display name).
   Thin config for the shared js/core/scoutstable.js factory. Camp is
   the only location with hasInitialExpedition: true — its one-time
   Expedition Mule is what discovers Mountains; every other location's
   Scout Stable (see js/mechanics/mountainsscoutstable.js) starts
   permanently on the greyed Expedition tab, since future Expeditions
   come from Academy research shared by every Scout Stable, not a
   per-location unlock.
   ============================================================ */
(function () {
  'use strict';
  window.OrbWeaver = window.OrbWeaver || {};

  window.OrbWeaver.ScoutStable.create({
    id: 'scoutspen',
    locationId: 'camp',
    section: 'Camp',
    resourcePrefix: '',
    vehicles: {
      mule:     { id: 'resupplymule', cap: 200,  travel: 15, label: 'Resupply Mule' },
      cartbull: { id: 'cartbull',     cap: 1000, travel: 60, label: 'Cart and Bull' }
    },
    hasInitialExpedition: true,
    expeditionMuleId: 'expeditionmule',
    expeditionTargetWood: 200,
    expeditionTravelTime: 30,
    onExpeditionComplete(ridersAway) {
      window.OrbWeaver.Mountains.reveal();
      window.OrbWeaver.Mountains.addWorkers(ridersAway);
      window.OrbWeaver.Footer.push('The expedition discovered the Mountains!');
    }
  });
})();

</script>

<script>
/* ============================================================
   MAIN — GAME START-UP
   Registers real resources and real cards in DOM order, starts loop.
   Adding a new mechanic: new Resources.register line + Cards.build
   line here, plus one <script> tag in index.html.
   ============================================================ */
(function () {
  'use strict';

  document.addEventListener('DOMContentLoaded', () => {
    const mount = document.getElementById('left-hand-real-resources');

    window.OrbWeaver.Workers.init(mount);
    window.OrbWeaver.Resources.register('gold', {
      name: 'Gold', mount, current: 5000, cap: 5000, displayType: 'integer'
    });

    window.OrbWeaver.Resources.register('wood', {
      name: 'Wood', mount, current: 0, cap: 200, displayType: 'decimal'
    });
    window.OrbWeaver.Resources.register('stone', {
      name: 'Stone', mount, current: 0, cap: 500, displayType: 'decimal', hidden: true
    });
    // No producer yet (Mountains/pyramid add one in a later session) and
    // no cap — exist now, hidden, so Academy's conversion track and the
    // cheat buttons have something to check against.
    window.OrbWeaver.Resources.register('researchpapers', {
      name: 'Research Papers', mount, current: 0, cap: null, displayType: 'integer', hidden: true
    });
    window.OrbWeaver.Resources.register('journals', {
      name: 'Journals', mount, current: 0, cap: null, displayType: 'integer', hidden: true
    });

    // Camp registers itself as a location too, so other locations' Scout
    // Stables can route cargo back home (prefix '' — Camp's resource ids
    // are already the base names).
    window.OrbWeaver.Locations.register({
      id: 'camp', label: 'Camp', prefix: '',
      isDiscovered: () => true,
      addWorkers: (n) => window.OrbWeaver.Workers.addWorkers(n),
      ensureResource: (baseId, name) => { window.OrbWeaver.Resources.ensure(baseId, { name, mount, current: 0, displayType: 'decimal', hidden: false }); return baseId; }
    });

    // Camp is the first card, visible from game start (no reveal gate).
    const campGrid = document.getElementById('grid-camp');
    campGrid.appendChild(window.OrbWeaver.Cards.build(window.OrbWeaver.Mechanics.get('buildersbench')));
    campGrid.appendChild(window.OrbWeaver.Cards.build(window.OrbWeaver.Mechanics.get('tents')));
    campGrid.appendChild(window.OrbWeaver.Cards.build(window.OrbWeaver.Mechanics.get('wood')));
    campGrid.appendChild(window.OrbWeaver.Cards.build(window.OrbWeaver.Mechanics.get('stone')));
    campGrid.appendChild(window.OrbWeaver.Cards.build(window.OrbWeaver.Mechanics.get('market')));
    campGrid.appendChild(window.OrbWeaver.Cards.build(window.OrbWeaver.Mechanics.get('academy')));
    campGrid.appendChild(window.OrbWeaver.Cards.build(window.OrbWeaver.Mechanics.get('scoutspen')));
    campGrid.appendChild(window.OrbWeaver.Cards.build(window.OrbWeaver.Mechanics.get('expeditionmule')));
    campGrid.appendChild(window.OrbWeaver.Cards.build(window.OrbWeaver.Mechanics.get('resupplymule')));
    campGrid.appendChild(window.OrbWeaver.Cards.build(window.OrbWeaver.Mechanics.get('cartbull')));

    // Mountains (Section B) — own left-hand group, own grid, both hidden
    // until Scout Stable's first Expedition Mule reveals them.
    const mtnMount = document.getElementById('left-hand-real-resources-mountains');
    window.OrbWeaver.Mountains.initWorkersRow(mtnMount);
    window.OrbWeaver.Resources.register(window.OrbWeaver.Mountains.woodId, {
      name: 'Wood', mount: mtnMount, current: 200, cap: 2000, displayType: 'decimal', hidden: true
    });
    window.OrbWeaver.Resources.register(window.OrbWeaver.Mountains.stoneId, {
      name: 'Stone', mount: mtnMount, current: 0, cap: 5000, displayType: 'decimal', hidden: true
    });
    document.getElementById('grid-mountains').appendChild(window.OrbWeaver.Cards.build(window.OrbWeaver.Mechanics.get('mountains')));
    document.getElementById('grid-mountains').appendChild(window.OrbWeaver.Cards.build(window.OrbWeaver.Mechanics.get('quarry')));
    document.getElementById('grid-mountains').appendChild(window.OrbWeaver.Cards.build(window.OrbWeaver.Mechanics.get('mtn_scoutstable')));
    document.getElementById('grid-mountains').appendChild(window.OrbWeaver.Cards.build(window.OrbWeaver.Mechanics.get('mtn_resupplymule')));
    document.getElementById('grid-mountains').appendChild(window.OrbWeaver.Cards.build(window.OrbWeaver.Mechanics.get('mtn_cartbull')));

    // Sand Dunes (yellow section) — own left-hand group, own grid, both
    // hidden until revealed (see js/mechanics/sanddunes.js). No resources
    // of its own at launch; ensureResource() registers them on delivery.
    const sdMount = document.getElementById('left-hand-real-resources-sanddunes');
    window.OrbWeaver.SandDunes.initWorkersRow(sdMount);
    document.getElementById('grid-sanddunes').appendChild(window.OrbWeaver.Cards.build(window.OrbWeaver.Mechanics.get('sanddunes')));

    // Restore after every card and resource exists, before the first
    // tick — so nothing simulates against a half-built world. Offline
    // catch-up may take several frames, so the loop starts from the
    // callback rather than immediately.
    window.OrbWeaver.Save.init(() => window.OrbWeaver.Loop.start());
  });
})();

</script>
<script>
/* ============================================================
   ORB WEAVER — PLACEHOLDER EXAMPLES
   Everything in this file is throwaway scaffolding: it demonstrates
   the shell's patterns (resource rows, card variants, a themed
   section) so a developer can see them working, but none of it is
   real game content. Delete this file (and its <script> tag in
   index.html) once real mechanics replace these examples — nothing
   else in the project depends on it.

   Every element this file creates carries the `.placeholder-marker`
   class (dashed outline) so it's visually obvious what's a demo.
   ============================================================ */

(function () {
  'use strict';

  const el = (id) => document.getElementById(id);
  let injected = false;

  function buildResourceRow(name, value, rate) {
    const row = document.createElement('div');
    row.className = 'resource-row placeholder-marker';
    row.innerHTML = `
      <span class="res-name">${name}</span>
      <span class="res-val">${value}</span>
    `;
    if (rate) {
      const rateEl = document.createElement('span');
      rateEl.className = 'res-rate';
      rateEl.textContent = rate;
      row.appendChild(rateEl);
    }
    return row;
  }

  function buildCard({ name, stat, withSteppers, theme }) {
    const wrap = document.createElement('div');
    wrap.className = 'card-wrap placeholder-marker';
    if (theme) {
      wrap.style.setProperty('--tier', theme.tier);
      wrap.style.setProperty('--tier-2', theme.tier2);
      wrap.style.setProperty('--tier-soft', theme.tierSoft);
    }

    const card = document.createElement('div');
    card.className = 'card';
    card.setAttribute('role', 'button');
    card.setAttribute('tabindex', '0');
    card.dataset.cardName = name;
    card.dataset.cardDesc =
      '<div class="detail-card">' +
      `<div class="detail-card-name">${name}</div>` +
      '<div class="detail-card-desc">This is placeholder example content demonstrating the card-detail modal pattern. Replace with real content once mechanics exist.</div>' +
      '</div>';

    const body = document.createElement('div');
    body.className = 'card-body';
    body.innerHTML = `
      <div class="card-name">${name}</div>
      <div class="card-stat">${stat}</div>
    `;
    card.appendChild(body);

    if (withSteppers) {
      const steppers = document.createElement('div');
      steppers.className = 'card-steppers visible';
      steppers.innerHTML = `
        <button class="card-stepper-btn" disabled>–</button>
        <span class="card-stepper-val">0</span>
        <button class="card-stepper-btn" disabled>+</button>
      `;
      card.appendChild(steppers);
    }

    const progressBar = document.createElement('div');
    progressBar.className = 'card-progress-bar';
    card.appendChild(progressBar);

    wrap.appendChild(card);
    return wrap;
  }

  // THEMES: color pairs reused across left-hand and right-hand demo sections.
  // (Yellow moved to the real Sand Dunes mechanic — no longer a placeholder.)
  const THEMES = {
    blue:   { tier: '#5a86b8', tier2: '#7fa8d4', tierSoft: 'rgba(90,134,184,0.16)'  },
    green:  { tier: '#6a9c6a', tier2: '#8fc48f', tierSoft: 'rgba(106,156,106,0.16)' }
  };

  // Builds a themed left-hand resource section: label + N rows, appended to parent.
  function buildResourceSection(parent, labelText, count, prefix, theme) {
    const wrap = document.createElement('div');
    wrap.className = 'placeholder-marker';
    if (theme) {
      wrap.style.setProperty('--tier', theme.tier);
      wrap.style.setProperty('--tier-2', theme.tier2);
      wrap.style.setProperty('--tier-soft', theme.tierSoft);
    }
    const label = document.createElement('div');
    label.className = 'side-label';
    label.textContent = labelText;
    wrap.appendChild(label);
    for (let i = 1; i <= count; i++) {
      wrap.appendChild(buildResourceRow(`${prefix} ${i}`, '0', i % 3 === 0 ? '+0/s' : null));
    }
    parent.appendChild(wrap);
  }

  // Builds a themed right-hand section: label + card-grid of N cards, appended to parent.
  function buildCardSection(parent, labelText, count, prefix, theme) {
    const section = document.createElement('div');
    section.className = 'placeholder-marker';
    if (theme) {
      section.style.setProperty('--tier', theme.tier);
      section.style.setProperty('--tier-2', theme.tier2);
      section.style.setProperty('--tier-soft', theme.tierSoft);
    }
    const label = document.createElement('div');
    label.className = 'section-label';
    label.innerHTML = `${labelText} <span class="section-collapse-arrow">▾</span>`;
    const grid = document.createElement('div');
    grid.className = 'card-grid';
    for (let i = 1; i <= count; i++) {
      grid.appendChild(buildCard({
        name: `Card ${prefix}${i}`,
        stat: 'Has steppers (inert)',
        withSteppers: true,
        theme
      }));
    }
    section.appendChild(label);
    section.appendChild(grid);
    parent.appendChild(section);
    if (window.OrbWeaver && window.OrbWeaver.setupSectionCollapse) {
      window.OrbWeaver.setupSectionCollapse(label);
    }
    return section;
  }

  function inject() {
    if (injected) return;

    // --- Left-hand: Resources (gold, base theme) + Mountains (blue) — 8 rows each ---
    const resourcesMount = el('left-hand-resources');
    if (resourcesMount) {
      buildResourceSection(resourcesMount, 'Resources', 8, 'Resource A', null);
      buildResourceSection(resourcesMount, 'Mountains', 8, 'Resource B', THEMES.blue);
    }

    // --- Right-hand: demo cards inside the real Camp grid (unchanged, gold) ---
    const campGrid = el('grid-camp');
    if (campGrid) {
      campGrid.appendChild(buildCard({ name: 'Card A', stat: 'Has steppers (inert)', withSteppers: true }));
      campGrid.appendChild(buildCard({ name: 'Card B', stat: 'No steppers', withSteppers: false }));
    }

    // --- Right-hand: three new themed sections, 8 cards each ---
    const mount = el('right-hand-placeholder-mount');
    if (mount) {
      buildCardSection(mount, 'Example Section B', 8, 'B', THEMES.blue);
      buildCardSection(mount, 'Example Section C', 8, 'C', THEMES.green);
    }

    injected = true;
  }

  function show() {
    if (!injected) { inject(); return; }
    document.querySelectorAll('.placeholder-marker').forEach(n => { n.style.display = ''; });
  }

  function hide() {
    document.querySelectorAll('.placeholder-marker').forEach(n => { n.style.display = 'none'; });
  }

  window.OrbWeaverPlaceholders = { show, hide };

  // Respect the toggle's default state (ON) on first load.
  document.addEventListener('DOMContentLoaded', () => {
    const visible = window.OrbWeaver && window.OrbWeaver.getPlaceholdersVisible
      ? window.OrbWeaver.getPlaceholdersVisible()
      : true;
    if (visible) inject();
  });

})();

</script>
