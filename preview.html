        checkFullyCollected(row);
      }
      return used;
    }

    // secondsPerWorker optional, defaults to 0.2 (today's fixed rule).
    function advanceTimer(tickRate, assigned, onComplete, secondsPerWorker) {
      if (!collected) return;
      const spw = secondsPerWorker != null ? secondsPerWorker : 0.2;
      timeRemaining -= tickRate + (assigned * spw * tickRate);
      if (timeRemaining <= 0) {
        const row = current();
        onComplete(row);
        index++;
        reservation = {};
        collected = false;
        timeRemaining = null;
        window.OrbWeaver.Footer.push(`${row.name} complete!`);
      }
    }

    function skipAll(onComplete) {
      reservation = {}; collected = false; timeRemaining = null;
      while (index < parsed.length) { onComplete(parsed[index]); index++; }
    }

    function isBuilding() { return collected; }

    function getCardProgressPct() {
      if (!collected) return 0;
      const row = current();
      return ((row.buildTime - timeRemaining) / row.buildTime) * 100;
    }

    function resourceTracker(row) {
      const resources = Object.keys(row.cost).map((id) => {
        const have = collected ? row.cost[id]
          : Object.keys(reservation).length > 0 ? (reservation[id] || 0)
          : window.OrbWeaver.Resources.get(id);
        const label = id.charAt(0).toUpperCase() + id.slice(1);
        return `${Math.round(have)}/${Math.round(row.cost[id])} ${label}`;
      }).join(' ');
      return `${resources} – ${row.buildTime}s`;
    }

    function isCollecting() { return Object.keys(reservation).length > 0 && !collected; }

    // 0-100 progress of resource collection toward the current tier's cost —
    // shared by the modal's Cancel-collecting button fill and the card
    // face's top bar (see getBarPct).
    function getCollectPct() {
      const row = current();
      if (!row || !isCollecting()) return 0;
      const totalNeeded = Object.values(row.cost).reduce((a, b) => a + b, 0);
      const totalHave = Object.keys(row.cost).reduce((a, id) => a + (reservation[id] || 0), 0);
      return Math.min(100, totalNeeded > 0 ? (totalHave / totalNeeded) * 100 : 0);
    }

    // Single number for the card face's top bar: collection progress while
    // gathering resources, build progress once collected and building.
    function getBarPct() { return isCollecting() ? getCollectPct() : getCardProgressPct(); }

    // trackKey optional — stamps data-track on buttons/progress bar so a
    // mechanic with more than one track (e.g. Builder's Bench) can tell
    // its bars/buttons apart. Omitted (Wood/Stone): markup unchanged.
    function renderModalHTML(mechanicId, liveStats, trackKey, arrowHTML) {
      const trackAttr = trackKey ? ` data-track="${trackKey}"` : '';
      const rows = collapsible && collapsed
        ? [parsed[index]]
        : [parsed[index], parsed[index + 1], parsed[index + 2]];
      return rows.map((row, i) => {
        if (!row) return '';
        const locked = i > 0;
        const prevRow = i === 0 ? null : parsed[index + i - 1];
        const effectLine = renderEffect
          ? renderEffect(row, prevRow, liveStats, i)
          : (() => {
              const prevCap = i === 0 ? liveStats.cap : prevRow.newCap;
              const prevRate = i === 0 ? liveStats.rate : prevRow.gainPerWorker;
              return `Cap: ${prevCap} → <strong>${row.newCap}</strong> · Rate: ${prevRate.toFixed(2)}/s → <strong>${row.gainPerWorker.toFixed(2)}/s</strong> per worker`;
            })();

        const arrow = (i === 0 && arrowHTML) ? arrowHTML : '';
        let titleRowRight = `<span class="upgrade-cost">${i === 0 ? resourceTracker(row) : (row.costRaw || '—')}</span>`;
        let bodyRows = `<div class="upgrade-effect">${effectLine}</div>`;
        let extraBody = '';

        if (i === 0) {
          if (collected) {
            const assigned = window.OrbWeaver.Workers.getAssigned(mechanicId);
            const workerPart = assigned > 0
              ? `<span class="detail-status-sep">·</span><span>${assigned} worker${assigned > 1 ? 's' : ''} reducing ${assigned}/s</span>`
              : '';
            extraBody = `
              <div class="detail-progress-wrap"><div class="detail-progress-bar"${trackAttr}></div></div>
              <div class="detail-status"><span>Building — ${Math.ceil(timeRemaining)}s remaining</span>${workerPart}</div>
              <button class="action-btn" data-mechanic="${mechanicId}"${trackAttr} data-upgrade-action="cancel">Cancel</button>`;
          } else if (Object.keys(reservation).length > 0) {
            const pct = getCollectPct().toFixed(1);
            extraBody = `<button class="action-btn collect-btn" data-mechanic="${mechanicId}"${trackAttr} data-upgrade-action="cancel" style="--collect-pct:${pct}%">Cancel collecting</button>`;
          } else {
            const label = canFullyAfford(row) ? 'Build upgrade' : 'Collect Resources';
            if (collapsed) {
              // Collapsed: button fills the title row's remaining width.
              // Cost + effect sit on one shrinkable line below.
              titleRowRight = `<button class="action-btn collapsed-action" data-mechanic="${mechanicId}"${trackAttr} data-upgrade-action="start">${label}</button>`;
              bodyRows = `<div class="upgrade-cost-sub"><span class="upgrade-cost-part">${resourceTracker(row)}</span><span class="upgrade-effect-part">${effectLine}</span></div>`;
            } else {
              extraBody = `<button class="action-btn" data-mechanic="${mechanicId}"${trackAttr} data-upgrade-action="start">${label}</button>`;
            }
          }
        }

        return `
          <div class="upgrade-row ${locked ? 'locked' : ''}">
            <div class="upgrade-row-top">
              <span class="upgrade-name">${arrow}${row.name}</span>

            </div>

          </div>`;

    }

    // Always returns the live resource tracker string so patchOpenModal
    // can keep the cost display current every tick regardless of state.
    function getResourceTrackerAlways() {
      const row = current();
      return row ? resourceTracker(row) : null;
    }

    /* ---- Save/load ----
       Only the INDEX is stored, never the derived name/rate/cap the
       mechanic is currently showing. Replaying the table on load means
       a later rebalance of these numbers reaches existing players

    }

    return { current, start, cancel, collectProduced, advanceTimer, skipAll, isBuilding, isCollecting, serialize, deserialize, getIndex,

             getResourceTracker: getResourceTrackerAlways,

  }

  /* ---------------- Choice track (Construction list) ----------------
     Every item is independently buildable (full up-front cost, no
     partial auto-collection), only one item builds at a time, items
     may start unavailable (not shown at all) or hidden ("???" with a
     gold-cost early reveal), and drop off the list permanently once
     built. onComplete(itemId, item) lets the mechanic react (e.g.
     reveal a resource) when a specific item finishes. */
  function createChoiceTrack(items, onComplete) {
    const state = {};
    items.forEach((it) => { state[it.id] = { available: !!it.startAvailable, hidden: !!it.startHidden, built: false }; });
    let activeId = null;
    let timeRemaining = null;
    let queuedId = null;

    function itemById(id) { return items.find((i) => i.id === id); }
    function cost(item) { return parseCost(item.costRaw); }

    function canAfford(item) {
      const c = cost(item);
      return Object.keys(c).every((id) => window.OrbWeaver.Resources.get(id) >= c[id]);
    }

    function queue(id) {
      const item = itemById(id), s = state[id];
      if (!item || !s || !s.available || s.hidden || s.built || activeId) return;
      queuedId = id;
    }
    function dequeue() { queuedId = null; }
    function getQueuedItem() { return queuedId ? itemById(queuedId) : null; }
    function getQueueFillPct() {
      if (!queuedId) return 0;
      const c = cost(itemById(queuedId));
      const keys = Object.keys(c);
      if (!keys.length) return 100;
      const ratios = keys.map((id) => Math.min(1, window.OrbWeaver.Resources.get(id) / c[id]));
      return (ratios.reduce((a, b) => a + b, 0) / ratios.length) * 100;
    }

    function canReveal(item) {
      if (!item || !item.revealCost) return false;
      return Object.keys(item.revealCost).every((id) => window.OrbWeaver.Resources.get(id) >= item.revealCost[id]);
    }

    function unlock(id) {
      const s = state[id];
      if (s) { s.available = true; s.hidden = false; }
    }

    function revealWithGold(id) {
      const item = itemById(id), s = state[id];
      if (!item || !s || !s.hidden || !canReveal(item)) return;
      Object.keys(item.revealCost).forEach((rid) => window.OrbWeaver.Resources.spend(rid, item.revealCost[rid]));

    }

    function start(id) {
      if (activeId) return;
      const item = itemById(id), s = state[id];
      if (!item || !s || !s.available || s.hidden || s.built) return;
      if (!canAfford(item)) return;

      Object.keys(c).forEach((rid) => window.OrbWeaver.Resources.spend(rid, c[rid]));

      timeRemaining = item.buildTime;
    }

    function cancel(id) {
      if (activeId !== id) return;
      const item = itemById(id);
      const c = cost(item);
      Object.keys(c).forEach((rid) => window.OrbWeaver.Resources.add(rid, c[rid]));
      activeId = null;
      timeRemaining = null;
      window.OrbWeaver.Footer.push(`${item.name} construction canceled — resources returned.`);
    }

    function isBuilding() { return activeId !== null; }
    function activeItem() { return activeId ? itemById(activeId) : null; }
    function getRemaining() { return timeRemaining; }

    function getProgressPct() {
      if (!activeId) return 0;
      const item = itemById(activeId);
      return ((item.buildTime - timeRemaining) / item.buildTime) * 100;
    }

    // secondsPerWorker optional, defaults to 0.2 if omitted.
    function advanceTimer(tickRate, assigned, secondsPerWorker) {
      if (!activeId) return;
      const spw = secondsPerWorker != null ? secondsPerWorker : 0.2;
      timeRemaining -= tickRate + (assigned * spw * tickRate);
      if (timeRemaining <= 0) {
        const item = itemById(activeId);
        const finishedId = activeId;
        state[finishedId].built = true;
        activeId = null;
        timeRemaining = null;
        window.OrbWeaver.Footer.push(`${item.name} complete!`);
        if (onComplete) onComplete(finishedId, item);
      }
    }

    function renderModalRows(mechanicId, trackKey) {
      const trackAttr = trackKey ? ` data-track="${trackKey}"` : '';
      return items.map((item) => {
        const s = state[item.id];
        if (!s.available || s.built) return '';
        if (s.hidden) {
          return `<div class="upgrade-row" data-item="${item.id}">
            <div class="upgrade-row-horizontal">
              <div class="upgrade-text-stack"><span class="upgrade-name">???</span></div>
              <button class="action-btn" data-mechanic="${mechanicId}"${trackAttr} data-item="${item.id}" data-upgrade-action="reveal" ${canReveal(item) ? '' : 'disabled'}>Reveal (${item.revealCostRaw})</button>
            </div>
          </div>`;
        }
        const textStack = `
          <div class="upgrade-text-stack">
            <span class="upgrade-name">${item.name}</span>
            <span class="upgrade-desc">Description coming soon.</span>
          </div>`;
        const c = cost(item);
        const trackerStr = Object.keys(c).map((id) => {
          const have = activeId === item.id ? c[id] : window.OrbWeaver.Resources.get(id);
          return `${Math.round(have)}/${Math.round(c[id])} ${window.OrbWeaver.Resources.getName(id)}`;
        }).join(' ');
        const costTime = `<div class="upgrade-costtime">${trackerStr} – ${item.buildTime}s</div>`;
        if (activeId === item.id) {
          const pct = getProgressPct().toFixed(1);
          return `<div class="upgrade-row" data-item="${item.id}">
            <div class="upgrade-row-horizontal">${textStack}</div>
            ${costTime}
            <div class="detail-progress-wrap"><div class="detail-progress-bar"${trackAttr} style="width:${pct}%"></div></div>
            <div class="detail-status"><span>Building — ${Math.ceil(timeRemaining)}s remaining</span></div>
            <button class="action-btn" data-mechanic="${mechanicId}"${trackAttr} data-item="${item.id}" data-upgrade-action="cancel">Cancel</button>
          </div>`;
        }
        const disabled = activeId !== null || !canAfford(item);
        return `<div class="upgrade-row" data-item="${item.id}">
          <div class="upgrade-row-horizontal">
            <div class="upgrade-text-stack">
              <span class="upgrade-name">${item.name}</span>
              <span class="upgrade-desc">Description coming soon.</span>
            </div>
            <div class="upgrade-action-stack">
              <button class="action-btn" data-mechanic="${mechanicId}"${trackAttr} data-item="${item.id}" data-upgrade-action="start" ${disabled ? 'disabled' : ''}>Build</button>
              ${costTime}
            </div>
          </div>
        </div>`;
      }).join('');
    }

    // Live-patches rows already in the DOM (cost trackers, disabled
    // buttons, the active item's countdown/bar) without touching
    // structure — same "patch, don't rebuild" rule the self-upgrade
    // ladder already follows, applied to the Construction list.
    function patchModalRows() {
      items.forEach((item) => {
        const s = state[item.id];
        if (!s.available || s.built) return;
        const row = document.querySelector(`#card-modal-body .upgrade-row[data-item="${item.id}"]`);
        if (!row) return;
        if (s.hidden) {
          const btn = row.querySelector('[data-upgrade-action="reveal"]');
          if (btn) btn.disabled = !canReveal(item);
          return;
        }
        if (activeId === item.id) {
          const bar = row.querySelector('.detail-progress-bar');
          if (bar) bar.style.width = getProgressPct().toFixed(1) + '%';
          const statusSpan = row.querySelector('.detail-status span');
          if (statusSpan) statusSpan.textContent = `Building — ${Math.ceil(timeRemaining)}s remaining`;
          return;
        }
        const c = cost(item);
        const trackerStr = Object.keys(c).map((id) => {
          const have = window.OrbWeaver.Resources.get(id);
          return `${Math.round(have)}/${Math.round(c[id])} ${window.OrbWeaver.Resources.getName(id)}`;
        }).join(' ');
        const costEl = row.querySelector('.upgrade-costtime');
        if (costEl) costEl.textContent = `${trackerStr} – ${item.buildTime}s`;
        const btn = row.querySelector('[data-upgrade-action="start"]');
        if (btn) btn.disabled = activeId !== null || !canAfford(item);
      });
    }

    function availableCount() { return items.filter((it) => state[it.id].available && !state[it.id].hidden && !state[it.id].built).length; }

    function completeAll() {
      activeId = null; timeRemaining = null;
      items.forEach((it) => {
        if (!state[it.id].built) { state[it.id].built = true; state[it.id].available = true; state[it.id].hidden = false; if (onComplete) onComplete(it.id, it); }
      });
    }

    /* ---- Save/load ----
       Stores which items are available/hidden/built plus whatever is
       mid-build. On load, every BUILT item's onComplete is replayed —
       that is how a completed item's side effects come back (a revealed
       card, an Academy topic that grew Market's bundles). Replaying the
       seed rather than saving the effect means rebalancing those
       effects still reaches existing saves. Every onComplete in the
       game is idempotent, and Footer output is muted while loading. */
    function serialize() {
      const out = {};
      items.forEach((it) => { const st = state[it.id]; out[it.id] = [st.available ? 1 : 0, st.hidden ? 1 : 0, st.built ? 1 : 0]; });
      return { s: out, a: activeId, t: timeRemaining, q: queuedId };
    }
    function deserialize(d) {
      if (!d) return;
      items.forEach((it) => {
        const row = (d.s || {})[it.id];
        if (!row) return;
        state[it.id].available = !!row[0];
        state[it.id].hidden = !!row[1];
        state[it.id].built = !!row[2];

      activeId = d.a || null;
      timeRemaining = d.t != null ? d.t : null;
      queuedId = d.q || null;
      if (onComplete) items.forEach((it) => { if (state[it.id].built) onComplete(it.id, it); });
    }

    return { unlock, revealWithGold, start, cancel, queue, dequeue, getQueuedItem, getQueueFillPct, isBuilding, activeItem, getRemaining, getProgressPct, availableCount, advanceTimer, renderModalRows, patchModalRows, completeAll, serialize, deserialize };
  }

  /* ---------------- Sell track (Market) ----------------
     Per-resource sell cards sharing one pool of "sale slots"
     (maxConcurrent). Each resource has 1–2 selectable bundles, an
     optional auto-sell toggle (+ a lock that keeps it on through a
     gold-cap loss), full up-front resource cost, a timed gold payout,
     and a cancel (refund).

     Sale timing copies the self-upgrade ladder's own mechanism exactly:
     each sale starts with `remaining = baseTime` and every tick
     subtracts `tickRate + assigned*spw*tickRate` (see the sequential
     ladder's advanceTimer above) — an accelerating clock, not a
     shrinking target, so assigning/unassigning workers mid-sale speeds
     up or slows the remaining time live, same as any ladder build.

     One addition the ladder itself doesn't have: `floorTime` is kept as
     a hard minimum on REAL elapsed seconds (tracked separately via
     `realElapsed`), so no amount of worker stacking can finish a sale
     faster than floorTime real seconds — a safety clamp specific to
     Market, layered on top of the borrowed mechanism rather than part
     of it.

     config: { baseTime, floorTime, getAssigned(), getSPW() }.
     Mechanic drives it: unlockResource/enableAuto/setBundles/
     setMaxConcurrent (from ladder effects), tick(), and the render/
     query helpers. */
  function createSellTrack(defs, config) {
    const res = defs.map((d) => ({ ...d, unlocked: false, auto: false, autoOn: false, autoLocked: false, sel: 0, sale: null, bumpUntil: 0 }));
    let maxConcurrent = 1;
    const byId = (id) => res.find((r) => r.id === id);
    const activeCount = () => res.filter((r) => r.sale).length;
    const toggledCount = () => res.filter((r) => r.autoOn).length;
    const amt = (r) => r.bundles[r.sel];
    const goldFor = (r) => Math.round(amt(r) * r.goldPerUnit);

    // Effective remaining time for one sale: the accelerated countdown,
    // floored by how much real time must still pass to satisfy floorTime.
    // Whichever is larger wins, so the displayed/completing time never
    // drops below the real-time floor no matter how fast `remaining`
    // itself has counted down.
    function effectiveRemaining(sale) {
      return Math.max(sale.remaining, config.floorTime - sale.realElapsed);
    }

    // Display-only estimate of a fresh sale's duration at the CURRENT
    // worker count (assuming it stays constant) — shown next to the
    // "Sell" header. Not used for actual sale pacing; see tick().
    function previewDuration() {
      const rate = 1 + config.getAssigned() * config.getSPW();
      return Math.max(config.floorTime, config.baseTime / rate);
    }

    // Auto-sell is granted the moment a resource becomes sellable — no
    // separate ladder gate. enableAuto() stays for any caller that still
    // wants to flip it explicitly, but is redundant for anything routed
    // through unlockResource().
    function unlockResource(id) { const r = byId(id); if (r) { r.unlocked = true; r.auto = true; } }
    function enableAuto(id) { const r = byId(id); if (r) r.auto = true; }
    function setBundles(id, arr) { const r = byId(id); if (r) { r.bundles = arr; if (r.sel >= arr.length) r.sel = 0; } }
    function setMaxConcurrent(n) { maxConcurrent = n; }
    function selectBundle(id, idx) { const r = byId(id); if (r && idx >= 0 && idx < r.bundles.length) r.sel = idx; }
    function canSell(r) { return r.unlocked && !r.sale && activeCount() < maxConcurrent && amt(r) > 0 && window.OrbWeaver.Resources.get(r.id) >= amt(r); }

    function startSale(id) {
      const r = byId(id);
      if (!r || !canSell(r)) return;
      const a = amt(r);
      window.OrbWeaver.Resources.spend(r.id, a);
      r.sale = { remaining: config.baseTime, realElapsed: 0, gold: goldFor(r), amt: a };
    }

    function cancelSale(id) {
      const r = byId(id);
      if (!r || !r.sale) return;
      window.OrbWeaver.Resources.add(r.id, r.sale.amt); // overflow past cap is lost
      r.sale = null;
      window.OrbWeaver.Footer.push(`${r.name} sale canceled — resources returned.`);
    }

    function toggleAuto(id) {
      const r = byId(id);
      if (!r || !r.auto) return;
      if (r.autoOn) { r.autoOn = false; return; }
      if (toggledCount() >= maxConcurrent) { r.bumpUntil = performance.now() + 160; return; } // no free slot → bump back
      r.autoOn = true;
    }
    function toggleLock(id) { const r = byId(id); if (r && r.auto) r.autoLocked = !r.autoLocked; }

    function tick(tickRate) {
      const assigned = config.getAssigned();
      const spw = config.getSPW();
      res.forEach((r) => {
        if (!r.sale) return;
        r.sale.realElapsed += tickRate;
        r.sale.remaining -= tickRate + (assigned * spw * tickRate);
        if (effectiveRemaining(r.sale) > 0) return;
        const added = window.OrbWeaver.Resources.add('gold', r.sale.gold);
        const lost = r.sale.gold - added > 0.001;
        r.sale = null;
        window.OrbWeaver.Footer.push(`${r.name} bundle sold for ${Math.round(added)} gold.${lost ? ' (gold cap — surplus lost)' : ''}`);
        if (lost && r.autoOn && !r.autoLocked) { r.autoOn = false; window.OrbWeaver.Footer.push(`${r.name} auto-sell off — gold cap reached.`); }
      });
      res.forEach((r) => { if (r.autoOn && canSell(r)) startSale(r.id); });
    }

    function getSoonestRemaining() {
      let m = null;
      res.forEach((r) => { if (r.sale) { const rem = Math.max(0, effectiveRemaining(r.sale)); if (m == null || rem < m) m = rem; } });
      return m;
    }
    function getBuildBarPct() {
      let best = null;
      res.forEach((r) => { if (r.sale) { const rem = effectiveRemaining(r.sale); if (best == null || rem < best) best = rem; } });
      return best == null ? 0 : Math.min(100, ((config.baseTime - best) / config.baseTime) * 100);
    }

    // Reserves fixed layout slots (bundles | auto-toggle | gold | status |
    // action | progress bar) so a card's box never resizes: unlocking an
    // auto-toggle, starting a sale, etc. fills an already-reserved slot
    // instead of growing the card (see .sell-card in style.css).
    function renderCards(mechanicId, trackKey) {
      const now = performance.now();
      const cards = res.filter((r) => r.unlocked).map((r) => {
        const d = `data-mechanic="${mechanicId}" data-track="${trackKey}" data-res="${r.id}"`;
        const chips = r.bundles.map((b, i) =>
          `<button class="sell-bundle${i === r.sel ? ' selected' : ''}" ${d} data-idx="${i}" data-upgrade-action="select-bundle">${b} ${r.name}</button>`).join('');
        // Auto-wrap is ALWAYS rendered (reserved space) even before the
        // resource has auto-sell unlocked — only its inner contents are
        // conditional — so unlocking it never shifts the bundle chips.
        const autoInner = r.auto
          ? `<div class="toggle-switch sell-auto${r.autoOn ? ' on' : ''}${now < r.bumpUntil ? ' bump' : ''}" ${d} data-upgrade-action="toggle-auto"></div>` +
            `<button class="sell-lock${r.autoLocked ? ' locked' : ''}" ${d} data-upgrade-action="toggle-lock">${r.autoLocked ? '🔒' : '🔓'}</button>`
          : '';
        let statusText = '', actionHtml, pct = 0;
        if (r.sale) {
          const rem = Math.max(0, effectiveRemaining(r.sale));
          statusText = `Selling — ${Math.ceil(rem)}s`;
          actionHtml = `<button class="action-btn" ${d} data-upgrade-action="cancel-sale">Cancel</button>`;
          pct = Math.min(100, ((config.baseTime - rem) / config.baseTime) * 100);
        } else {
          actionHtml = `<button class="action-btn" ${d} data-upgrade-action="sell"${canSell(r) ? '' : ' disabled'}>Bundle</button>`;
        }
        return `<div class="sell-card" data-res="${r.id}">
          <div class="sell-row-top"><div class="sell-bundles">${chips}</div><div class="sell-auto-wrap">${autoInner}</div></div>
          <div class="sell-gold">→ ${goldFor(r)} Gold</div>
          <div class="sell-status">${statusText}</div>
          ${actionHtml}
          <div class="sell-progress"><div class="sell-progress-bar" style="width:${pct.toFixed(1)}%"></div></div>
        </div>`;
      }).join('');
      return `<div class="sell-grid">${cards}</div>`;
    }

    function patchDOM() {
      const timeEl = document.querySelector('#card-modal-body .sell-time-label');
      if (timeEl) timeEl.textContent = `— ${previewDuration().toFixed(1)}s`;
      res.filter((r) => r.unlocked).forEach((r) => {
        const rem = r.sale ? Math.max(0, effectiveRemaining(r.sale)) : null;
        const statusEl = document.querySelector(`#card-modal-body [data-res="${r.id}"] .sell-status`);
        if (statusEl) statusEl.textContent = rem != null ? `Selling — ${Math.ceil(rem)}s` : '';
        const barEl = document.querySelector(`#card-modal-body [data-res="${r.id}"] .sell-progress-bar`);
        if (barEl) barEl.style.width = (rem != null ? Math.min(100, ((config.baseTime - rem) / config.baseTime) * 100) : 0).toFixed(1) + '%';
        if (!r.sale) {
          const btn = document.querySelector(`#card-modal-body [data-res="${r.id}"] [data-upgrade-action="sell"]`);
          if (btn) btn.disabled = !canSell(r);
        }
      });
    }

    /* ---- Save/load ----
       Bundle SIZES and maxConcurrent are deliberately NOT saved: they
       are effects of Academy research topics, which the choice track
       replays on load. Saving them here would freeze a player on the
       bundle sizes that existed when they last played. What IS saved is
       the player's own choices (which bundle is selected, auto on/off,
       lock) and any sale mid-flight. */
    function serialize() {
      const out = {};
      res.forEach((r) => {
        out[r.id] = { u: r.unlocked ? 1 : 0, a: r.auto ? 1 : 0, on: r.autoOn ? 1 : 0, l: r.autoLocked ? 1 : 0, s: r.sel };
        if (r.sale) out[r.id].sale = { rem: r.sale.remaining, re: r.sale.realElapsed, g: r.sale.gold, amt: r.sale.amt };
      });
      return { res: out };
    }
    function deserialize(d) {
      if (!d) return;
      res.forEach((r) => {
        const sv = (d.res || {})[r.id];
        if (!sv) return;
        r.unlocked = r.unlocked || !!sv.u; // unlocking is monotonic; never un-unlock
        r.auto = r.auto || !!sv.a;
        r.autoOn = !!sv.on;
        r.autoLocked = !!sv.l;
        r.sel = (sv.s != null && sv.s < r.bundles.length) ? sv.s : 0;
        r.sale = sv.sale ? { remaining: sv.sale.rem, realElapsed: sv.sale.re, gold: sv.sale.g, amt: sv.sale.amt } : null;
      });
    }

    return {
      unlockResource, enableAuto, setBundles, setMaxConcurrent, selectBundle,
      startSale, cancelSale, toggleAuto, toggleLock, tick,
      getSoonestRemaining, getBuildBarPct, projectedTime: previewDuration, renderCards, patchDOM,
      serialize, deserialize
    };
  }

  /* ---------------- Conversion track (Academy, and future resource-
     to-resource mechanics) ----------------
     Recipes take a full up-front cost — reusing the same multi-resource
     costRaw/parseCost every other track already uses, so a recipe can
     require several different input resources at once — and pay out a
     configurable output resource on a timer, using the same
     accelerating-clock math as everything else (tickRate +
     assigned*spw*tickRate). Recipes start locked; a mechanic calls
     unlock(id) to reveal one (e.g. an Academy Research Topic unlocking
     a better recipe). Shares the sell track's auto/lock/concurrency
     conventions so the two feel identical to a player, but recipes are
     costed in arbitrary resource combinations rather than one resource's
     selectable bundle size, and the payout resource is per-recipe rather
     than always gold.

     config: { getAssigned(), getSPW() }. Mechanic drives it: unlock(),
     setMaxConcurrent(), tick(), and the render/query helpers. */
  function createConversionTrack(recipes, config) {
    const res = recipes.map((r) => ({
      ...r, cost: parseCost(r.costRaw), unlocked: !!r.startUnlocked,
      auto: true, autoOn: false, autoLocked: false, batch: null, bumpUntil: 0
    }));
    let maxConcurrent = 1;
    const byId = (id) => res.find((r) => r.id === id);
    const activeCount = () => res.filter((r) => r.batch).length;
    const toggledCount = () => res.filter((r) => r.autoOn).length;
    const canAfford = (r) => Object.keys(r.cost).every((id) => window.OrbWeaver.Resources.get(id) >= r.cost[id]);
    const canStart = (r) => r.unlocked && !r.batch && activeCount() < maxConcurrent && canAfford(r);

    function unlock(id) { const r = byId(id); if (r) r.unlocked = true; }
    function setMaxConcurrent(n) { maxConcurrent = n; }

    function start(id) {
      const r = byId(id);
      if (!r || !canStart(r)) return;
      Object.keys(r.cost).forEach((rid) => window.OrbWeaver.Resources.spend(rid, r.cost[rid]));
      r.batch = { remaining: r.buildTime };
    }
    function cancel(id) {
      const r = byId(id);
      if (!r || !r.batch) return;
      Object.keys(r.cost).forEach((rid) => window.OrbWeaver.Resources.add(rid, r.cost[rid]));
      r.batch = null;
      window.OrbWeaver.Footer.push(`${r.name} conversion canceled — resources returned.`);
    }
    function toggleAuto(id) {
      const r = byId(id);
      if (!r || !r.auto) return;
      if (r.autoOn) { r.autoOn = false; return; }
      if (toggledCount() >= maxConcurrent) { r.bumpUntil = performance.now() + 160; return; }
      r.autoOn = true;
    }
    function toggleLock(id) { const r = byId(id); if (r && r.auto) r.autoLocked = !r.autoLocked; }

    function tick(tickRate) {
      const assigned = config.getAssigned(), spw = config.getSPW();
      res.forEach((r) => {
        if (!r.batch) return;
        r.batch.remaining -= tickRate + (assigned * spw * tickRate);
        if (r.batch.remaining > 0) return;
        const added = window.OrbWeaver.Resources.add(r.outputId, r.outputAmount);
        r.batch = null;
        window.OrbWeaver.Footer.push(`${r.name} complete — +${Math.round(added)} ${r.outputName}.`);
      });
      res.forEach((r) => { if (r.autoOn && canStart(r)) start(r.id); });
    }

    function getSoonestRemaining() {
      let m = null;
      res.forEach((r) => { if (r.batch && (m == null || r.batch.remaining < m)) m = r.batch.remaining; });
      return m;
    }
    function getBuildBarPct() {
      let best = null;
      res.forEach((r) => { if (r.batch && (best == null || r.batch.remaining < best.batch.remaining)) best = r; });
      if (!best) return 0;
      return Math.min(100, ((best.buildTime - best.batch.remaining) / best.buildTime) * 100);
    }

    function costTracker(r) {
      return Object.keys(r.cost).map((id) => {
        const have = window.OrbWeaver.Resources.get(id);
        const label = id.charAt(0).toUpperCase() + id.slice(1);
        return `${Math.round(Math.min(have, r.cost[id]))}/${Math.round(r.cost[id])} ${label}`;
      }).join(' ');
    }

    // Reuses Market's .sell-card layout wholesale (same fixed-square card,
    // same reserved auto/lock column, same status/action/progress-bar
    // slots) — a recipe card and a sell card are the same shape, just with
    // a cost tracker instead of bundle chips and a configurable output
    // instead of always gold.
    function renderCards(mechanicId, trackKey) {
      const now = performance.now();
      const cards = res.filter((r) => r.unlocked).map((r) => {
        const d = `data-mechanic="${mechanicId}" data-track="${trackKey}" data-res="${r.id}"`;
        const autoInner = `<div class="toggle-switch sell-auto${r.autoOn ? ' on' : ''}${now < r.bumpUntil ? ' bump' : ''}" ${d} data-upgrade-action="toggle-auto"></div>` +
          `<button class="sell-lock${r.autoLocked ? ' locked' : ''}" ${d} data-upgrade-action="toggle-lock">${r.autoLocked ? '🔒' : '🔓'}</button>`;
        let statusText = '', actionHtml, pct = 0;
        if (r.batch) {
          statusText = `Converting — ${Math.ceil(r.batch.remaining)}s`;
          actionHtml = `<button class="action-btn" ${d} data-upgrade-action="cancel-convert">Cancel</button>`;
          pct = Math.min(100, ((r.buildTime - r.batch.remaining) / r.buildTime) * 100);
        } else {
          actionHtml = `<button class="action-btn" ${d} data-upgrade-action="convert"${canStart(r) ? '' : ' disabled'}>Convert</button>`;
        }
        return `<div class="sell-card" data-res="${r.id}">
          <div class="sell-row-top"><div class="sell-bundles"><span class="upgrade-name">${r.name}</span></div><div class="sell-auto-wrap">${autoInner}</div></div>
          <div class="sell-gold">${costTracker(r)} → ${r.outputAmount} ${r.outputName}</div>
          <div class="sell-status">${statusText}</div>
          ${actionHtml}
          <div class="sell-progress"><div class="sell-progress-bar" style="width:${pct.toFixed(1)}%"></div></div>
        </div>`;
      }).join('');
      return `<div class="sell-grid">${cards}</div>`;
    }

    function patchDOM() {
      res.filter((r) => r.unlocked).forEach((r) => {
        const statusEl = document.querySelector(`#card-modal-body [data-res="${r.id}"] .sell-status`);
        if (statusEl) statusEl.textContent = r.batch ? `Converting — ${Math.ceil(r.batch.remaining)}s` : '';
        const barEl = document.querySelector(`#card-modal-body [data-res="${r.id}"] .sell-progress-bar`);
        if (barEl) barEl.style.width = (r.batch ? Math.min(100, ((r.buildTime - r.batch.remaining) / r.buildTime) * 100) : 0).toFixed(1) + '%';
        if (!r.batch) {
          const costEl = document.querySelector(`#card-modal-body [data-res="${r.id}"] .sell-gold`);
          if (costEl) costEl.textContent = `${costTracker(r)} → ${r.outputAmount} ${r.outputName}`;
          const btn = document.querySelector(`#card-modal-body [data-res="${r.id}"] [data-upgrade-action="convert"]`);
          if (btn) btn.disabled = !canStart(r);
        }
      });
    }

    /* ---- Save/load ---- Same rule as the sell track: recipe costs,
       times and maxConcurrent are re-derived from replayed research,
       not saved. Only player choices and in-flight batches persist. */
    function serialize() {
      const out = {};
      res.forEach((r) => {
        out[r.id] = { u: r.unlocked ? 1 : 0, on: r.autoOn ? 1 : 0, l: r.autoLocked ? 1 : 0 };
        if (r.batch) out[r.id].b = r.batch.remaining;
      });
      return { res: out };
    }
    function deserialize(d) {
      if (!d) return;
      res.forEach((r) => {
        const sv = (d.res || {})[r.id];
        if (!sv) return;
        r.unlocked = r.unlocked || !!sv.u;
        r.autoOn = !!sv.on;
        r.autoLocked = !!sv.l;
        r.batch = sv.b != null ? { remaining: sv.b } : null;
      });
    }

    return {
      unlock, setMaxConcurrent, start, cancel, toggleAuto, toggleLock, tick,
      getSoonestRemaining, getBuildBarPct, renderCards, patchDOM,
      serialize, deserialize
    };
  }

  function registerTrack(id, track) { tracks[id] = track; }

  // Called by Resources.add() before anything reaches the free pool.
  // Guards on t.collectProduced so choice tracks (no partial collection)
  // are safely skipped.
  function collectIntoReservations(id, amount) {
    let remaining = amount;
    Object.values(tracks).forEach((t) => {
      if (remaining <= 0 || !t.collectProduced) return;
      remaining -= t.collectProduced(id, remaining);
    });
    return amount - remaining;
  }

  // Delegated listener: resolves 'mechanicId' or 'mechanicId:trackKey'
  // depending on whether the clicked element carries data-track, so it
  // works for both single-track (Wood/Stone) and multi-track mechanics.
  // Uses 'click' (not 'pointerdown'): pointerdown fires before the
  // browser's own click is dispatched, so an action that closes the
  // modal mid-pointerdown left a same-tap ghost click to fall through
  // onto whatever card was newly exposed underneath. 'click' already
  // waits for pointerup at the same target, matching how card-open
  // clicks work elsewhere, so there's exactly one event per tap.
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-upgrade-action]');
    if (!btn) return;
    const key = btn.dataset.track ? `${btn.dataset.mechanic}:${btn.dataset.track}` : btn.dataset.mechanic;
    const track = tracks[key];
    if (!track) return;
    const action = btn.dataset.upgradeAction, item = btn.dataset.item;
    let shouldClose = false;

    if (action === 'start') {
      if (track.revealWithGold) {
        // Choice track (Camp Build button): try start; if it fails (can't afford),
        // queue the item so buildersbench.tick() auto-starts when conditions are met.
        track.start(item);
        if (!track.isBuilding()) track.queue(item);
        shouldClose = true;
      } else {
        track.start(item);
        shouldClose = track.isBuilding();
      }
    } else if (action === 'cancel') {
      track.dequeue && track.dequeue();
      track.cancel(item);
    } else if (action === 'reveal' && track.revealWithGold) {
      track.revealWithGold(item);
    } else if (action === 'toggle-collapse' && track.toggleCollapse) {
      // Mobile can deliver two clicks for one tap; a second toggle
      // within 300ms would flip it straight back, making the arrow
      // look unresponsive. Swallow the duplicate. Scoped to this
      // action only — every other action stays instantly repeatable.
      if (performance.now() - lastCollapseAt < 300) return;
      lastCollapseAt = performance.now();
      track.toggleCollapse();
    } else if (action === 'select-bundle') {
      track.selectBundle(btn.dataset.res, parseInt(btn.dataset.idx, 10));
    } else if (action === 'sell') {
      track.startSale(btn.dataset.res);
    } else if (action === 'cancel-sale') {
      track.cancelSale(btn.dataset.res);
    } else if (action === 'toggle-auto') {
      track.toggleAuto(btn.dataset.res);
    } else if (action === 'toggle-lock') {
      track.toggleLock(btn.dataset.res);
    } else if (action === 'convert') {
      track.start(btn.dataset.res);
    } else if (action === 'cancel-convert') {
      track.cancel(btn.dataset.res);
    }

    if (shouldClose) {
      window.OrbWeaver.Cards.closeModal();
    } else {
      window.OrbWeaver.Cards.refreshOpenModal(btn.dataset.mechanic);
    }
  });

  function getTrack(id) { return tracks[id] || null; }
  function allTracks() { return tracks; }
  window.OrbWeaver.Upgrades = { create, createChoiceTrack, createSellTrack, createConversionTrack, registerTrack, getTrack, allTracks, collectIntoReservations, getBaseSPW, setBaseSPW, formatRate };
})();

</script>
<script>
/* ============================================================
   CORE: REAL CARD BUILDER
   Generic card-building + modal-wiring for real (non-placeholder)
   mechanic cards. Mirrors placeholders.js's buildCard, but reads
   live game state instead of static demo text, and never carries
   the .placeholder-marker class — so it stays visible even when the
   placeholder toggle is off.

   A mechanic may optionally define:
     mechanic.startHidden      — card starts hidden, shown via Cards.reveal()
     mechanic.onOpen()         — called once when the card is first clicked
     mechanic.getBuildBarPct() — adds a second (bottom) progress bar
     mechanic.upgradeTrackKey / mechanic.buildTrackKey — data-track
       values used to find the right bar inside a multi-track modal
   None of these are required — Wood/Stone define none of them and
   behave exactly as before.
   ============================================================ */
(function () {
  'use strict';
  window.OrbWeaver = window.OrbWeaver || {};

  let openModalMechanicId = null;

  /* RENDER SUSPENSION
     Mechanics call Cards.refresh() from inside their own tick(), so
     "simulate" and "draw" are entangled. Rather than rewrite every
     mechanic, refresh() checks this flag and returns immediately when
     drawing is off. The loop switches it off while running many ticks
     back-to-back (live catch-up, and later offline replay) and calls
     refreshAll() once at the end — so 86,400 ticks of offline progress
     cost one repaint instead of 86,400. */
  let renderEnabled = true;
  function setRenderEnabled(v) { renderEnabled = !!v; }
  function refreshAll() {
    window.OrbWeaver.Mechanics.all().forEach((m) => { if (m.els) refresh(m); });
  }

  /* GHOST-CLICK GUARD (mobile)
     A tap that closes the modal can have its synthesized follow-up
     click dispatched AFTER the modal is gone — the browser then
     hit-tests the card now sitting under the finger and opens it.
     Switching the action listener to 'click' stopped one flavor of
     this, but touch event synthesis can still deliver a second event
     once the target is removed. Rather than chase each flavor, we
     time-gate it: any card click within GHOST_MS of a modal close
     came from the same tap and is discarded. Also stops the double-
     fire that made the collapse arrow feel unresponsive (toggle open,
     immediately toggle shut). */
  const GHOST_MS = 130;
  let modalClosedAt = 0;
  function markModalClosed() { modalClosedAt = performance.now(); }
  function isGhostClick() { return performance.now() - modalClosedAt < GHOST_MS; }

  /* .worker-desc's natural width changes every tick as its text changes,
     which shifts #card-modal-header-left's width and bumps the centered
     .modal-title. We commit to a fixed `width` (not min-width — a floor
     alone can't stop growth) sized to the text plus a pad, and only
     re-commit when the text either outgrows the current box or shrinks
     far enough to leave a large gap. Small changes reuse the existing
     box and never touch the title. Canvas measureText is used instead
     of scrollWidth for a measurement that doesn't depend on the
     element's own current box/layout state. Resets on modal reopen. */
  const WORKER_DESC_BUFFER_PX = 20;
  let measureCtx = null;
  function measureTextWidth(el, text) {
    if (!measureCtx) measureCtx = document.createElement('canvas').getContext('2d');
    measureCtx.font = getComputedStyle(el).font;
    return measureCtx.measureText(text).width;
  }
  function applyWorkerDescWidth(desc) {
    const natural = measureTextWidth(desc, desc.textContent);
    const committed = parseFloat(desc.dataset.committedW);
    if (isNaN(committed) || natural > committed || natural < committed - WORKER_DESC_BUFFER_PX) {
      const padded = natural + WORKER_DESC_BUFFER_PX;
      desc.dataset.committedW = padded;
      desc.style.width = padded + 'px';
    }
  }

  // Every location has its own worker pool (Camp's is the default); a
  // mechanic living on another pool sets mechanic.workerPool.
  function pool(mechanic) { return mechanic.workerPool || window.OrbWeaver.Workers; }

  function addHoldBehavior(btn, action) {
    let initialTimer = null, repeatTimer = null, holdStart = null;
    function stop() {
      clearTimeout(initialTimer); clearInterval(repeatTimer);
      initialTimer = repeatTimer = holdStart = null;
    }
    function fire() { if (!btn.disabled) action(); else stop(); }
    btn.addEventListener('pointerdown', () => {
      fire();
      holdStart = Date.now();
      initialTimer = setTimeout(() => {
        repeatTimer = setInterval(() => {
          if (Date.now() - holdStart >= 1800) {
            clearInterval(repeatTimer);
            repeatTimer = setInterval(fire, 20);
          }
          fire();
        }, 50);
      }, 600);
    });
    btn.addEventListener('pointerup', stop);
    btn.addEventListener('pointerleave', stop);
  }

  function makeStepperSet(mechanic, isModal) {
    const wrap = document.createElement('div');
    wrap.className = 'card-steppers visible';
    wrap.innerHTML = `
      <button class="card-stepper-btn stepper-minus">–</button>
      <span class="card-stepper-val">0</span>
      <button class="card-stepper-btn stepper-plus">+</button>`;

    // Shared helper — keeps both lock buttons in sync whenever either is clicked.
    function applyLock(locked) {
      mechanic.locked = locked;
      if (mechanic.els && mechanic.els.cardFaceLock) {
        mechanic.els.cardFaceLock.style.display = locked ? '' : 'none';
      }
      if (mechanic.els && mechanic.els.modalSteppers) {
        const ml = mechanic.els.modalSteppers.querySelector('.card-lock-btn');
        if (ml) { ml.classList.toggle('locked', locked); ml.textContent = locked ? '🔒' : '🔓'; }
      }
    }

    if (isModal) {
      const lock = document.createElement('button');
      lock.className = 'card-lock-btn';
      lock.title = 'Lock workers on this card (excludes from recall)';
      lock.addEventListener('click', () => applyLock(!mechanic.locked));
      lock.textContent = mechanic.locked ? '🔒' : '🔓';
      lock.classList.toggle('locked', !!mechanic.locked);
      wrap.appendChild(lock);
      if (mechanic.getWorkerDesc) {
        const desc = document.createElement('span');
        desc.className = 'worker-desc';
        desc.textContent = mechanic.getWorkerDesc();
        wrap.appendChild(desc);
        applyWorkerDescWidth(desc);
      }
    } else {
      // Card-face lock: only visible when locked, 🔒 only, clicking unlocks.
      const faceLock = document.createElement('button');
      faceLock.className = 'card-lock-btn card-face-lock';
      faceLock.title = 'Locked — click to unlock';
      faceLock.textContent = '🔒';
      faceLock.style.display = mechanic.locked ? '' : 'none';
      faceLock.addEventListener('click', (e) => { e.stopPropagation(); applyLock(false); });
      wrap.appendChild(faceLock);
      if (mechanic.els) mechanic.els.cardFaceLock = faceLock;
      else mechanic._pendingFaceLock = faceLock;
    }
    const plus = wrap.querySelector('.stepper-plus');
    const minus = wrap.querySelector('.stepper-minus');
    addHoldBehavior(plus, () => pool(mechanic).assign(mechanic.id));
    addHoldBehavior(minus, () => pool(mechanic).unassign(mechanic.id));
    return wrap;
  }

  // Drives one or two progress bars (card face + open modal) per mechanic
  // via a single requestAnimationFrame loop, easing toward each bar's true
  // target every frame instead of snapping once per tick.
  function startSmoothing(mechanic) {
    const specs = [{ getPct: mechanic.getUpgradeBarPct, el: mechanic.els.upgradeBar, track: mechanic.upgradeTrackKey || null, key: 'shownPct' }];
    if (mechanic.getBuildBarPct && mechanic.els.buildBar) {
      specs.push({ getPct: mechanic.getBuildBarPct, el: mechanic.els.buildBar, track: mechanic.buildTrackKey || null, key: 'shownBuildPct' });
    }
    const state = specs.map(() => ({ shown: 0, from: 0, to: 0, start: performance.now(), dur: window.OrbWeaver.Loop.getIntervalMs() }));

    function frame(now) {
      specs.forEach((spec, i) => {
        const s = state[i];
        const target = spec.getPct();
        if (target !== s.to) { s.from = s.shown; s.to = target; s.start = now; s.dur = window.OrbWeaver.Loop.getIntervalMs(); }
        const t = s.dur > 0 ? Math.min(1, (now - s.start) / s.dur) : 1;
        s.shown = s.from + (s.to - s.from) * t;
        mechanic.els[spec.key] = s.shown;
        spec.el.style.width = s.shown + '%';
        let modalBar = null;
        if (openModalMechanicId === mechanic.id) {
          // Build bar's modal target can shift between sub-tracks (e.g.
          // Mountains: outpost while building, quarry once outpost is done)
          // — resolved live each frame instead of the static spec.track.
          const liveTrack = (i === 1 && mechanic.getBuildBarTrackKey) ? mechanic.getBuildBarTrackKey() : spec.track;
          const sel = liveTrack
            ? `#card-modal-body .detail-progress-bar[data-track="${liveTrack}"]`
            : '#card-modal-body .detail-progress-bar:not([data-track])';
          modalBar = document.querySelector(sel);
          if (modalBar) modalBar.style.width = s.shown + '%';
        }
        // Top (upgrade) bar only: faded-gold tint while still collecting
        // resources, reverting to its normal color once building starts.
        if (i === 0 && mechanic.isUpgradeCollecting) {
          const collecting = mechanic.isUpgradeCollecting();
          spec.el.classList.toggle('bar-collecting', collecting);
          if (modalBar) modalBar.classList.toggle('bar-collecting', collecting);
        }
        // Bottom (build) bar: optional isBuildBarFaded() dims it while in a
        // "soft active" state (e.g. loading vs traveling for mule cards).
        if (i === 1 && mechanic.isBuildBarFaded) {
          const faded = mechanic.isBuildBarFaded();
          spec.el.classList.toggle('bar-collecting', faded);
          if (modalBar) modalBar.classList.toggle('bar-collecting', faded);
        }
      });
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  function build(mechanic) {
    const wrap = document.createElement('div');
    wrap.className = 'card-wrap' + (mechanic.isMule ? ' mule' : '');
    // mechanic.revealed is REAL state the save system reads. Previously
    // "has the player unlocked this card" existed only as a CSS display
    // property, which is not a place to keep game state.
    if (mechanic.revealed == null) mechanic.revealed = !mechanic.startHidden;
    if (!mechanic.revealed) wrap.style.display = 'none';

    const card = document.createElement('div');
    card.className = 'card';
    card.setAttribute('role', 'button');
    card.setAttribute('tabindex', '0');

    const body = document.createElement('div');
    body.className = 'card-body';
    body.innerHTML = `<div class="card-name"></div><div class="card-stat"></div>`;

    const cardSteppers = makeStepperSet(mechanic, false);
    const upgradeBar = document.createElement('div');
    upgradeBar.className = 'card-upgrade-bar';

    card.appendChild(body);
    card.appendChild(cardSteppers);
    card.appendChild(upgradeBar);

    let buildBar = null;
    if (mechanic.getBuildBarPct) {
      buildBar = document.createElement('div');
      buildBar.className = 'card-progress-bar';
      card.appendChild(buildBar);
    }

    wrap.appendChild(card);

    mechanic.els = {
      wrap,
      nameEl: body.querySelector('.card-name'),
      statEl: body.querySelector('.card-stat'),
      cardStepperVal: cardSteppers.querySelector('.card-stepper-val'),
      cardStepperMinus: cardSteppers.querySelector('.stepper-minus'),
      cardStepperPlus: cardSteppers.querySelector('.stepper-plus'),
      cardSteppersWrap: cardSteppers,
      cardFaceLock: mechanic._pendingFaceLock || null,
      upgradeBar,
      buildBar,
      modalSteppers: null
    };
    delete mechanic._pendingFaceLock;

    pool(mechanic).onChange(() => refresh(mechanic));
    startSmoothing(mechanic);

    card.addEventListener('click', (e) => {
      if (e.target.closest('.card-steppers')) return;
      if (isGhostClick()) return; // same tap that just closed a modal
      openModalMechanicId = mechanic.id;
      if (mechanic.onOpen) mechanic.onOpen();
      // Optional: mechanic.modalWide widens the shared modal for grid-style bodies.
      document.getElementById('card-modal-win').classList.toggle('modal-wide', !!mechanic.modalWide);
      // Optional: mechanic.stepperReady() — a card can start with no
      // steppers at all (e.g. a mule still preparing) and grow them later.
      const ready = !mechanic.stepperReady || mechanic.stepperReady();
      const modalSteppers = ready ? makeStepperSet(mechanic, true) : null;
      mechanic.els.modalSteppers = modalSteppers;
      window.OrbWeaver.openCardModal(mechanic.cardName(), mechanic.renderModalHTML(), modalSteppers, mechanic.getSubtitleHtml ? mechanic.getSubtitleHtml() : '', mechanic.modalTheme);
      if (modalSteppers) refreshModalSteppers(mechanic);
      if (mechanic.afterRender) mechanic.afterRender();
    });

    refresh(mechanic);
    return wrap;
  }

  function reveal(mechanic) {
    if (!mechanic) return;
    mechanic.revealed = true;
    if (mechanic.els && mechanic.els.wrap) {
      const wrap = mechanic.els.wrap;
      wrap.style.display = '';
      wrap.style.visibility = '';
      if (gapObserver) gapObserver.unobserve(wrap);
    }
  }

  // Lazily-created single observer shared by every gap-on-hide card (see
  // mechanic.gapOnHide below) — watches cards that hid themselves while
  // still on-screen, and only collapses their grid slot once they scroll
  // out of view, so a disappearing mule/cart never bumps other cards.
  let gapObserver = null;
  function getGapObserver() {
    if (!gapObserver) {
      gapObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) {
            entry.target.style.display = 'none';
            entry.target.style.visibility = '';
            gapObserver.unobserve(entry.target);
          }
        });
      });
    }
    return gapObserver;
  }

  // Counterpart to reveal() — for a card that can legitimately disappear
  // again after completion (e.g. a mule once its trip is over). Optional
  // mechanic.gapOnHide leaves a blank same-size gap instead of reflowing
  // the grid, but only while the card is actually visible on screen —
  // off-screen cards just collapse immediately like before.
  function hide(mechanic) {
    if (!mechanic) return;
    mechanic.revealed = false;
    if (mechanic.els && mechanic.els.wrap) {
      const wrap = mechanic.els.wrap;
      if (mechanic.gapOnHide) {
        const rect = wrap.getBoundingClientRect();
        const visible = rect.bottom > 0 && rect.top < (window.innerHeight || document.documentElement.clientHeight);
        if (visible) { wrap.style.visibility = 'hidden'; getGapObserver().observe(wrap); }
        else wrap.style.display = 'none';
      } else {
        wrap.style.display = 'none';
      }
    }
    if (openModalMechanicId === mechanic.id) closeModal();
  }

  // Pushes mechanic.revealed back onto the DOM. Used after a save load,
  // where the flags are restored first and the DOM must follow them.
  function applyVisibility(mechanic) {
    if (!mechanic || !mechanic.els || !mechanic.els.wrap) return;
    const wrap = mechanic.els.wrap;
    wrap.style.visibility = '';
    wrap.style.display = mechanic.revealed ? '' : 'none';
    if (gapObserver) gapObserver.unobserve(wrap);
  }

  function isModalOpenFor(id) { return openModalMechanicId === id; }

  function refreshModalSteppers(mechanic) {
    const ms = mechanic.els.modalSteppers;
    if (!ms) return;
    const assigned = pool(mechanic).getAssigned(mechanic.id);
    ms.querySelector('.card-stepper-val').textContent = assigned;
    ms.querySelector('.stepper-minus').disabled = assigned === 0;
    ms.querySelector('.stepper-plus').disabled = pool(mechanic).getIdleCount() === 0;
    if (mechanic.getWorkerDesc) {
      const desc = ms.querySelector('.worker-desc');
      if (desc) {
        desc.textContent = mechanic.getWorkerDesc();
        applyWorkerDescWidth(desc);
      }
    }
  }

  function applyShownBar(mechanic, shown, trackKey) {
    if (shown == null) return;
    const sel = trackKey
      ? `#card-modal-body .detail-progress-bar[data-track="${trackKey}"]`
      : '#card-modal-body .detail-progress-bar:not([data-track])';
    const bar = document.querySelector(sel);
    if (bar) bar.style.width = shown + '%';
  }

  // Patch the live modal DOM without rebuilding it — only the text nodes
  // that change every tick. Full rebuild only happens when the modal first
  // opens or a structural change occurs (upgrade completes, sale starts/ends).
  function patchOpenModal(mechanic) {
    if (mechanic.patchUpgradeCost) {
      const val = mechanic.patchUpgradeCost();
      if (val != null) {
        const costEl = document.querySelector('#card-modal-body .upgrade-row:not(.locked) .upgrade-cost');
        if (costEl) costEl.innerHTML = val;
        const subEl = document.querySelector('#card-modal-body .upgrade-row:not(.locked) .upgrade-cost-part');
        if (subEl) subEl.innerHTML = val;
      }
    }
    if (mechanic.patchCollectPct) {
      const pct = mechanic.patchCollectPct();
      const btn = document.querySelector('#card-modal-body .upgrade-row:not(.locked) .collect-btn');
      if (btn) btn.style.setProperty('--collect-pct', pct + '%');
    }
    const statusEl = document.querySelector('#card-modal-body .detail-status span:first-child');
    if (statusEl && mechanic.patchBuildStatus) {
      const s = mechanic.patchBuildStatus();
      if (s != null) statusEl.textContent = s;
    }
    if (mechanic.patchLiveTrack) mechanic.patchLiveTrack();
    const titleEl = document.getElementById('card-modal-title');
    if (titleEl) titleEl.textContent = mechanic.cardName();
  }

  // Full rebuild: used only on first open or after a state change that
  // alters structure (new buttons, new rows). NOT called every tick.
  function rebuildOpenModal(mechanic) {
    window.OrbWeaver.openCardModal(mechanic.cardName(), mechanic.renderModalHTML(), mechanic.els.modalSteppers, mechanic.getSubtitleHtml ? mechanic.getSubtitleHtml() : '', mechanic.modalTheme);
    applyShownBar(mechanic, mechanic.els.shownPct, mechanic.upgradeTrackKey);
    applyShownBar(mechanic, mechanic.els.shownBuildPct, mechanic.buildTrackKey);
    if (mechanic.afterRender) mechanic.afterRender();
  }

  function refresh(mechanic) {
    if (!renderEnabled) return;
    const assigned = pool(mechanic).getAssigned(mechanic.id);
    mechanic.els.nameEl.textContent = mechanic.cardName();
    mechanic.els.statEl.textContent = mechanic.getStatText();
    mechanic.els.cardStepperVal.textContent = assigned;
    mechanic.els.cardStepperMinus.disabled = assigned === 0;
    mechanic.els.cardStepperPlus.disabled = pool(mechanic).getIdleCount() === 0;
    // Optional: mechanic.stepperReady() — hide the face steppers entirely
    // until the card says it's ready for them (see makeStepperSet/click).
    if (mechanic.stepperReady) mechanic.els.cardSteppersWrap.style.display = mechanic.stepperReady() ? '' : 'none';
    if (mechanic.hideUpgradeBar && mechanic.els.upgradeBar) mechanic.els.upgradeBar.style.display = mechanic.hideUpgradeBar() ? 'none' : '';
    if (mechanic.hideBuildBar && mechanic.els.buildBar) mechanic.els.buildBar.style.display = mechanic.hideBuildBar() ? 'none' : '';
    // Optional: mechanic.isMuted() — a dimmed-but-still-clickable state.
    if (mechanic.isMuted) mechanic.els.wrap.classList.toggle('card-pending', mechanic.isMuted());
    // Sync card-face lock icon visibility with current locked state.
    if (mechanic.els.cardFaceLock) mechanic.els.cardFaceLock.style.display = mechanic.locked ? '' : 'none';
    refreshModalSteppers(mechanic);
    if (openModalMechanicId === mechanic.id) patchOpenModal(mechanic);
  }

  /* The stepper set built for a modal is thrown away when the modal
     closes, but mechanic.els.modalSteppers kept pointing at the now-
     detached DOM — so refreshModalSteppers() went on querying and
     measuring dead nodes every tick, for every card ever opened, and
     the detached nodes could never be collected. Cleared on close. */
  function dropModalSteppers(id) {
    const m = id && window.OrbWeaver.Mechanics.get(id);
    if (m && m.els) m.els.modalSteppers = null;
  }

  function closeModal() {
    dropModalSteppers(openModalMechanicId);
    openModalMechanicId = null;
    window.OrbWeaver.openCardModal('', '', null);
    document.getElementById('card-modal-scrim').classList.remove('open');
    markModalClosed();
  }

  function refreshOpenModal(mechanicId) {
    if (openModalMechanicId !== mechanicId) return;
    const mechanic = window.OrbWeaver.Mechanics.get(mechanicId);
    if (mechanic) rebuildOpenModal(mechanic);
  }

  // Stop treating the modal as "open" once it's closed, so we don't
  // keep re-rendering it every tick after the player closes it.
  document.addEventListener('click', (e) => {
    if (e.target.id === 'card-modal-close' || e.target.id === 'card-modal-scrim') {
      dropModalSteppers(openModalMechanicId);
      openModalMechanicId = null;
      markModalClosed();
    }
  });

  window.OrbWeaver.Cards = { build, refresh, refreshAll, setRenderEnabled, applyVisibility, refreshOpenModal, reveal, hide, closeModal, isGhostClick, isModalOpenFor, addHoldBehavior };
})();

</script>
<script>
/* ============================================================
   CORE: OFFLINE PROGRESS
   When the game reopens after being closed, replay the time that
   passed so the world is where it should be.

   COARSE REPLAY. The same tick() code every mechanic already runs,
   driven in 1-second steps instead of 0.2-second ones — five times
   fewer steps for the same simulated time. This reuses all existing
   logic, so a mechanic added next year is covered without touching
   this file. The tradeoff is honest and worth knowing: anything that
   can only happen once per tick is throughput-limited during replay
   (a tent that takes 0.4s to pitch still only completes one per
   step), and timers overshoot by up to a step. Both under-credit
   slightly, never over-credit.

   GOLD RUNS NORMALLY. Upkeep drains during replay exactly as it does
   live, so a player who logs off without a gold buffer comes back to
   a camp that stopped early. That is the intended design, not a bug —
   which is why the report says plainly when and how it happened.

   CHUNKED. A full 24 hours is tens of thousands of steps and takes
   long enough to freeze the tab. The replay runs a few thousand steps
   per animation frame instead, so the progress bar actually paints
   and the page stays responsive. The game loop is held until it
   finishes (see Save.init's callback) so nothing double-counts.

   THE BONUS SEAM. Offline.setBonus(fn) is where a future
   "reward for being away" goes. fn receives the finished report and
   may grant whatever it likes through Resources.add(), returning a
   short string to show in the summary. Nothing is designed yet, so
   nothing is assumed here.
   ============================================================ */
(function () {
  'use strict';
  window.OrbWeaver = window.OrbWeaver || {};

  const STEP_SECONDS = 1;      // coarse replay granularity
  const MAX_SECONDS = 86400;   // 24 hour cap
  const MIN_REPLAY = 10;       // below this, not worth simulating
  const MIN_REPORT = 60;       // below this, simulate but don't interrupt
  const CHUNK_STEPS = 3000;    // steps per animation frame
  const SAMPLE_STEPS = 60;     // how often the replay is observed, in steps

  let bonusFn = null;
  function setBonus(fn) { bonusFn = typeof fn === 'function' ? fn : null; }

  const el = (id) => document.getElementById(id);

  function formatDuration(s) {
    s = Math.floor(s);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    const parts = [];
    if (h) parts.push(`${h} hour${h === 1 ? '' : 's'}`);
    if (m) parts.push(`${m} minute${m === 1 ? '' : 's'}`);
    if (!h && !m) parts.push(`${sec} second${sec === 1 ? '' : 's'}`);
    return parts.join(' ');
  }

  function formatAmount(n) {
    const abs = Math.abs(n);
    if (abs >= 1000000) return (n / 1000000).toFixed(2) + 'M';
    if (abs >= 1000) return (n / 1000).toFixed(1) + 'k';
    return abs >= 10 ? Math.round(n).toString() : n.toFixed(1);
  }

  function snapshotResources() {
    const out = {};
    window.OrbWeaver.Resources.all().forEach((r) => { out[r.id] = r.current; });
    return out;
  }

  /* ---------------- The replay ---------------- */

  function apply(secondsAway, onDone) {
    const done = typeof onDone === 'function' ? onDone : function () {};
    const raw = Number(secondsAway) || 0;

    // A clock that moved backwards, or a nonsense value, credits nothing.
    if (!(raw >= MIN_REPLAY)) { done(); return; }

    const capped = Math.min(raw, MAX_SECONDS);
    const wasCapped = raw > MAX_SECONDS;
    const totalSteps = Math.floor(capped / STEP_SECONDS);

    /* Hold the live loop for the duration. The normal boot path already
       replays before starting it, but the replay spans animation frames,
       and if the loop were running its pumps would interleave between
       chunks — mixing 0.2s live ticks into a 1s coarse replay and
       double-counting the same wall-clock time. Enforce it here rather
       than relying on every caller to remember. */
    if (totalSteps <= 0) { done(); return; }

    const loopWasRunning = window.OrbWeaver.Loop.isRunning();
    if (loopWasRunning) window.OrbWeaver.Loop.stop();

    const before = snapshotResources();
    const goldBefore = window.OrbWeaver.Resources.get('gold');

    // Collect the announcements mechanics make during replay.
    const events = new Map();
    window.OrbWeaver.Footer.setMuted(true);
    window.OrbWeaver.Footer.setListener((msg) => { events.set(msg, (events.get(msg) || 0) + 1); });

    let goldRanOutAtStep = null;
    let stepsRun = 0;
    const showUI = capped >= MIN_REPORT;

    if (showUI) openProgress();

    function finish() {
      if (loopWasRunning) window.OrbWeaver.Loop.start();
      window.OrbWeaver.Footer.setListener(null);
      window.OrbWeaver.Footer.setMuted(false);

      const after = snapshotResources();
      const gains = [];
      Object.keys(after).forEach((id) => {
        const delta = after[id] - (before[id] || 0);
        if (Math.abs(delta) >= 0.05) {
          gains.push({ id: id, name: window.OrbWeaver.Resources.getName(id), delta: delta });
        }
      });
      gains.sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta));

      const report = {
        secondsAway: raw,
        secondsCredited: capped,
        wasCapped: wasCapped,
        gains: gains,
        events: Array.from(events.entries()).map(([msg, count]) => ({ message: msg, count: count })),
        goldRanOutAfterSeconds: goldRanOutAtStep == null ? null : goldRanOutAtStep * STEP_SECONDS,
        goldBefore: goldBefore,
        goldAfter: window.OrbWeaver.Resources.get('gold')
      };

      let bonusNote = null;
      if (bonusFn) {
        try { bonusNote = bonusFn(report) || null; }
        catch (err) { console.error('[Orb Weaver] Offline bonus threw:', err); }
      }
      report.bonusNote = bonusNote;

      // The loop restarts as soon as the summary is on screen, NOT when
      // it is dismissed. Gating the game's start on a button press means
      // one broken button is a game that never starts; the few seconds
      // of production that pass while the player reads are worth far
      // less than that failure mode. The summary is just an overlay.
      if (showUI) showReport(report);
      done();
    }

    function runChunk() {
      const remaining = totalSteps - stepsRun;
      if (remaining <= 0) { finish(); return; }
      const n = Math.min(CHUNK_STEPS, remaining);

      // Sampled every SAMPLE_STEPS so "your gold ran out after about X"
      // is accurate to the minute rather than to the chunk. Chunks are
      // thousands of steps; reporting a 20-second collapse as "about 50
      // minutes" would be worse than saying nothing.
      const base = stepsRun;
      window.OrbWeaver.Loop.runBulk(n, STEP_SECONDS, SAMPLE_STEPS, (done) => {
        if (goldRanOutAtStep == null && window.OrbWeaver.Resources.get('gold') <= 0) {
          goldRanOutAtStep = base + done;
        }
      });
      stepsRun += n;
      if (goldRanOutAtStep == null && window.OrbWeaver.Resources.get('gold') <= 0) {
        goldRanOutAtStep = stepsRun;
      }

      if (showUI) setProgress(stepsRun / totalSteps);

      if (stepsRun >= totalSteps) finish();
      else requestAnimationFrame(runChunk);
    }

    // One frame before starting, so the overlay paints before the
    // first chunk blocks the thread.
    if (showUI) requestAnimationFrame(() => requestAnimationFrame(runChunk));
    else runChunk();
  }

  /* ---------------- UI ---------------- */

  function openProgress() {
    const scrim = el('offline-modal-scrim');
    if (!scrim) return;
    el('offline-modal-body').innerHTML =
      `<div class="offline-progress-label">Catching up on what happened while you were away…</div>
       <div class="offline-progress-wrap"><div class="offline-progress-bar" id="offline-progress-bar"></div></div>`;
    el('offline-modal-close').style.display = 'none';
    scrim.classList.add('open');
  }

  function setProgress(pct) {
    const bar = el('offline-progress-bar');
    if (bar) bar.style.width = Math.round(Math.min(1, pct) * 100) + '%';
  }

  function showReport(report) {
    const scrim = el('offline-modal-scrim');
    if (!scrim) return;

    let html = `<div class="offline-away">You were away for <strong>${formatDuration(report.secondsAway)}</strong>.</div>`;
    if (report.wasCapped) {
      html += `<div class="offline-note">Offline progress is capped at 24 hours, so 24 hours were credited.</div>`;
    }

    if (report.goldRanOutAfterSeconds != null) {
      html += `<div class="offline-warning">
        <strong>Your gold ran out after about ${formatDuration(report.goldRanOutAfterSeconds)}.</strong>
        Workers cost gold every second, even while you are away — once the gold was gone, everything stopped.
        Build up a bigger gold buffer, or leave fewer workers assigned, before you log off next time.
      </div>`;
    }

    if (report.gains.length) {
      html += `<div class="offline-section-label">Changes</div><div class="offline-gains">`;
      report.gains.forEach((g) => {
        const sign = g.delta > 0 ? '+' : '−';
        const cls = g.delta > 0 ? 'up' : 'down';
        html += `<div class="offline-gain-row"><span class="offline-gain-name">${g.name}</span>
                 <span class="offline-gain-val ${cls}">${sign}${formatAmount(Math.abs(g.delta))}</span></div>`;
      });
      html += `</div>`;
    } else {
      html += `<div class="offline-note">Nothing changed while you were away.</div>`;
    }

    if (report.events.length) {
      html += `<div class="offline-section-label">While you were away</div><ul class="offline-events">`;
      report.events.slice(0, 12).forEach((e) => {
        html += `<li>${e.message}${e.count > 1 ? ` <span class="offline-event-count">×${e.count}</span>` : ''}</li>`;
      });
      if (report.events.length > 12) html += `<li>…and ${report.events.length - 12} more</li>`;
      html += `</ul>`;
    }

    if (report.bonusNote) html += `<div class="offline-bonus">${report.bonusNote}</div>`;

    html += `<button class="action-btn offline-continue" id="offline-continue-btn">Continue</button>`;

    el('offline-modal-body').innerHTML = html;
    el('offline-modal-close').style.display = '';

    function close() { scrim.classList.remove('open'); }
    el('offline-continue-btn').addEventListener('click', close);
    el('offline-modal-close').addEventListener('click', close);
    scrim.addEventListener('click', (e) => { if (e.target === scrim) close(); });
  }

  window.OrbWeaver.Offline = {
    apply, setBonus,
    MAX_SECONDS, STEP_SECONDS,
    formatDuration // exported for tests and for a future bonus to reuse
  };
})();

</script>
<script>
/* ============================================================
   CORE: SAVE / LOAD
   One autosave slot in localStorage, plus export/import as text so a
   player whose browser storage gets wiped isn't a lost player.

   THE ONE RULE FOR ADDING A MECHANIC:
     Save.register(id, saveFn, loadFn)
   saveFn returns a plain object, or may be null entirely when a
   mechanic stores nothing of its own. loadFn always runs on load —
   including for those null-save mechanics, whose load step is
   recomputing derived state from a track they don't own. Anything not
   JSON-safe — DOM nodes, functions, class instances — must not go in.

   SAVE THE SEED, NOT THE FRUIT. Store the smallest input that lets the
   value be recomputed, never the computed value itself. Wood saves its
   ladder INDEX, not its current name/rate/cap; Tents saves how many
   tents were built, not the current cost. This is what lets you
   rebalance numbers after release without freezing existing players on
   the old ones — the new table simply reaches them on next load.

   LOAD ORDER matters and is fixed below: resources, then worker pools,
   then tracks (which replay completed items and their side effects),
   then mechanics, then card visibility, then one repaint.

   FORMAT: OW1|<base64 of UTF-8 JSON>|<checksum>
   Base64 so a save isn't casually hand-editable into a broken state,
   checksummed so a truncated copy-paste fails loudly instead of
   silently loading half a game, prefixed and versioned so a future
   format change can migrate rather than break.
   ============================================================ */
(function () {
  'use strict';
  window.OrbWeaver = window.OrbWeaver || {};

  const STORAGE_KEY = 'orbweaver.save.v1';
  const FORMAT = 'OW1';
  const VERSION = 1;
  const AUTOSAVE_MS = 20000;

  const participants = []; // { id, save, load }
  let loading = false;
  let cheatsUsed = false;
  let autosaveId = null;
  let lastOfflineSeconds = 0;
  /* Set once a reload has been committed to (import, erase). A browser
     fires pagehide and beforeunload on its way out of the page, and both
     are wired to autosave — so without this flag the CURRENT game gets
     written over the save we just deliberately put in storage, and the
     page reloads into the very state the player was trying to replace.
     That is the bug that made Import silently do nothing. */
  let suspended = false;

  function register(id, saveFn, loadFn) { participants.push({ id, save: saveFn, load: loadFn }); }
  function isLoading() { return loading; }
  function markCheated() { cheatsUsed = true; }

  /* ---------------- Encoding ---------------- */

  // FNV-1a over the JSON. Not security — just enough to catch a
  // truncated or mangled paste before it corrupts a real save.
  function checksum(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
    }
    return h.toString(36);
  }

  // btoa only accepts Latin-1, so UTF-8 encode first (resource names
  // could easily contain a non-ASCII character one day).
  function b64encode(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = '';
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function b64decode(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  function encode(obj) {
    const json = JSON.stringify(obj);
    return `${FORMAT}|${b64encode(json)}|${checksum(json)}`;
  }

  // Returns the save object, or throws an Error with a message meant
  // for the player rather than the console.
  function decode(text) {
    const trimmed = String(text || '').trim();
    if (!trimmed) throw new Error('Nothing was pasted.');
    const parts = trimmed.split('|');
    if (parts[0] !== FORMAT) {
      throw new Error("That doesn't look like an Orb Weaver save — it should start with OW1|");
    }
    if (parts.length !== 3) {
      throw new Error('This save is incomplete — make sure the whole code was copied, right to the end.');
    }
    let json;
    try { json = b64decode(parts[1]); }
    catch (e) { throw new Error('This save is damaged and could not be read.'); }
    if (checksum(json) !== parts[2]) {
      throw new Error('This save is incomplete or was altered — check the whole text was copied.');
    }
    let obj;
    try { obj = JSON.parse(json); }
    catch (e) { throw new Error('This save is damaged and could not be read.'); }
    return migrate(obj);
  }

  /* ---------------- Versioning ----------------
     Empty today, deliberately. Adding versioning after players hold
     saves is miserable; adding it now is free. Each future format
     change appends one step here that upgrades the previous shape. */
  function migrate(data) {
    if (!data || typeof data !== 'object') throw new Error('This save is damaged and could not be read.');
    const v = data.version || 0;
    if (v > VERSION) throw new Error('This save is from a newer version of the game.');
    // if (data.version < 2) { ...transform...; data.version = 2; }
    return data;
  }

  /* ---------------- Collecting ---------------- */

  function serialize() {
    const tracks = {};
    const registered = window.OrbWeaver.Upgrades.allTracks();
    Object.keys(registered).forEach((key) => {
      const t = registered[key];
      if (t && t.serialize) tracks[key] = t.serialize();
    });

    const pools = {};
    const poolMap = window.OrbWeaver.Workers.getPools();
    Object.keys(poolMap).forEach((k) => { pools[k] = poolMap[k].serialize(); });

    const mechanics = {};
    participants.forEach((p) => {
      const d = p.save ? p.save() : null;
      if (d != null) mechanics[p.id] = d;
    });

    const cards = {};
    window.OrbWeaver.Mechanics.all().forEach((m) => {
      cards[m.id] = { r: m.revealed ? 1 : 0, l: m.locked ? 1 : 0 };
    });

    return {
      version: VERSION,
      savedAt: Date.now(),
      cheatsUsed: cheatsUsed,
      resources: window.OrbWeaver.Resources.serialize(),
      pools: pools,
      tracks: tracks,
      mechanics: mechanics,
      cards: cards,
      spw: window.OrbWeaver.Upgrades.getBaseSPW(),
      log: window.OrbWeaver.Footer.serialize()
    };
  }

  /* ---------------- Applying ---------------- */

  function restoreResources(saved) {
    if (!saved) return;
    Object.keys(saved).forEach((id) => {
      const r = saved[id];
      // A dynamic resource (created when cargo first delivered it to a
      // destination) doesn't exist on a fresh boot. Recreate it through
      // its owning location, which knows the right left-hand mount.
      if (!window.OrbWeaver.Resources.exists(id) && r.dyn) {
        const loc = window.OrbWeaver.Locations.all()
          .filter((l) => l.prefix && id.startsWith(l.prefix))
          .sort((a, b) => b.prefix.length - a.prefix.length)[0];
        if (loc && loc.ensureResource) loc.ensureResource(id.slice(loc.prefix.length), r.n || id);
      }
      if (!window.OrbWeaver.Resources.exists(id)) return;
      window.OrbWeaver.Resources.setRaw(id, r.v, r.cap);
      if (r.h) window.OrbWeaver.Resources.conceal(id);
      else window.OrbWeaver.Resources.reveal(id);
    });
  }

  function deserialize(data) {
    loading = true;
    window.OrbWeaver.Footer.setMuted(true);
    window.OrbWeaver.Cards.setRenderEnabled(false);
    try {
      cheatsUsed = !!data.cheatsUsed;
      if (data.spw != null) window.OrbWeaver.Upgrades.setBaseSPW(data.spw);
      window.OrbWeaver.Footer.deserialize(data.log); // before offline catch-up appends to it

      restoreResources(data.resources);

      const poolMap = window.OrbWeaver.Workers.getPools();
