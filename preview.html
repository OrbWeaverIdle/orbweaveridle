      Object.keys(data.pools || {}).forEach((k) => { if (poolMap[k]) poolMap[k].deserialize(data.pools[k]); });

      // Tracks before mechanics: replaying a completed choice-track item
      // fires its onComplete, which is how revealed cards and research
      // effects (Market bundle sizes, sale slots) come back.
      const registered = window.OrbWeaver.Upgrades.allTracks();
      Object.keys(data.tracks || {}).forEach((key) => {
        const t = registered[key];
        if (t && t.deserialize) t.deserialize(data.tracks[key]);
      });

      // Note the `|| {}`: a participant may legitimately save NOTHING
      // and still need loading. Wood, Stone and Quarry are exactly that
      // — they store no state of their own, and their whole load step
      // is replaying the ladder table up to the track's restored index.
      // Skipping them because there was no saved blob left every
      // resource card sitting at its tier-one name and rate.
      participants.forEach((p) => {
        if (!p.load) return;
        try { p.load((data.mechanics || {})[p.id] || {}); }
        catch (err) { console.error(`[Orb Weaver] ${p.id} failed to load its save data:`, err); }
      });

      // Card visibility last: the flags are the truth, the DOM follows.
      Object.keys(data.cards || {}).forEach((id) => {
        const m = window.OrbWeaver.Mechanics.get(id);
        if (!m) return; // a card removed from the game since this save
        m.revealed = !!data.cards[id].r;
        m.locked = !!data.cards[id].l;
      });
      window.OrbWeaver.Mechanics.all().forEach((m) => window.OrbWeaver.Cards.applyVisibility(m));

      lastOfflineSeconds = data.savedAt ? Math.max(0, (Date.now() - data.savedAt) / 1000) : 0;

      // One tick of ZERO length: advances no timers and produces no
      // resources, but lets every mechanic recompute its derived status
      // ('idle' / 'producing' / 'stopped', gold-starvation flags) from
      // the freshly restored world. Without it a card can show a stale
      // label for the first 200ms after loading.
      window.OrbWeaver.Loop.runBulk(1, 0);
    } finally {
      window.OrbWeaver.Cards.setRenderEnabled(true);
      window.OrbWeaver.Footer.setMuted(false);
      loading = false;
      window.OrbWeaver.Cards.refreshAll();
    }
  }

  /* ---------------- Storage ---------------- */

  function saveToStorage() {
    if (suspended) return false; // a reload is in flight; do not clobber it
    try {
      localStorage.setItem(STORAGE_KEY, encode(serialize()));
      return true;
    } catch (err) {
      // Private browsing, or storage full. Say so once rather than
      // failing silently every 20 seconds.
      console.error('[Orb Weaver] Could not autosave:', err);
      window.OrbWeaver.Footer.push('Could not save — your browser is blocking storage. Use Export in Settings to keep a copy.');
      return false;
    }
  }

  // Private browsing (notably Safari) exposes localStorage but throws on
  // write. Probing once is the only reliable way to know.
  function storageWorks() {
    try {
      localStorage.setItem(STORAGE_KEY + '.probe', '1');
      localStorage.removeItem(STORAGE_KEY + '.probe');
      return true;
    } catch (e) { return false; }
  }

  function hasSave() {
    try { return !!localStorage.getItem(STORAGE_KEY); } catch (e) { return false; }
  }

  function loadFromStorage() {
    let raw;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { return false; }
    if (!raw) return false;
    try {
      deserialize(decode(raw));
      return true;
    } catch (err) {
      // A corrupt autosave must never soft-lock the game on every boot.
      // Set it aside under a different key so it can be recovered, and
      // start fresh.
      console.error('[Orb Weaver] Save could not be loaded:', err);
      try { localStorage.setItem(STORAGE_KEY + '.broken', raw); localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      window.OrbWeaver.Footer.push('Your save could not be read and has been set aside. Starting a new game.');
      return false;
    }
  }

  function clearSave() {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  }

  function exportText() { return encode(serialize()); }

  /* Import. Preferred path is write-to-storage then reload, because a
     clean boot from the imported data is the most predictable outcome.
     Two things that path must get right:

       1. Autosave has to be suspended BEFORE the reload, or the unload
          handlers write the current game over the import.
       2. Some browsers (private windows especially) allow reads but
          throw on write. Rather than fail, fall back to applying the
          save to the running game — the same deserialize() the game
          uses at boot, just later. Any open modal is closed first so
          nothing is left rendering against replaced state.

     Returns true on success; throws an Error with a player-readable
     message if the text itself is not a usable save. */
  function importText(text) {
    const data = decode(text); // throws with a player-readable message

    if (storageWorks()) {
      suspended = true;
      try {
        localStorage.setItem(STORAGE_KEY, encode(data));
        location.reload();
        return true;
      } catch (err) {
        suspended = false; // write failed after all — fall through
        console.error('[Orb Weaver] Import could not be written to storage:', err);
      }
    }

    window.OrbWeaver.Cards.closeModal();
    deserialize(data);
    window.OrbWeaver.Footer.push('Save imported. This browser is blocking storage, so export a copy before you close the tab.');
    return true;
  }

  // Erase has the same unload problem as import: without suspending,
  // the current game is written straight back over the cleared slot.
  function eraseAndReload() {
    suspended = true;
    clearSave();
    location.reload();
  }

  function startAutosave() {
    if (autosaveId) return;
    autosaveId = setInterval(saveToStorage, AUTOSAVE_MS);
    // pagehide is the reliable one on mobile Safari, where a tab can be
    // discarded without ever firing beforeunload.
    window.addEventListener('pagehide', saveToStorage);
    window.addEventListener('beforeunload', saveToStorage);
    document.addEventListener('visibilitychange', () => { if (document.hidden) saveToStorage(); });
  }

  /* ---------------- Offline seam (Stage 3) ----------------
     savedAt is recorded from day one so that when offline progress is
     built, saves written today already carry what it needs. The hook
     below is deliberately empty: Stage 3 fills it with the 24-hour
     capped, coarse 1-second replay via Loop.runBulk(), plus whatever
     offline bonus gets designed. */
  function getLastOfflineSeconds() { return lastOfflineSeconds; }

  /* ---------------- Boot ----------------
     init(onReady) restores the save, then hands control to the offline
     catch-up, which may span several animation frames while it replays
     and shows its summary. onReady fires exactly once when the world is
     settled — main.js starts the game loop there, NOT before, so live
     ticks can't run concurrently with the replay and double-count. */
  function init(onReady) {
    let fired = false;
    const ready = () => { if (!fired) { fired = true; startAutosave(); if (onReady) onReady(); } };

    let loaded = false;
    try { loaded = loadFromStorage(); }
    catch (err) { console.error('[Orb Weaver] Load failed:', err); }

    if (!loaded || !window.OrbWeaver.Offline) { ready(); return loaded; }

    try { window.OrbWeaver.Offline.apply(lastOfflineSeconds, ready); }
    catch (err) {
      // Offline progress failing must never stop the game starting.
      console.error('[Orb Weaver] Offline catch-up failed:', err);
      ready();
    }
    return loaded;
  }

  window.OrbWeaver.Save = {
    register, init, serialize, deserialize, encode, decode,
    saveToStorage, loadFromStorage, hasSave, clearSave, eraseAndReload, storageWorks,
    exportText, importText, isLoading, markCheated, getLastOfflineSeconds
  };

  /* ---------------- Settings UI + cheat flag ---------------- */
  document.addEventListener('DOMContentLoaded', () => {
    // Any cheat press stamps the save. Costs nothing now and you'll
    // want it the moment there's an achievement or a leaderboard.
    const header = document.getElementById('cheat-header');
    if (header) header.addEventListener('click', (e) => { if (e.target.closest('.cheat-btn')) markCheated(); });

    const box = document.getElementById('save-text');
    const status = document.getElementById('save-status');
    const setStatus = (msg) => { if (status) status.textContent = msg || ''; };

    const exportBtn = document.getElementById('save-export-btn');
    if (exportBtn) exportBtn.addEventListener('click', () => {
      box.value = exportText();
      box.select();
      const manual = () => setStatus('Copy the whole code above (it is already selected) and keep it somewhere safe.');
      // Clipboard access is blocked in plenty of contexts — insecure
      // origins, private windows, some mobile browsers. Selecting the
      // text means a manual copy always works as a fallback.
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(box.value)
          .then(() => setStatus('Save copied to clipboard. Keep it somewhere safe.'))
          .catch(manual);
      } else {
        try {
          if (document.execCommand('copy')) setStatus('Save copied to clipboard. Keep it somewhere safe.');
          else manual();
        } catch (e) { manual(); }
      }
    });

    const importBtn = document.getElementById('save-import-btn');
    if (importBtn) {
      // The box is always on screen, so importing is one action: paste,
      // then press. An earlier version opened the box on the first press
      // and imported on the second, which read as the button doing
      // nothing. Never make a button's first press invisible.
      importBtn.addEventListener('click', () => {
        const text = box.value.trim();
        if (!text) {
          box.focus();
          setStatus('Paste your save code into the box above first.');
          return;
        }
        try {
          setStatus('Loading…');
          importText(text);
          setStatus('Save loaded.');
        } catch (err) {
          setStatus(err.message);
        }
      });
    }

    const resetBtn = document.getElementById('save-reset-btn');
    if (resetBtn) {
      let armed = false;
      resetBtn.addEventListener('click', () => {
        if (!armed) {
          armed = true;
          resetBtn.textContent = 'Really erase? Click again';
          setStatus('This erases your save permanently. Export a copy first if you want one.');
          setTimeout(() => { armed = false; resetBtn.textContent = 'Erase save'; }, 5000);
          return;
        }
        eraseAndReload();
      });
    }
  });
})();

</script>
<script>
/* ============================================================
   CORE: SCOUT STABLE FACTORY
   createScoutStable(config) builds one Scout Stable — worker-powered
   Expedition tab + Resupply tab (two cargo vehicles) — and registers
   it and its cargo cards. Every location's Scout Stable (Camp,
   Mountains, and future ones) is one call to this factory with a
   short config, instead of a hand-copied file per location.

   config:
     id              — mechanic id for the Scout Stable card
     locationId      — this location's id in the Locations registry
     section         — display section ('Camp', 'Mountains', ...)
     resourcePrefix  — this location's resource id prefix ('' for Camp)
     modalTheme      — optional, recolors the shared modal
     workerPool      — pool instance (defaults to the Camp pool)
     vehicles        — { mule: {id,cap,travel,label}, cartbull: {...} }
     hasInitialExpedition — true only for Camp: its Expedition tab has
       the one-time "Prepare Mule" flow that discovers a new location.
       Every other location starts (and stays) on the greyed
       "Visit Academy for more Expeditions" message — future
       Expeditions are unlocked via Academy research, shared by every
       Scout Stable, not built yet.
     expeditionMuleId, expeditionTargetWood, expeditionTravelTime,
     onExpeditionComplete(ridersAway) — only used when
       hasInitialExpedition is true.
   ============================================================ */
(function () {
  'use strict';
  window.OrbWeaver = window.OrbWeaver || {};

  function createScoutStable(config) {
    const ID = config.id;
    const LOC = config.locationId;
    const VEHICLES = config.vehicles;
    const pool = () => config.workerPool || window.OrbWeaver.Workers;
    const cardIdFor = (vk) => VEHICLES[vk].id;

    // Resources belonging to this location: id starts with this
    // location's prefix and isn't claimed by any other location's
    // prefix (Camp's prefix '' would otherwise match everything).
    function ownResources() {
      const otherPrefixes = window.OrbWeaver.Locations.all()
        .map((l) => l.prefix).filter((p) => p && p !== config.resourcePrefix);
      return window.OrbWeaver.Resources.all().filter((r) =>
        r.id !== 'gold' && r.id.startsWith(config.resourcePrefix) &&
        !otherPrefixes.some((p) => r.id.startsWith(p)));
    }
    function isZero(id) { return window.OrbWeaver.Resources.get(id) <= 0; }
    function displayName(id) { return window.OrbWeaver.Resources.getName(id); }

    function availableDestinations() { return window.OrbWeaver.Locations.destinationsFor(LOC); }
    function destinationById(id) { return availableDestinations().find((d) => d.id === id) || null; }

    let everOpened = false;
    let activeTab = 'expedition';

    // ---- Expedition state (only meaningful when hasInitialExpedition) ----
    let expeditionPhase = 'idle';
    let expeditionCollected = 0;
    let expeditionStalled = false;
    let expeditionRemaining = 0;
    let expeditionRidersAway = 0;
    let goldStarved = false;

    // ---- Cargo state ----
    const plans = {
      mule:     { dest: null, items: [] },
      cartbull: { dest: null, items: [] }
    };
    const runs = {
      mule:     { phase: 'idle', run: null, remaining: 0, ridersAway: 0, destId: null, auto: false, autoStarted: false },
      cartbull: { phase: 'idle', run: null, remaining: 0, ridersAway: 0, destId: null, auto: false, autoStarted: false }
    };

    function trackerLine(r) {
      return r.run.map((it) => `${Math.floor(it.loaded)}/${it.qty} ${displayName(it.res)}`).join(', ');
    }

    function cargoOptions(vk) {
      const taken = new Set(plans[vk].items.map((p) => p.res));
      return ownResources().filter((r) => !taken.has(r.id)).map((r) => ({ id: r.id, name: displayName(r.id) }));
    }

    function isCargoStalled(vk) {
      const r = runs[vk];
      if (r.phase !== 'loading' || !r.run) return false;
      if (pool().getAssigned(ID) < 1 || goldStarved) return true;
      const unfilled = r.run.filter((it) => it.loaded < it.qty - 1e-9);
      return unfilled.length > 0 && unfilled.every((it) => window.OrbWeaver.Resources.get(it.res) <= 0);
    }

    function clampQty(vk, res, raw) {
      const cap = VEHICLES[vk].cap;
      const others = plans[vk].items.filter((p) => p.res !== res).reduce((a, p) => a + p.qty, 0);
      return Math.max(1, Math.min(raw, cap - others));
    }

    /* ---- Expedition tab ---- */
    function renderExpeditionTab() {
      if (!config.hasInitialExpedition) return `<div class="sp-tab-greyed">Visit Academy for more Expeditions.</div>`;
      if (expeditionPhase !== 'idle') return `<div class="sp-tab-greyed">Visit Academy for more Expeditions.</div>`;
      return `<div class="upgrade-row-horizontal">
        <div class="upgrade-text-stack">
          <span class="upgrade-name">Prepare Mule</span>
          <span class="upgrade-desc">Prepare an expedition to explore the surrounding lands.</span>
        </div>
        <button class="action-btn" data-sp-action="prepare-mule" data-sp-loc="${LOC}">Prepare Mule</button>
      </div>`;
    }

    /* ---- Resupply tab ---- */
    function renderDestSelector(vk) {
      const dests = availableDestinations();
      const plan = plans[vk];
      if (!plan.dest || !dests.some((d) => d.id === plan.dest)) plan.dest = dests[0] ? dests[0].id : null;
      if (dests.length <= 1) return '';
      return `<select class="sp-select sp-dest-select" data-sp-action="set-dest" data-sp-loc="${LOC}" data-sp-vehicle="${vk}">
        ${dests.map((d) => `<option value="${d.id}"${d.id === plan.dest ? ' selected' : ''}>${d.label}</option>`).join('')}
      </select>`;
    }

    function renderCargoGrid(vk) {
      const plan = plans[vk], cap = VEHICLES[vk].cap;
      const total = plan.items.reduce((a, p) => a + p.qty, 0);
      const cards = plan.items.map((p) => {
        const zero = isZero(p.res);
        return `<div class="cargo-card${zero ? ' future' : ''}" data-sp-row="${p.res}">
          <span class="cargo-name">${displayName(p.res)}</span>
          <button class="card-stepper-btn" data-sp-action="qty-minus" data-sp-loc="${LOC}" data-sp-vehicle="${vk}" data-sp-res="${p.res}" ${p.qty <= 1 ? 'disabled' : ''}>–</button>
          <span class="card-stepper-val" data-sp-action="qty-edit" data-sp-loc="${LOC}" data-sp-vehicle="${vk}" data-sp-res="${p.res}">${p.qty}</span>
          <button class="card-stepper-btn" data-sp-action="qty-plus" data-sp-loc="${LOC}" data-sp-vehicle="${vk}" data-sp-res="${p.res}" ${total >= cap ? 'disabled' : ''}>+</button>
          <button class="sp-remove-btn" data-sp-action="remove-resource" data-sp-loc="${LOC}" data-sp-vehicle="${vk}" data-sp-res="${p.res}" ${plan.items.length <= 1 ? 'disabled' : ''}>×</button>
        </div>`;
      }).join('');
      const opts = cargoOptions(vk);
      const dropdown = opts.length
        ? `<select class="sp-select" data-sp-action="add-resource" data-sp-loc="${LOC}" data-sp-vehicle="${vk}">
            <option value="">+ Add resource…</option>
            ${opts.map((r) => `<option value="${r.id}"${isZero(r.id) ? ' class="sp-option-future"' : ''}>${r.name}${isZero(r.id) ? ' (none in stock)' : ''}</option>`).join('')}
          </select>`
        : '';
      return `<div class="cargo-grid">${cards}</div>${dropdown}
        <div class="sp-cap-line">${total}/${cap} loaded per ${VEHICLES[vk].label.toLowerCase()}</div>`;
    }

    function renderVehicleLabelRow(vk) {
      const cfg = VEHICLES[vk];
      const on = runs[vk].auto;
      return `<div class="sp-vehicle-label-row">
        <span class="modal-subsection-label">${cfg.label}</span>
        <div class="toggle-switch${on ? ' on' : ''}" data-sp-action="toggle-auto" data-sp-loc="${LOC}" data-sp-vehicle="${vk}" title="Auto"></div>
      </div>`;
    }

    function renderLoadingView(vk) {
      const r = runs[vk];
      const total = r.run.reduce((a, it) => a + it.qty, 0);
      const loaded = r.run.reduce((a, it) => a + it.loaded, 0);
      const pct = total > 0 ? (loaded / total) * 100 : 0;
      return `<div class="detail-card">
        <div class="detail-card-desc">Loading: ${trackerLine(r)}</div>
        <div class="detail-progress-wrap"><div class="detail-progress-bar" style="width:${pct.toFixed(1)}%"></div></div>
        <button class="action-btn" data-sp-action="cancel-cargo" data-sp-loc="${LOC}" data-sp-vehicle="${vk}">Cancel</button>
      </div>`;
    }

    function renderDispatchButton(vk) {
      const r = runs[vk], plan = plans[vk];
      const total = plan.items.reduce((a, p) => a + p.qty, 0);
      const busy = r.phase !== 'idle';
      const label = busy ? `${VEHICLES[vk].label} in transit…` : `Dispatch`;
      return `<button class="action-btn" data-sp-action="dispatch" data-sp-loc="${LOC}" data-sp-vehicle="${vk}" ${busy || total <= 0 || !plan.dest ? 'disabled' : ''}>${label}</button>`;
    }

    function renderVehicleColumn(vk) {
      const labelRow = `<div class="sp-vehicle-label-divider">${renderVehicleLabelRow(vk)}</div>`;
      const r = runs[vk];
      const body = r.phase === 'loading'
        ? renderLoadingView(vk)
        : renderDestSelector(vk) + renderCargoGrid(vk) + renderDispatchButton(vk);
      return `<div class="sp-vehicle-col">${labelRow}<div class="sp-vehicle-panel" data-sp-vehicle-panel="${vk}">${body}</div></div>`;
    }

    function renderResupplyTab() {
      if (availableDestinations().length === 0) return `<div class="sp-tab-greyed">No discovered destinations yet.</div>`;
      return `<div class="sp-vehicle-row">${renderVehicleColumn('mule')}${renderVehicleColumn('cartbull')}</div>`;
    }

    function adjustQty(vk, res, delta) {
      const p = plans[vk].items.find((x) => x.res === res);
      if (!p) return;
      p.qty = clampQty(vk, res, p.qty + delta);
    }
    function setQty(vk, res, raw) {
      const p = plans[vk].items.find((x) => x.res === res);
      if (!p) return;
      p.qty = clampQty(vk, res, raw);
    }

    function patchCargoRows(vk) {
      const plan = plans[vk], cap = VEHICLES[vk].cap;
      const total = plan.items.reduce((a, p) => a + p.qty, 0);
      const scope = `#card-modal-body [data-sp-vehicle-panel="${vk}"]`;
      plan.items.forEach((p) => {
        const row = document.querySelector(`${scope} .cargo-card[data-sp-row="${p.res}"]`);
        if (!row) return;
        const val = row.querySelector('.card-stepper-val');
        if (val && val.tagName !== 'INPUT') val.textContent = p.qty;
        const minus = row.querySelector('[data-sp-action="qty-minus"]');
        const plus = row.querySelector('[data-sp-action="qty-plus"]');
        if (minus) minus.disabled = p.qty <= 1;
        if (plus) plus.disabled = total >= cap;
      });
      const capLine = document.querySelector(`${scope} .sp-cap-line`);
      if (capLine) capLine.textContent = `${total}/${cap} loaded per ${VEHICLES[vk].label.toLowerCase()}`;
      const goBtn = document.querySelector(`${scope} [data-sp-action="dispatch"]`);
      if (goBtn) goBtn.disabled = runs[vk].phase !== 'idle' || total <= 0 || !plan.dest;
    }

    function activateQtyEdit(span, vk, res) {
      if (span.tagName === 'INPUT') return;
      const plan = plans[vk];
      const p = plan.items.find((x) => x.res === res);
      if (!p) return;
      const input = document.createElement('input');
      input.type = 'text';
      input.inputMode = 'numeric';
      input.className = 'cargo-qty-input';
      input.value = p.qty;
      span.replaceWith(input);
      input.select();

      function commit() {
        const raw = parseInt(input.value, 10);
        if (!isNaN(raw)) setQty(vk, res, raw);
        window.OrbWeaver.Cards.refreshOpenModal(ID);
      }
      function cancel() { window.OrbWeaver.Cards.refreshOpenModal(ID); }

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); commit(); }
        if (e.key === 'Escape') { e.preventDefault(); cancel(); }
      });
      input.addEventListener('blur', commit);
    }

    const mechanic = {
      id: ID,
      startHidden: true,
      section: config.section,
      modalTheme: config.modalTheme,
      modalWide: true,
      workerPool: config.workerPool,
      cardName: () => 'Scout Stable',
      isBillable: () => expeditionPhase === 'preparing' || runs.mule.phase === 'loading' || runs.cartbull.phase === 'loading',
      getStatText() {
        if (pool().getAssigned(ID) === 0) return '';
        if (goldStarved) return 'Stopped';
        const anyAutoActive = ['mule', 'cartbull'].some((vk) => runs[vk].auto && runs[vk].phase !== 'idle');
        if (anyAutoActive) return 'Auto-loading';
        return mechanic.isBillable() ? '' : 'Stopped';
      },
      getUpgradeBarPct: () => 0,
      patchLiveTrack() {
        ['mule', 'cartbull'].forEach((vk) => {
          const r = runs[vk];
          if (r.phase !== 'loading' || !r.run) return;
          const scope = `#card-modal-body [data-sp-vehicle-panel="${vk}"]`;
          const total = r.run.reduce((a, it) => a + it.qty, 0);
          const loaded = r.run.reduce((a, it) => a + it.loaded, 0);
          const bar = document.querySelector(`${scope} .detail-progress-bar`);
          if (bar) bar.style.width = (total > 0 ? (loaded / total) * 100 : 0).toFixed(1) + '%';
          const desc = document.querySelector(`${scope} .detail-card-desc`);
          if (desc) desc.textContent = 'Loading: ' + trackerLine(r);
        });
      },
      getWorkerDesc() {
        const assigned = pool().getAssigned(ID);
        return assigned === 0 ? '' : `Loading ${window.OrbWeaver.Upgrades.formatRate(assigned * window.OrbWeaver.Upgrades.getBaseSPW())}s faster`;
      },
      onOpen() { activeTab = (config.hasInitialExpedition && !everOpened) ? 'expedition' : 'resupply'; everOpened = true; },
      afterRender() {
        if (activeTab !== 'resupply') return;
        document.querySelectorAll('#card-modal-body [data-sp-action="qty-plus"]').forEach((btn) => {
          window.OrbWeaver.Cards.addHoldBehavior(btn, () => { adjustQty(btn.dataset.spVehicle, btn.dataset.spRes, 1); patchCargoRows(btn.dataset.spVehicle); });
        });
        document.querySelectorAll('#card-modal-body [data-sp-action="qty-minus"]').forEach((btn) => {
          window.OrbWeaver.Cards.addHoldBehavior(btn, () => { adjustQty(btn.dataset.spVehicle, btn.dataset.spRes, -1); patchCargoRows(btn.dataset.spVehicle); });
        });
      },
      renderModalHTML() {
        const tabs = `<div class="sp-tabs">
          <button class="sp-tab${activeTab === 'resupply' ? ' active' : ''}" data-sp-action="tab" data-sp-loc="${LOC}" data-sp-tab="resupply">Resupply</button>
          <button class="sp-tab${activeTab === 'expedition' ? ' active' : ''}" data-sp-action="tab" data-sp-loc="${LOC}" data-sp-tab="expedition">Expedition</button>
        </div>`;
        const body = activeTab === 'expedition' ? renderExpeditionTab() : renderResupplyTab();
        return `<div class="scoutspen-modal">${tabs}<div class="sp-tab-body">${body}</div></div>`;
      },
      tick(goldAvailable, tickRate) {
        goldStarved = !goldAvailable;
        const assigned = pool().getAssigned(ID);
        const spw = window.OrbWeaver.Upgrades.getBaseSPW();
        const perTick = assigned >= 1 ? tickRate * (2 + assigned * spw) : 0;

        if (goldAvailable) {
          if (config.hasInitialExpedition && expeditionPhase === 'preparing') {
            const actual = window.OrbWeaver.Resources.spend('wood', perTick);
            expeditionCollected += actual;
            expeditionStalled = actual < perTick - 1e-9;
            if (expeditionCollected >= config.expeditionTargetWood) {
              expeditionCollected = config.expeditionTargetWood;
              expeditionPhase = 'ready';
              pool().transferAssignment(ID, config.expeditionMuleId, 1);
              window.OrbWeaver.Footer.push('The mule is ready to embark!');
              if (window.OrbWeaver.Cards.isModalOpenFor(config.expeditionMuleId)) window.OrbWeaver.Cards.closeModal();
            }
          }

          ['mule', 'cartbull'].forEach((vk) => {
            const r = runs[vk];
            if (r.phase !== 'loading') return;
            const unfilled = r.run.filter((it) => it.loaded < it.qty - 1e-9);
            if (unfilled.length > 0 && perTick > 0) {
              const share = perTick / unfilled.length;
              unfilled.forEach((it) => {
                const actual = window.OrbWeaver.Resources.spend(it.res, Math.min(share, it.qty - it.loaded));
                it.loaded += actual;
              });
            }
            if (r.run.every((it) => it.loaded >= it.qty - 1e-9)) {
              r.phase = 'loaded';
              if (r.auto) autoDisembark(vk);
              else pool().transferAssignment(ID, cardIdFor(vk), 1);
            }
          });
        }

        ['mule', 'cartbull'].forEach((vk) => {
          const r = runs[vk];
          if (r.phase === 'idle' && r.auto && r.autoStarted && plans[vk].items.length > 0 && plans[vk].dest) {
            dispatchVehicle(vk, false);
          }
        });

        window.OrbWeaver.Cards.refresh(mechanic);
      }
    };

    /* ---------------- Expedition Mule (Camp only) ---------------- */
    let expeditionMuleMechanic = null;
    if (config.hasInitialExpedition) {
      expeditionMuleMechanic = {
        id: config.expeditionMuleId,
        startHidden: true, section: config.section, isMule: true, modalTheme: 'theme-mule', upkeepExempt: true,
        workerPool: config.workerPool,
        cardName: () => 'Expedition Mule',
        getUpgradeBarPct: () => 0,
        stepperReady: () => expeditionPhase === 'ready',
        isMuted: () => expeditionPhase === 'preparing',
        getBuildBarPct() {
          if (expeditionPhase === 'preparing') return (expeditionCollected / config.expeditionTargetWood) * 100;
          if (expeditionPhase === 'traveling') return ((config.expeditionTravelTime - expeditionRemaining) / config.expeditionTravelTime) * 100;
          return 0;
        },
        getStatText() {
          if (expeditionPhase === 'preparing') return `${expeditionStalled ? 'Stopped – ' : ''}Preparing mule – ${Math.floor(expeditionCollected)}/${config.expeditionTargetWood} wood`;
          if (expeditionPhase === 'ready') return 'Ready to disembark';
          if (expeditionPhase === 'traveling') return `On Expedition… ${Math.ceil(expeditionRemaining)}s`;
          return '';
        },
        patchBuildStatus() {
          if (expeditionPhase === 'preparing') return `${Math.floor(expeditionCollected)}/${config.expeditionTargetWood} wood`;
          if (expeditionPhase === 'traveling') return `${Math.ceil(expeditionRemaining)}s remaining`;
          return null;
        },
        renderModalHTML() {
          if (expeditionPhase === 'ready') {
            const canGo = pool().getAssigned(config.expeditionMuleId) > 0;
            return `<div class="detail-card">
              <div class="detail-card-desc">Embark on an expedition of the surrounding lands.</div>
              <button class="action-btn" data-sp-action="disembark-expedition" data-sp-loc="${LOC}" ${canGo ? '' : 'disabled'}>Disembark</button>
              <div class="detail-card-desc">Assigned workers leave camp. Can return later.</div>
            </div>`;
          }
          if (expeditionPhase === 'traveling') {
            return `<div class="detail-card">
              <div class="detail-card-desc">On expedition…</div>
              <div class="detail-progress-wrap"><div class="detail-progress-bar"></div></div>
              <div class="detail-status"><span>${Math.ceil(expeditionRemaining)}s remaining</span></div>
            </div>`;
          }
          return `<div class="detail-card">
            <div class="detail-card-desc">Preparing a mule for expedition.</div>
            <div class="detail-progress-wrap"><div class="detail-progress-bar"></div></div>
            <div class="detail-status"><span>${Math.floor(expeditionCollected)}/${config.expeditionTargetWood} wood</span></div>
            <button class="action-btn" data-sp-action="cancel-expedition" data-sp-loc="${LOC}">Cancel</button>
          </div>`;
        },
        patchLiveTrack() {
          const btn = document.querySelector('#card-modal-body [data-sp-action="disembark-expedition"]');
          if (btn) btn.disabled = pool().getAssigned(config.expeditionMuleId) <= 0;
        },
        tick(goldAvailable, tickRate) {
          if (expeditionPhase === 'traveling') {
            expeditionRemaining -= tickRate;
            if (expeditionRemaining <= 0) completeExpedition();
          }
          window.OrbWeaver.Cards.refresh(expeditionMuleMechanic);
        }
      };
    }

    function prepareMule() {
      if (!config.hasInitialExpedition || expeditionPhase !== 'idle') return;
      expeditionPhase = 'preparing';
      window.OrbWeaver.Cards.reveal(expeditionMuleMechanic);
      window.OrbWeaver.Cards.closeModal();
    }
    function disembarkExpedition() {
      if (!config.hasInitialExpedition || expeditionPhase !== 'ready' || pool().getAssigned(config.expeditionMuleId) <= 0) return;
      expeditionRidersAway = pool().sequester(config.expeditionMuleId);
      expeditionPhase = 'traveling';
      expeditionRemaining = config.expeditionTravelTime;
      window.OrbWeaver.Cards.closeModal();
    }
    function cancelExpedition() {
      if (!config.hasInitialExpedition || expeditionPhase !== 'preparing') return;
      const space = (window.OrbWeaver.Resources.getCap('wood') ?? Infinity) - window.OrbWeaver.Resources.get('wood');
      window.OrbWeaver.Resources.add('wood', Math.min(expeditionCollected, space));
      expeditionCollected = 0; expeditionStalled = false; expeditionPhase = 'idle';
      window.OrbWeaver.Cards.hide(expeditionMuleMechanic);
      if (window.OrbWeaver.Cards.isModalOpenFor(config.expeditionMuleId)) window.OrbWeaver.Cards.closeModal();
    }
    function completeExpedition() {
      expeditionPhase = 'delivered';
      window.OrbWeaver.Cards.hide(expeditionMuleMechanic);
      if (config.onExpeditionComplete) config.onExpeditionComplete(expeditionRidersAway);
    }

    /* ---------------- Cargo vehicles ---------------- */
    function makeCargoMechanic(vk) {
      const cfg = VEHICLES[vk];
      const obj = {
        id: cardIdFor(vk), startHidden: true, section: config.section,
        isMule: true, modalTheme: 'theme-mule', upkeepExempt: true, gapOnHide: true,
        workerPool: config.workerPool,
        cardName: () => cfg.label,
        getUpgradeBarPct: () => 0,
        stepperReady: () => runs[vk].phase === 'loaded',
        isBuildBarFaded: () => runs[vk].phase === 'loading',
        getBuildBarPct() {
          const r = runs[vk];
          if (r.phase === 'traveling') return ((cfg.travel - r.remaining) / cfg.travel) * 100;
          if (!r.run) return 0;
          const need = r.run.reduce((a, it) => a + it.qty, 0);
          return need > 0 ? (r.run.reduce((a, it) => a + it.loaded, 0) / need) * 100 : 0;
        },
        getStatText() {
          const r = runs[vk];
          if (r.phase === 'traveling') return `Traveling… ${Math.ceil(r.remaining)}s`;
          if (r.phase === 'loading' || r.phase === 'loaded') return `${r.phase === 'loaded' ? 'Ready to depart' : (isCargoStalled(vk) ? 'Stopped' : 'Loading')} – ${trackerLine(r)}`;
          return '';
        },
        patchBuildStatus() {
          const r = runs[vk];
          if (r.phase === 'traveling') return `${Math.ceil(r.remaining)}s remaining`;
          if (r.phase === 'loading' || r.phase === 'loaded') return trackerLine(r);
          return null;
        },
        renderModalHTML() {
          const r = runs[vk];
          const destLabel = destinationById(r.destId)?.label ?? 'its destination';
          if (r.phase === 'traveling') {
            const cargo = r.run ? r.run.map((it) => `${Math.floor(it.loaded)} ${displayName(it.res)}`).join(', ') : '';
            return `<div class="detail-card">
              <div class="detail-card-desc">On the road to ${destLabel}…</div>
              ${cargo ? `<div class="detail-card-desc">${cargo}</div>` : ''}
              <div class="detail-progress-wrap"><div class="detail-progress-bar"></div></div>
              <div class="detail-status"><span>${Math.ceil(r.remaining)}s remaining</span></div>
            </div>`;
          }
          if (r.phase === 'loading') {
            return `<div class="detail-card">
              <div class="detail-card-desc">Loading cargo bound for ${destLabel}.</div>
              <div class="detail-progress-wrap"><div class="detail-progress-bar"></div></div>
              <div class="detail-status"><span>${r.run ? trackerLine(r) : ''}</span></div>
              <button class="action-btn" data-sp-action="cancel-cargo" data-sp-loc="${LOC}" data-sp-vehicle="${vk}">Cancel</button>
            </div>`;
          }
          const canGo = pool().getAssigned(cardIdFor(vk)) > 0;
          return `<div class="detail-card">
            <div class="detail-card-desc">Fully loaded, ready to depart for ${destLabel}.</div>
            <div class="detail-progress-wrap"><div class="detail-progress-bar"></div></div>
            <div class="detail-status"><span>${r.run ? trackerLine(r) : ''}</span></div>
            <button class="action-btn" data-sp-action="disembark-cargo" data-sp-loc="${LOC}" data-sp-vehicle="${vk}" ${canGo ? '' : 'disabled'}>Disembark</button>
          </div>`;
        },
        patchLiveTrack() {
          const btn = document.querySelector(`#card-modal-body [data-sp-action="disembark-cargo"][data-sp-vehicle="${vk}"]`);
          if (btn) btn.disabled = pool().getAssigned(cardIdFor(vk)) <= 0;
        },
        tick(goldAvailable, tickRate) {
          if (runs[vk].phase === 'traveling') {
            runs[vk].remaining -= tickRate;
            if (runs[vk].remaining <= 0) completeVehicle(vk);
          }
          window.OrbWeaver.Cards.refresh(obj);
        }
      };
      return obj;
    }
    const resupplyMuleMechanic = makeCargoMechanic('mule');
    const cartBullMechanic = makeCargoMechanic('cartbull');

    /* ---- Save/load ----
       Registered once per Scout Stable instance (Camp's and Mountains'
       each get their own entry, keyed by this stable's id).

       THE TRAP: ridersAway. sequester() removes a vehicle's crew from
       the pool entirely — it decrements `total`, so they are neither
       idle nor active nor recallable while away, and completeVehicle()
       later hands them to the destination. The pool saves the reduced
       total faithfully; if these counters were not saved alongside it,
       every worker on the road at save time would be permanently
       deleted. Save both, or neither.

       Travel time is stored as remaining seconds and keeps ticking,
       rather than as an arrival timestamp — the offline replay window
       (24h) is far longer than any trip, so a countdown still completes
       across a closed tab, and travel stays consistent with every other
       timer in the game (including the speed-multiplier cheat). */
    function serializeRun(r) {
      return {
        p: r.phase, rem: r.remaining, ra: r.ridersAway, d: r.destId,
        a: r.auto ? 1 : 0, as: r.autoStarted ? 1 : 0,
        run: r.run ? r.run.map((it) => ({ r: it.res, q: it.qty, l: it.loaded })) : null
      };
    }
    function restoreRun(r, d) {
      if (!d) return;
      r.phase = d.p || 'idle';
      r.remaining = d.rem || 0;
      r.ridersAway = d.ra || 0;
      r.destId = d.d || null;
      r.auto = !!d.a;
      r.autoStarted = !!d.as;
      r.run = d.run ? d.run.map((it) => ({ res: it.r, qty: it.q, loaded: it.l })) : null;
    }

    window.OrbWeaver.Save.register(ID,
      () => ({
        eo: everOpened ? 1 : 0, tab: activeTab,
        ep: expeditionPhase, ec: expeditionCollected,
        er: expeditionRemaining, era: expeditionRidersAway,
        plans: {
          mule: { dest: plans.mule.dest, items: plans.mule.items.map((i) => ({ res: i.res, qty: i.qty })) },
          cartbull: { dest: plans.cartbull.dest, items: plans.cartbull.items.map((i) => ({ res: i.res, qty: i.qty })) }
        },
        runs: { mule: serializeRun(runs.mule), cartbull: serializeRun(runs.cartbull) }
      }),
      (d) => {
        everOpened = !!d.eo;
        activeTab = d.tab || 'expedition';
        expeditionPhase = d.ep || 'idle';
        expeditionCollected = d.ec || 0;
        expeditionRemaining = d.er || 0;
        expeditionRidersAway = d.era || 0;
        ['mule', 'cartbull'].forEach((vk) => {
          const sp = (d.plans || {})[vk];
          if (sp) {
            plans[vk].dest = sp.dest || null;
            plans[vk].items = (sp.items || []).map((i) => ({ res: i.res, qty: i.qty }));
          }
          restoreRun(runs[vk], (d.runs || {})[vk]);
        });
      });

    function dispatchVehicle(vk, fromModal) {
      const r = runs[vk], plan = plans[vk];
      if (r.phase !== 'idle' || !plan.dest || plan.items.length === 0) return;
      r.run = plan.items.map((p) => ({ res: p.res, qty: p.qty, loaded: 0 }));
      r.phase = 'loading';
      r.destId = plan.dest;
      r.autoStarted = r.auto;
      window.OrbWeaver.Cards.reveal(vk === 'mule' ? resupplyMuleMechanic : cartBullMechanic);
      if (fromModal) window.OrbWeaver.Cards.closeModal();
    }

    function autoDisembark(vk) {
      runs[vk].ridersAway = 0;
      runs[vk].phase = 'traveling';
      runs[vk].remaining = VEHICLES[vk].travel;
      if (window.OrbWeaver.Cards.isModalOpenFor(cardIdFor(vk))) window.OrbWeaver.Cards.closeModal();
    }

    function disembarkVehicle(vk) {
      const r = runs[vk];
      if (r.phase !== 'loaded' || pool().getAssigned(cardIdFor(vk)) <= 0) return;
      r.ridersAway = pool().sequester(cardIdFor(vk));
      r.phase = 'traveling';
      r.remaining = VEHICLES[vk].travel;
      window.OrbWeaver.Cards.closeModal();
    }

    function cancelVehicle(vk) {
      const r = runs[vk];
      if (r.phase !== 'loading') return;
      r.run.forEach((it) => {
        const space = (window.OrbWeaver.Resources.getCap(it.res) ?? Infinity) - window.OrbWeaver.Resources.get(it.res);
        window.OrbWeaver.Resources.add(it.res, Math.min(it.loaded, space));
      });
      r.phase = 'idle'; r.run = null; r.auto = false; r.autoStarted = false;
      const cargoMechanic = vk === 'mule' ? resupplyMuleMechanic : cartBullMechanic;
      window.OrbWeaver.Cards.hide(cargoMechanic);
      if (window.OrbWeaver.Cards.isModalOpenFor(cardIdFor(vk))) window.OrbWeaver.Cards.closeModal();
      else if (window.OrbWeaver.Cards.isModalOpenFor(ID)) window.OrbWeaver.Cards.refreshOpenModal(ID);
    }

    function completeVehicle(vk) {
      const r = runs[vk];
      const dest = destinationById(r.destId);
      if (dest) {
        r.run.forEach((it) => {
          dest.ensureResource(it.res.replace(config.resourcePrefix, ''), displayName(it.res));
          window.OrbWeaver.Resources.add(dest.prefix + it.res.replace(config.resourcePrefix, ''), it.loaded);
        });
        dest.addWorkers(r.ridersAway);
      }
      window.OrbWeaver.Footer.push(`The ${VEHICLES[vk].label.toLowerCase()} arrived at ${dest ? dest.label : 'its destination'}!`);
      r.phase = 'idle'; r.run = null; r.ridersAway = 0; r.destId = null; r.autoStarted = r.auto;
      window.OrbWeaver.Cards.hide(vk === 'mule' ? resupplyMuleMechanic : cartBullMechanic);
    }

    document.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-sp-action]');
      if (!btn || btn.dataset.spLoc !== LOC) return;
      const action = btn.dataset.spAction, vk = btn.dataset.spVehicle;
      if (action === 'tab') { activeTab = btn.dataset.spTab; window.OrbWeaver.Cards.refreshOpenModal(ID); }
      else if (action === 'prepare-mule') prepareMule();
      else if (action === 'disembark-expedition') disembarkExpedition();
      else if (action === 'cancel-expedition') cancelExpedition();
      else if (action === 'toggle-auto') {
        runs[vk].auto = !runs[vk].auto;
        window.OrbWeaver.Cards.refreshOpenModal(ID);
      }
      else if (action === 'dispatch') dispatchVehicle(vk, true);
      else if (action === 'cancel-cargo') cancelVehicle(vk);
      else if (action === 'disembark-cargo') disembarkVehicle(vk);
      else if (action === 'remove-resource') {
        plans[vk].items = plans[vk].items.filter((p) => p.res !== btn.dataset.spRes);
        window.OrbWeaver.Cards.refreshOpenModal(ID);
      }
      else if (action === 'qty-edit') activateQtyEdit(btn, vk, btn.dataset.spRes);
    });
    document.addEventListener('change', (e) => {
      const addSel = e.target.closest(`[data-sp-action="add-resource"][data-sp-loc="${LOC}"]`);
      if (addSel && addSel.value) {
        const vk = addSel.dataset.spVehicle;
        const cap = VEHICLES[vk].cap;
        const used = plans[vk].items.reduce((a, p) => a + p.qty, 0);
        if (used >= cap) {
          const last = plans[vk].items[plans[vk].items.length - 1];
          if (last) last.qty = Math.max(1, last.qty - 1);
        }
        plans[vk].items.push({ res: addSel.value, qty: 1 });
        window.OrbWeaver.Cards.refreshOpenModal(ID);
        return;
      }
      const destSel = e.target.closest(`[data-sp-action="set-dest"][data-sp-loc="${LOC}"]`);
      if (destSel) plans[destSel.dataset.spVehicle].dest = destSel.value;
    });

    window.OrbWeaver.Mechanics.register(mechanic);
    if (expeditionMuleMechanic) window.OrbWeaver.Mechanics.register(expeditionMuleMechanic);
    window.OrbWeaver.Mechanics.register(resupplyMuleMechanic);
    window.OrbWeaver.Mechanics.register(cartBullMechanic);
  }

  window.OrbWeaver.ScoutStable = { create: createScoutStable };
})();

</script>
<script>
/* ============================================================
   CORE: GAME LOOP
   Fixed-timestep loop driven by the real clock, not by how often
   the browser bothers to call us.

   One tick is always TICK_RATE (0.2) seconds of GAME time and
   always costs BASE_INTERVAL (200ms) of REAL time at 1x speed.
   Every pump we ask the clock how much real time actually passed,
   bank it in `accumulator`, and run however many whole ticks we
   owe. Ticks are never stretched or shortened — only their COUNT
   varies — so the game behaves identically on a fast machine, a
   slow machine, and a throttled background tab.

   Why not plain setInterval: browsers throttle a backgrounded
   tab's intervals to roughly 1/second and sometimes suspend them.
   A loop that counts callbacks silently loses time. This one asks
   the clock instead, so a throttled pump simply runs 5 ticks at
   once and the game stays on schedule.

   Speed multiplier buys game time per real millisecond (10x = ten
   ticks per 200ms), rather than shortening the tick itself.

   MAX_CATCHUP_SECONDS caps how much the LIVE loop will ever make
   up in one pump, so returning to a tab after hours doesn't freeze
   the page. Anything longer belongs to the offline system, which
   drives runBulk() deliberately (see js/core/save.js, Stage 3).
   ============================================================ */
(function () {
  'use strict';
  window.OrbWeaver = window.OrbWeaver || {};

  const TICK_RATE = 0.2;          // seconds of game time per tick
  const BASE_INTERVAL = 200;      // ms of real time per tick at 1x
  const PUMP_INTERVAL = 50;       // how often we check the clock
  const MAX_CATCHUP_SECONDS = 30; // live catch-up ceiling
  const BULK_THRESHOLD = 4;       // above this many ticks in one pump, stop drawing

  let speedMult = 1;
  let pumpId = null;
  let lastNow = 0;
  let accumulator = 0; // unspent real ms, already scaled by speed

  /* One tick of simulation. Draws nothing itself — mechanics still
     call Cards.refresh(), which no-ops while rendering is suspended. */
  function step(tickRate) {
    const goldAvailable = window.OrbWeaver.Resources.get('gold') > 0;
    const mechanics = window.OrbWeaver.Mechanics.all();
    for (let i = 0; i < mechanics.length; i++) {
      const m = mechanics[i];
      // One misbehaving mechanic must not stop every mechanic after it
      // in the list. Log once per mechanic and keep the game running.
      try {
        m.tick(goldAvailable, tickRate);
      } catch (err) {
        if (!m._tickErrorLogged) {
          m._tickErrorLogged = true;
          console.error(`[Orb Weaver] ${m.id} threw during tick and was skipped:`, err);
          window.OrbWeaver.Footer.push(`Something went wrong in ${m.id} — see the browser console.`);
        }
      }
    }
    window.OrbWeaver.Upkeep.tick(tickRate);
  }

  /* Runs many ticks back-to-back with drawing switched off, then
     draws once at the end. Used for live catch-up and, later, for
     offline replay. `stepSeconds` lets the offline system replay in
     coarse 1-second steps instead of 0.2s ones. */
  function runBulk(ticks, stepSeconds, sampleEvery, onSample) {
    if (ticks <= 0) return;
    const rate = stepSeconds != null ? stepSeconds : TICK_RATE;
    const every = (sampleEvery > 0 && typeof onSample === 'function') ? sampleEvery : 0;
    window.OrbWeaver.Cards.setRenderEnabled(false);
    window.OrbWeaver.Resources.setRenderEnabled(false);
    try {
      for (let i = 0; i < ticks; i++) {
        step(rate);
        // Lets a caller observe the world mid-replay (offline catch-up
        // watches for the moment gold runs out) without re-enabling
        // rendering, which would repaint every resource each time.
        if (every && (i + 1) % every === 0) onSample(i + 1);
      }
    } finally {
      // Order matters: re-enabling resources repaints their readouts,
      // then the cards are refreshed against the settled numbers.
      window.OrbWeaver.Resources.setRenderEnabled(true);
      window.OrbWeaver.Cards.setRenderEnabled(true);
      window.OrbWeaver.Cards.refreshAll();
    }
  }

  function pump() {
    const now = performance.now();
    let elapsed = now - lastNow;
    lastNow = now;
    if (!(elapsed > 0)) elapsed = 0; // clock jumped backwards, or first call
    accumulator += elapsed * speedMult;

    const maxTicks = Math.ceil((MAX_CATCHUP_SECONDS * 1000) / BASE_INTERVAL);
    let ticks = Math.floor(accumulator / BASE_INTERVAL);
    if (ticks <= 0) return;
    if (ticks > maxTicks) {
      ticks = maxTicks;
      accumulator = 0; // discard the excess; offline replay owns long gaps
    } else {
      accumulator -= ticks * BASE_INTERVAL;
    }

    if (ticks >= BULK_THRESHOLD) runBulk(ticks, TICK_RATE);
    else for (let i = 0; i < ticks; i++) step(TICK_RATE);
  }

  function setSpeed(mult) {
    speedMult = mult;
    accumulator = 0; // don't let time banked at the old speed spill into the new one
    window.OrbWeaver.Footer.push(`Speed set to ${mult}x.`);
  }

  function start() {
    if (pumpId) return;
    lastNow = performance.now();
    accumulator = 0;
    pumpId = setInterval(pump, PUMP_INTERVAL);
  }

  function stop() {
    if (pumpId) { clearInterval(pumpId); pumpId = null; }
  }

  window.OrbWeaver.Loop = {
    start, stop, setSpeed, runBulk,
    isRunning: () => pumpId !== null,
    getSpeed: () => speedMult,
    // Progress-bar easing duration: how much real time one tick covers.
    getIntervalMs: () => BASE_INTERVAL / speedMult,
    TICK_RATE
  };
})();

</script>
<script>
/* ============================================================
   CORE: CHEAT MENU
   Wires the cheat header buttons (toggled via Settings).
   Cheats: Wood +100, Stone +100, Gold +100, Journals +50,
   Research Papers +500, Workers +5 (uncapped),
   Caps +1000 on every registered resource that has a cap,
   Speed 1x/2x/5x/10x (mutually exclusive, 1x resets to normal).
   ============================================================ */
(function () {
  'use strict';

  const el = (id) => document.getElementById(id);

  document.addEventListener('DOMContentLoaded', () => {
    const header = el('cheat-header');
    const toggle = el('cheat-toggle');
    let cheatsOn = true;

    const speedBtns = {
      1:  el('cheat-speed-1'),
      2:  el('cheat-speed-2'),
      5:  el('cheat-speed-5'),
      10: el('cheat-speed-10')
    };

    function setActiveSpeed(mult) {
      Object.keys(speedBtns).forEach((k) => {
        speedBtns[k].classList.toggle('active', parseInt(k) === mult);
      });
      window.OrbWeaver.Loop.setSpeed(mult);
    }

    toggle.classList.add('on');

    toggle.addEventListener('click', () => {
      cheatsOn = !cheatsOn;
      toggle.classList.toggle('on', cheatsOn);
      header.style.display = cheatsOn ? 'flex' : 'none';
    });

    el('cheat-wood').addEventListener('click', () => {
      const OW = window.OrbWeaver;
      OW.Locations.all().filter((l) => l.isDiscovered()).forEach((l) => OW.Resources.add(l.prefix + 'wood', 100));
      OW.Footer.push('Cheat: +100 wood to all discovered locations.');
    });

    el('cheat-stone').addEventListener('click', () => {
      const OW = window.OrbWeaver;
      OW.Locations.all().filter((l) => l.isDiscovered()).forEach((l) => OW.Resources.add(l.prefix + 'stone', 100));
      OW.Footer.push('Cheat: +100 stone to all discovered locations.');
    });

    el('cheat-null').addEventListener('click', () => {
      const OW = window.OrbWeaver;
      OW.Resources.all().forEach(({ id, current, wrap }) => {
        if (wrap && wrap.style.display !== 'none') OW.Resources.spend(id, current);
      });
      OW.Footer.push('Cheat: all visible resources zeroed.');
    });

    el('cheat-gold').addEventListener('click', () => {
      window.OrbWeaver.Resources.add('gold', 100);
      window.OrbWeaver.Footer.push('Cheat: +100 gold.');
    });

    el('cheat-journals').addEventListener('click', () => {
      window.OrbWeaver.Resources.add('journals', 50);
      window.OrbWeaver.Footer.push('Cheat: +50 journals.');
    });

    el('cheat-papers').addEventListener('click', () => {
      window.OrbWeaver.Resources.add('researchpapers', 500);
      window.OrbWeaver.Footer.push('Cheat: +500 research papers.');
    });

    el('cheat-workers').addEventListener('click', () => {
      window.OrbWeaver.Locations.all()
        .filter((l) => l.isDiscovered())
        .forEach((l) => l.addWorkers(5));
      window.OrbWeaver.Footer.push('Cheat: +5 workers to every discovered location.');
    });

    el('cheat-loc').addEventListener('click', () => {
      const OW = window.OrbWeaver;
      if (OW.Mountains) OW.Mountains.reveal();
      if (OW.SandDunes) OW.SandDunes.reveal();
      OW.Footer.push('Cheat: Locations revealed.');
    });

    el('cheat-all').addEventListener('click', () => {
      const OW = window.OrbWeaver;
      // Reveal destinations (their own section + left-hand group, not just
      // their card) — no in-game trigger exists for Sand Dunes yet.
      if (OW.Mountains) OW.Mountains.reveal();
      if (OW.SandDunes) OW.SandDunes.reveal();
      // Reveal all hidden cards and resources
      OW.Mechanics.all().forEach((m) => OW.Cards.reveal(m));
      OW.Resources.all().forEach(({ id }) => OW.Resources.reveal(id));
      // Complete all upgrades/construction on every mechanic
      OW.Mechanics.all().forEach((m) => { if (m.cheatCompleteAll) m.cheatCompleteAll(); });
      // Fill all resources to cap
      OW.Resources.all().forEach(({ id, cap }) => { if (cap != null) OW.Resources.add(id, cap); });
      // Set workers to 50
      const needed = 50 - OW.Workers.getTotal();
      if (needed > 0) OW.Workers.addWorkers(needed);
      OW.Footer.push('Cheat: ALL — everything unlocked, resources filled, 50 workers.');
    });

    el('cheat-caps').addEventListener('click', () => {
      window.OrbWeaver.Resources.all().forEach(({ id, cap }) => {
        if (cap != null) window.OrbWeaver.Resources.setCap(id, cap + 1000);
      });
      window.OrbWeaver.Footer.push('Cheat: all caps +1000.');
    });

    el('cheat-speed-1').addEventListener('click',  () => setActiveSpeed(1));
    el('cheat-speed-2').addEventListener('click',  () => setActiveSpeed(2));
    el('cheat-speed-5').addEventListener('click',  () => setActiveSpeed(5));
    el('cheat-speed-10').addEventListener('click', () => setActiveSpeed(10));
  });
})();

</script>

<script>
/* ============================================================
   MECHANIC: CAMP (formerly Builder's Bench)
   Not a resource — no left-hand row. Visible from the very start of
   the game (first card, no reveal gate). One track:

   Construction list (bottom bar, one item at a time): cards Camp can
   build for the player. Each item needs its full cost paid up front
   (no partial auto-collection) and drops off the list for good once
   built. Everything below is available from the start.

   Camp no longer has a self-upgrade ladder or a renaming card name —
   the top bar is a reserved-but-unused stub (getUpgradeBarPct: () => 0)
   for a future mechanic to claim, same convention as every other card
   that doesn't use it.

   Card face: "Click to open" until first opened; once opened, idle
   reads "{n} to build" (Construction items still available) or blank
   once none remain; building reads "Building X – Ys".
   ============================================================ */
(function () {
  'use strict';
  window.OrbWeaver = window.OrbWeaver || {};

  const ID = 'buildersbench';

  const CONSTRUCTION_ITEMS = [
    { id: 'tents', name: 'Tents', buildTime: 2, costRaw: '15 wood', startAvailable: true },
    { id: 'stonepit', name: 'Stone Pit', buildTime: 3, costRaw: '20 wood', startAvailable: true },
    { id: 'market', name: 'Market Stall', buildTime: 10, costRaw: '50 wood, 20 stone', startAvailable: true },
    { id: 'scoutspen', name: "Scout's Pen", buildTime: 45, costRaw: '225 wood, 50 stone', startAvailable: true },
    { id: 'academy', name: 'Academy', buildTime: 120, costRaw: '550 wood, 550 stone', startAvailable: true }
  ];

  let opened = false;
  let paused = false;
  let goldStarved = false;

  function onConstructionComplete(id) {
    if (id === 'stonepit') {
      window.OrbWeaver.Resources.reveal('stone');
      window.OrbWeaver.Cards.reveal(window.OrbWeaver.Mechanics.get('stone'));
    } else if (id === 'market') {
      window.OrbWeaver.Cards.reveal(window.OrbWeaver.Mechanics.get('market'));
    } else if (id === 'tents') {
      window.OrbWeaver.Cards.reveal(window.OrbWeaver.Mechanics.get('tents'));
    } else if (id === 'scoutspen') {
      window.OrbWeaver.Cards.reveal(window.OrbWeaver.Mechanics.get('scoutspen'));
    } else if (id === 'academy') {
      window.OrbWeaver.Cards.reveal(window.OrbWeaver.Mechanics.get('academy'));
      window.OrbWeaver.Resources.reveal('researchpapers');
      window.OrbWeaver.Resources.reveal('journals');
    }
    window.OrbWeaver.Cards.refreshOpenModal(ID);
  }

  const buildTrack = window.OrbWeaver.Upgrades.createChoiceTrack(CONSTRUCTION_ITEMS, onConstructionComplete);
  window.OrbWeaver.Upgrades.registerTrack(`${ID}:build`, buildTrack);

  const mechanic = {
    id: ID,
    section: 'Camp',
    buildTrackKey: 'build',
    cardName: () => 'Camp',
    isBillable: () => buildTrack.isBuilding(),
    isBuildBarFaded: () => buildTrack.getQueuedItem() !== null && !buildTrack.isBuilding(),
    onOpen() { opened = true; },
    getStatText() {
      if (!opened) return 'Click to open';
      if (buildTrack.isBuilding()) {
        const item = buildTrack.activeItem();
        const secs = Math.ceil(buildTrack.getRemaining());
        return (paused || goldStarved) ? `Stopped ${item.name} – ${secs}s` : `Building ${item.name} – ${secs}s`;
      }
      const queued = buildTrack.getQueuedItem();
      if (queued) return `Queued ${queued.name} – waiting`;
      const remaining = buildTrack.availableCount();
      if (remaining <= 0) return '';
      const assigned = window.OrbWeaver.Workers.getAssigned(ID);
      return assigned > 0 ? `Stopped – ${remaining} to build` : `${remaining} to build`;
    },
    getUpgradeBarPct: () => 0,
    getBuildBarPct() {
      if (buildTrack.isBuilding()) return buildTrack.getProgressPct();
      if (buildTrack.getQueuedItem()) return buildTrack.getQueueFillPct();
      return 0;
    },
    getWorkerDesc: () => {
      const assigned = window.OrbWeaver.Workers.getAssigned(ID);
      return assigned === 0 ? '' : `Builds ${window.OrbWeaver.Upgrades.formatRate(assigned * window.OrbWeaver.Upgrades.getBaseSPW())}s faster`;
    },
    cheatCompleteAll() { buildTrack.completeAll(); },
    patchLiveTrack: () => buildTrack.patchModalRows(),
    renderModalHTML() {
      return `<div class="bench-modal">${buildTrack.renderModalRows(ID, 'build')}</div>`;
    },
    tick(goldAvailable, tickRate) {
      goldStarved = !goldAvailable;
      const assigned = window.OrbWeaver.Workers.getAssigned(ID);
      const spw = window.OrbWeaver.Upgrades.getBaseSPW();

      // Auto-start queued item when both a worker is assigned and resources are met.
      const queued = buildTrack.getQueuedItem();
      if (queued && assigned > 0 && goldAvailable) {
        buildTrack.start(queued.id);
        if (buildTrack.isBuilding()) buildTrack.dequeue();
      }

      if (buildTrack.isBuilding()) {
        paused = assigned === 0;
        if (!paused && goldAvailable) buildTrack.advanceTimer(tickRate, assigned, spw);
      } else {
        paused = false;
      }

      window.OrbWeaver.Cards.refresh(mechanic);
    }
  };

  /* ---- Save/load ----
     The construction track saves itself, and replays each completed
     item's onComplete on load — that is what re-reveals Stone, Market,
     Tents, Scout's Pen and Academy. `paused` and `goldStarved` are
     recomputed on the next tick, so neither is stored. */
  window.OrbWeaver.Save.register(ID,
    () => ({ o: opened ? 1 : 0 }),
    (d) => { opened = !!d.o; });

  window.OrbWeaver.Mechanics.register(mechanic);
})();

</script>
<script>
/* ============================================================
   MECHANIC: WOOD
   Data + status glue only. All shared behavior from js/core/.
   Card stat states: empty (0 workers) | x/s (producing) | Stopped.
   Sub-rate label (+x/s) shown under the Wood resource row while
   producing; hidden when idle or stopped.
   ============================================================ */
(function () {
  'use strict';
  window.OrbWeaver = window.OrbWeaver || {};

  const ID = 'wood';

  const UPGRADE_TABLE = [
    { name: 'Wood Pile',        gainPerWorker: 1.3,  buildTime: 60,  costRaw: '200 wood',               newCap: 400  },
    { name: 'Wood Shed',        gainPerWorker: 1.95, buildTime: 120, costRaw: '400 wood, 50 stone',      newCap: 600  },
    { name: 'Wood Hut',         gainPerWorker: 2.6,  buildTime: 180, costRaw: '600 wood, 100 stone',     newCap: 800  },
    { name: 'Wood Store',       gainPerWorker: 5.0,  buildTime: 240, costRaw: '800 wood, 150 stone',     newCap: 1000 },
    { name: 'Lumber Yard',      gainPerWorker: 3.25, buildTime: 420, costRaw: '100 plywood, 300 stone',  newCap: 2000 },
    { name: 'Lumber Lodge',     gainPerWorker: 3.9,  buildTime: 540, costRaw: '200 plywood, 400 stone',  newCap: 3000 },
    { name: 'Lumber Hall',      gainPerWorker: 4.55, buildTime: 720, costRaw: '300 plywood, 100 brick',  newCap: 4000 },
    { name: 'Lumber Depot',     gainPerWorker: 5.2,  buildTime: 840, costRaw: '400 plywood, 200 brick',  newCap: 7000 },
    { name: 'Lumber Warehouse', gainPerWorker: 5.85, buildTime: 960, costRaw: '500 plywood, 300 brick',  newCap: 9000 }
  ];

  let cardName = 'Wood';
  let gainPerWorker = 0.65;
  let status = 'idle'; // idle | producing | stopped

  const track = window.OrbWeaver.Upgrades.create(UPGRADE_TABLE);
  window.OrbWeaver.Upgrades.registerTrack(ID, track);

  const mechanic = {
    id: ID,
    section: 'Camp',
    cardName: () => cardName,
    getStatText() {
      const assigned = window.OrbWeaver.Workers.getAssigned(ID);
      const collecting = track.isCollecting();
      if (assigned === 0) return collecting ? 'Collecting' : '';
      if (status === 'stopped') return collecting ? 'Stopped – Collecting' : 'Stopped';
      return `${(assigned * gainPerWorker).toFixed(2)}/s${collecting ? ' – Collecting' : ''}`;
    },
    getUpgradeBarPct: () => track.getBarPct(),
    isUpgradeCollecting: () => track.isCollecting(),
    getWorkerDesc: () => {
      const assigned = window.OrbWeaver.Workers.getAssigned(ID);
      return assigned === 0 ? '' : `Chops ${window.OrbWeaver.Upgrades.formatRate(assigned * gainPerWorker)} wood`;
    },
    patchUpgradeCost: () => track.getResourceTracker(),
    patchCollectPct: () => track.getCollectPct(),
    patchBuildStatus: () => track.getBuildStatusText(),
    cheatCompleteAll() {
      track.skipAll((row) => { cardName = row.name; gainPerWorker = row.gainPerWorker; window.OrbWeaver.Resources.setCap(ID, row.newCap); });
    },
    renderModalHTML: () => track.renderModalHTML(ID, { cap: window.OrbWeaver.Resources.getCap(ID), rate: gainPerWorker }),
    tick(goldAvailable, tickRate) {
      const assigned = window.OrbWeaver.Workers.getAssigned(ID);
      const atCap = window.OrbWeaver.Resources.isAtCap(ID);
      if (assigned === 0) {
        status = 'idle';
        window.OrbWeaver.Resources.setSubRate(ID, null);
      } else if (!goldAvailable || atCap) {
        status = 'stopped';
        window.OrbWeaver.Resources.setSubRate(ID, atCap ? `+${(assigned * gainPerWorker).toFixed(2)}/s` : null);
      } else {
        status = 'producing';
        const perSec = assigned * gainPerWorker;
        window.OrbWeaver.Resources.add(ID, perSec * tickRate);
        window.OrbWeaver.Resources.setSubRate(ID, `+${perSec.toFixed(2)}/s`);
      }

      if (track.isBuilding()) {
        track.advanceTimer(tickRate, assigned, (row) => {
          cardName = row.name;
          gainPerWorker = row.gainPerWorker;
          window.OrbWeaver.Resources.setCap(ID, row.newCap);
        });
      }

      window.OrbWeaver.Cards.refresh(mechanic);
    }
  };

  /* ---- Save/load ----
     Nothing of this card's own is stored. cardName, gainPerWorker and
     the resource cap are all DERIVED from how far up the ladder the
     player is, so the track's index (saved by the track itself) is the
     entire state. Replaying the table on load means editing these
     numbers later reaches existing saves instead of stranding players
     on whatever values they last played with. */
  window.OrbWeaver.Save.register(ID, null, () => {
    // Only the LAST completed row is applied. Walking the table row by
    // row would call setCap() with each tier's smaller cap in turn, and
    // setCap clamps current down to the new cap — which silently robbed
    // the player of everything above tier one's cap on every load.
    const reached = Math.min(track.getIndex(), UPGRADE_TABLE.length);
    if (reached <= 0) return;
    const row = UPGRADE_TABLE[reached - 1];
    if (!row) return;
    cardName = row.name;
    gainPerWorker = row.gainPerWorker;
    window.OrbWeaver.Resources.setCap(ID, row.newCap);
  });

  window.OrbWeaver.Mechanics.register(mechanic);
})();

   Card stat states: empty (0 workers) | x/s (producing) | Stopped.
   Sub-rate label (+x/s) shown under the Stone resource row while

(function () {

  window.OrbWeaver = window.OrbWeaver || {};

  const UPGRADE_TABLE = [
    { name: 'Stone Pile',       gainPerWorker: 2.26,  buildTime: 60,  costRaw: '450 stone',                   newCap: 600   },
    { name: 'Stone Shed',       gainPerWorker: 3.39,  buildTime: 120, costRaw: '600 stone, 50 wood',           newCap: 700   },
    { name: 'Quarry Pit',       gainPerWorker: 9.04,  buildTime: 180, costRaw: '100 bricks, 100 wood',         newCap: 800   },
    { name: 'Quarry Shed',      gainPerWorker: 10.17, buildTime: 240, costRaw: '300 bricks, 200 wood',         newCap: 900   },
    { name: 'Quarry Yard',      gainPerWorker: 11.3,  buildTime: 420, costRaw: '500 bricks, 1000 wood',        newCap: 1000  },
    { name: 'Mason Hall',       gainPerWorker: 18.08, buildTime: 540, costRaw: '700 bricks, 300 plywood',      newCap: 2000  },

      if (assigned === 0) return collecting ? 'Collecting' : '';
      if (status === 'stopped') return collecting ? 'Stopped – Collecting' : 'Stopped';
      return `${(assigned * gainPerWorker).toFixed(2)}/s${collecting ? ' – Collecting' : ''}`;
    },
    getUpgradeBarPct: () => track.getBarPct(),

    getWorkerDesc: () => {

    patchUpgradeCost: () => track.getResourceTracker(),

    cheatCompleteAll() {

        track.advanceTimer(tickRate, assigned, (row) => {
          cardName = row.name;
          gainPerWorker = row.gainPerWorker;

        });
      }

      window.OrbWeaver.Cards.refresh(mechanic);
    }
  };

  /* ---- Save/load ----
     Nothing of this card's own is stored. cardName, gainPerWorker and
     the resource cap are all DERIVED from how far up the ladder the
     player is, so the track's index (saved by the track itself) is the
     entire state. Replaying the table on load means editing these
     numbers later reaches existing saves instead of stranding players
     on whatever values they last played with. */
  window.OrbWeaver.Save.register(ID, null, () => {
    // Only the LAST completed row is applied. Walking the table row by
    // row would call setCap() with each tier's smaller cap in turn, and
    // setCap clamps current down to the new cap — which silently robbed
    // the player of everything above tier one's cap on every load.
    const reached = Math.min(track.getIndex(), UPGRADE_TABLE.length);
    if (reached <= 0) return;
    const row = UPGRADE_TABLE[reached - 1];
    if (!row) return;
    cardName = row.name;
    gainPerWorker = row.gainPerWorker;
    window.OrbWeaver.Resources.setCap(ID, row.newCap);
  });

  window.OrbWeaver.Mechanics.register(mechanic);
})();
