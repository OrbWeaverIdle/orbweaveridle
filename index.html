<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orb Weaver</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
<div id="cheat-header" style="display:flex">
    <span class="cheat-label">CHEATS</span>
    <button class="cheat-btn" id="cheat-wood">Wood +100</button>
    <button class="cheat-btn" id="cheat-stone">Stone +100</button>
    <button class="cheat-btn" id="cheat-gold">Gold +100</button>
    <button class="cheat-btn" id="cheat-workers">Workers +5</button>
    <button class="cheat-btn" id="cheat-caps">Caps +1000</button>
    <span class="cheat-divider">|</span>
    <button class="cheat-btn" id="cheat-speed-2">2x</button>
    <button class="cheat-btn" id="cheat-speed-5">5x</button>
    <button class="cheat-btn" id="cheat-speed-10">10x</button>
    <button class="cheat-btn" id="cheat-speed-1">1x</button>
  </div>
  <div id="main-wrap">

    <!-- ============ LEFT-HAND PANE ============ -->
    <aside id="left-hand">
      <button id="settings-gear-btn" title="Settings">⚙</button>
      <div class="side-label">Resources</div>
      <div id="left-hand-real-resources"></div>
      <div id="left-hand-resources"></div>
      <!-- Mountains section injected by scoutspen.js when mule arrives -->
      <div id="left-hand-mountains"></div>
    </aside>

    <!-- ============ RIGHT-HAND PANE ============ -->
    <main id="right-hand">

      <div class="section-label" data-section="camp">
        Camp <span class="section-collapse-arrow">▾</span>
      </div>
      <div class="card-grid" id="grid-camp"></div>

      <!-- Mountains section injected by scoutspen.js when mule arrives -->
      <div id="right-hand-mountains"></div>

      <div id="right-hand-placeholder-mount"></div>

    </main>

  </div>

  <footer id="context-footer"><span id="context-footer-text"></span></footer>

</div>

<!-- ============ GENERIC CARD DETAIL MODAL ============ -->
<div class="modal-scrim" id="card-modal-scrim">
  <div class="modal-win" id="card-modal-win">
    <div class="modal-header">
      <div class="modal-header-top">
        <div id="card-modal-header-left"></div>
        <div class="modal-title" id="card-modal-title">Card Title</div>
        <button class="modal-close" id="card-modal-close">✕</button>
      </div>
      <div id="card-modal-header-sub"></div>
    </div>
    <div class="modal-body" id="card-modal-body"></div>
  </div>
</div>

<!-- ============ SETTINGS MODAL ============ -->
<div class="modal-scrim" id="settings-modal-scrim">
  <div class="modal-win" id="settings-modal-win">
    <div class="modal-header">
      <div class="modal-title brand-title">Orb Weaver</div>
      <button class="modal-close" id="settings-modal-close">✕</button>
    </div>
    <div class="modal-body">
      <div class="settings-row">
        <span>Show placeholder examples</span>
        <div class="toggle-switch" id="placeholder-toggle"></div>
      </div>
      <div class="settings-row">
        <span>Cheat menu</span>
        <div class="toggle-switch" id="cheat-toggle"></div>
      </div>
    </div>
  </div>
</div>

<script src="script.js"></script>

<!-- CORE MECHANICS ENGINE -->
<script src="js/core/resources.js"></script>
<script src="js/core/footer.js"></script>
<script src="js/core/workers.js"></script>
<script src="js/core/upkeep.js"></script>
<script src="js/core/registry.js"></script>
<script src="js/core/upgrades.js"></script>
<script src="js/core/cards.js"></script>
<script src="js/core/loop.js"></script>
<script src="js/core/cheats.js"></script>

<!-- MECHANIC FILES -->
<script src="js/mechanics/wood.js"></script>
<script src="js/mechanics/stone.js"></script>
<script src="js/mechanics/buildersbench.js"></script>
<script src="js/mechanics/market.js"></script>
<script src="js/mechanics/campsite.js"></script>
<script src="js/mechanics/scoutspen.js"></script>
<script src="js/mechanics/mountains.js"></script>
<script src="js/mechanics/iron.js"></script>
<script src="js/mechanics/mountainsbench.js"></script>

<script src="js/main.js"></script>
<script src="placeholders.js"></script>
</body>
</html>
